<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Temple Builder</title>
<!-- Design prototype for the 1 Corinthians 3 "Temple Builder". Not wired into the app yet:
     the buttons on the right simulate days of logging so you can watch weeks and months of building. -->
<style>
  :root { --ink: #1f2430; --muted: #5b6170; --bg: #fff8ee; --shadow: 0 6px 0 rgba(0,0,0,.08), 0 12px 30px rgba(60,40,10,.08); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  .app { display: grid; grid-template-columns: 1fr 340px; height: 100vh; }
  .stage-area { position: relative; overflow: hidden; background: linear-gradient(#7ec4ff 0%, #bfe3ff 45%, #fff1d6 100%); transition: background 1.2s; }
  .stage-area.dusk { background: linear-gradient(#1d1533 0%, #5a2a4a 45%, #e0703a 100%); }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; }
  .title { position: absolute; top: 16px; left: 22px; margin: 0; font-size: 38px; font-weight: 900; color: #2b1d08; text-shadow: 0 2px 0 rgba(255,255,255,.6); z-index: 2; }
  .title small { display: block; font-size: 17px; font-weight: 700; color: #5b4a2a; }
  .stage-area.dusk .title, .stage-area.dusk .title small { color: #ffe9c2; text-shadow: none; }
  .caption { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 3;
    background: rgba(20,14,8,.82); color: #fff; padding: 14px 26px; border-radius: 22px;
    font-size: 24px; font-weight: 800; max-width: 88%; text-align: center; opacity: 0; transition: opacity .4s; }
  .caption.show { opacity: 1; }
  .caption.danger { background: rgba(160,20,10,.9); }
  .caption em { display: block; font-size: 16px; font-weight: 600; opacity: .85; font-style: normal; }
  .danger-banner { position: absolute; top: 96px; left: 50%; transform: translateX(-50%); z-index: 3;
    background: #c81e1e; color: #fff; font-weight: 900; font-size: 22px; padding: 10px 22px; border-radius: 16px;
    box-shadow: 0 6px 0 #7f1010; display: none; animation: pulse 1s ease-in-out infinite; white-space: nowrap; }
  .danger-banner.show { display: block; }
  @keyframes pulse { 50% { transform: translateX(-50%) scale(1.05); } }
  .shimmer { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: soft-light;
    background: linear-gradient(105deg, transparent 42%, rgba(255,255,255,.95) 50%, transparent 58%);
    background-size: 300% 100%; animation: shimmer 8s ease-in-out infinite; }
  @keyframes shimmer { 0%, 70% { background-position: 150% 0; } 100% { background-position: -50% 0; } }

  /* the building tilts toward its weak side and shakes when it is close to falling */
  #bld { transform-box: view-box; transform-origin: 375px 374px; transform: rotate(var(--lean, 0deg)); transition: transform 1.6s cubic-bezier(.3,1.3,.5,1); }
  #bld.shake { animation: shake .5s linear infinite; }
  #bld.shake.hard { animation-duration: .28s; }
  @keyframes shake {
    0%, 100% { transform: rotate(var(--lean)) translateX(0); }
    25% { transform: rotate(calc(var(--lean) + .5deg)) translateX(1.5px); }
    75% { transform: rotate(calc(var(--lean) - .4deg)) translateX(-1.5px); }
  }
  .cell { cursor: pointer; transform-box: fill-box; transform-origin: center; }
  .cell.drop { animation: drop .45s cubic-bezier(.3,1.5,.5,1); }
  .cell.char { animation: char .8s ease-in forwards; }
  .cell.fall { animation: fall 1.4s cubic-bezier(.5,0,.9,.6) forwards; }
  .cell.click { animation: click .5s ease-out; }
  .refine { animation: refine 1.4s ease-out; }
  @keyframes drop { from { transform: translateY(-60px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes char {
    0% { filter: none; }
    30% { filter: brightness(1.9) sepia(1) saturate(5) hue-rotate(-25deg); }
    65% { filter: brightness(.2); opacity: 1; transform: none; }
    100% { filter: brightness(.05); opacity: 0; transform: translateY(-16px) scale(.5); }
  }
  @keyframes fall { 0% { transform: none; } 15% { transform: translate(calc(var(--tx) * .1), -4px) rotate(calc(var(--rot) * .1)); } 100% { transform: translate(var(--tx), 420px) rotate(var(--rot)); opacity: .2; } }
  @keyframes click { 0% { transform: scale(1.25); filter: brightness(1.6); } 100% { transform: none; filter: none; } }
  @keyframes refine { 0% { filter: none; } 40% { filter: brightness(1.8) saturate(1.4); } 100% { filter: none; } }
  .wing { animation: flap .06s linear infinite alternate; transform-box: fill-box; transform-origin: center bottom; }
  @keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(.3); } }
  .ember-dot { animation: glowdot 1.3s ease-in-out infinite alternate; }
  @keyframes glowdot { from { opacity: .3; } to { opacity: 1; } }
  .flames { animation: sweep 3.4s linear forwards; }
  .flames path { animation: flicker .22s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: bottom; }
  .flames path:nth-child(2n) { animation-duration: .31s; }
  @keyframes sweep { from { transform: translateX(-500px); } to { transform: translateX(1100px); } }
  @keyframes flicker { from { transform: scaleY(.88) skewX(-4deg); } to { transform: scaleY(1.1) skewX(4deg); } }
  .spark-up { animation: sparkup 1.6s ease-out forwards; }
  @keyframes sparkup { to { transform: translateY(-120px); opacity: 0; } }
  .debris { animation: debris 1.2s ease-in forwards; }
  @keyframes debris { to { transform: translateY(200px) rotate(200deg); opacity: 0; } }
  .twinkle { animation: twinkle 1.1s ease-out forwards; transform-box: fill-box; transform-origin: center; }
  @keyframes twinkle { 0% { transform: scale(0); opacity: 0; } 40% { transform: scale(1.3); opacity: 1; } 100% { transform: scale(0) rotate(90deg); opacity: 0; } }

  /* ----- panel ----- */
  .panel { background: #fffdf8; border-left: 1px solid #eadfce; padding: 16px 16px 22px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
  .panel h2 { margin: 0 0 6px; font-size: 19px; }
  .box { background: #fff; border-radius: 18px; box-shadow: var(--shadow); padding: 12px 14px; }
  .stage-row { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 6px; margin: 4px 0; font-weight: 800; font-size: 15px; }
  .stage-row .ic { font-size: 20px; }
  .stage-row .bar { grid-column: 2 / 4; height: 8px; border-radius: 6px; background: #efe7da; overflow: hidden; margin-top: -3px; }
  .stage-row .bar i { display: block; height: 100%; background: linear-gradient(90deg, #f2c94c, #d4a017); }
  .stage-row.sealed .bar i { background: linear-gradient(90deg, #6ee7b7, #10b981); }
  .meter { height: 14px; border-radius: 8px; background: #efe7da; overflow: hidden; margin: 6px 0 2px; }
  .meter i { display: block; height: 100%; transition: width .6s; }
  .stab { font-size: 20px; font-weight: 900; }
  .stab small { display: block; font-size: 14px; font-weight: 600; color: var(--muted); }
  .stab.bad { color: #b91c1c; }
  .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 8px; font-size: 13px; font-weight: 700; }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .legend svg { width: 26px; height: 19px; flex: none; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  button { font: inherit; border: 0; border-radius: 16px; min-height: 58px; padding: 0 8px; font-size: 17px; font-weight: 800;
    background: #fff; box-shadow: var(--shadow); color: var(--ink); cursor: pointer; }
  button:active { transform: translateY(3px); }
  button.fire { grid-column: 1 / 3; background: linear-gradient(135deg, #ff9a3c, #e8501b); color: #fff; font-size: 21px; }
  button.wide { grid-column: 1 / 3; }
  button:disabled { opacity: .4; }
  .log { font-size: 13px; color: var(--muted); font-weight: 600; min-height: 36px; margin: 8px 0 0; }
  #tip { position: fixed; z-index: 10; pointer-events: none; background: #1f2430; color: #fff; padding: 8px 14px;
    border-radius: 12px; font-size: 16px; font-weight: 800; opacity: 0; transition: opacity .2s; white-space: nowrap; }
  #tip.show { opacity: 1; }
  @media (max-width: 900px) { .app { grid-template-columns: 1fr; grid-template-rows: 62vh auto; height: auto; } }
</style>
</head>
<body>
<div class="app">
  <div class="stage-area" id="area">
    <h1 class="title">My Temple<small id="subtitle">Day 0 · built on Jesus Christ</small></h1>
    <div class="danger-banner" id="danger">⚠️ ABOUT TO TOPPLE! Fill the burnt gaps before the next fire</div>
    <svg id="scene" viewBox="-50 -70 850 545" preserveAspectRatio="xMidYMid meet" aria-label="Temple building"></svg>
    <div class="shimmer"></div>
    <div class="caption" id="caption"></div>
  </div>
  <aside class="panel">
    <div class="box"><h2>Building stages</h2><div id="stages"></div></div>
    <div class="box">
      <h2>🔥 Fire forecast</h2>
      <div class="meter"><i id="forecastBar"></i></div>
      <div class="stab" id="forecast"></div>
    </div>
    <div class="box"><div class="stab" id="stab"></div></div>
    <div class="box"><h2>What builds what</h2><div class="legend" id="legend"></div></div>
    <div class="box">
      <h2>Try it (simulate days)</h2>
      <div class="btns">
        <button data-act="great">🌟 Great day</button>
        <button data-act="mixed">🙂 Mixed day</button>
        <button data-act="hard">😣 Hard day</button>
        <button data-act="sorry">🫂 Made it right</button>
        <button class="fire" data-act="fire">🔥 Test by fire</button>
        <button data-act="week">⏩ 1 week</button>
        <button data-act="month">⏩ 1 month</button>
        <button class="wide" data-act="reset">↺ Start again</button>
      </div>
      <p class="log" id="log">Tap a day to start building. Tap any stone to see what built it.</p>
    </div>
  </aside>
</div>
<div id="tip"></div>

<script>
// ---------- blueprint ----------
// Front view of the temple. F = foundation (already laid: Jesus Christ), W wall, C column, G pearl gate,
// E cornice, T towers, R pediment, D dome, S spire. Each letter is one stone a child builds.
const MAP = [
  '............S............',
  '............S............',
  '..T.......DDDDD.......T..',
  '.TTT.....DDDDDDD.....TTT.',
  '.TTT....DDDDDDDDD....TTT.',
  '.TTT...DDDDDDDDDDD...TTT.',
  '.TTT...DDDDDDDDDDD...TTT.',
  '.TTT.RRRRRRRRRRRRRRR.TTT.',
  '.TTTRRRRRRRRRRRRRRRRRTTT.',
  'EEEEEEEEEEEEEEEEEEEEEEEEE',
  'WCWWCWWCWWGGGGGWWCWWCWWCW',
  'WCWWCWWCWGG...GGWCWWCWWCW',
  'WCWWCWWCWG.....GWCWWCWWCW',
  'WCWWCWWCWG.....GWCWWCWWCW',
  'WCWWCWWCWG.....GWCWWCWWCW',
  'WCWWCWWCWG.....GWCWWCWWCW',
  'WCWWCWWCWG.....GWCWWCWWCW',
  'FFFFFFFFFFFFFFFFFFFFFFFFF',
  'FFFFFFFFFFFFFFFFFFFFFFFFF',
];
const CW = 30, CH = 22;
const STAGES = [
  { name: 'Walls and columns', icon: '🏛️', test: (r, ch) => r >= 12 && r <= 16 },
  { name: 'Pearl gate', icon: '🚪', test: (r, ch) => r === 10 || r === 11 },
  { name: 'Cornice and towers', icon: '🗼', test: (r, ch) => r === 9 || ch === 'T' },
  { name: 'Pediment', icon: '🔺', test: (r, ch) => ch === 'R' },
  { name: 'Golden dome', icon: '🕌', test: (r, ch) => ch === 'D' || ch === 'S' },
];
const SLOTS = [];
const taken = new Set();
STAGES.forEach((s, si) => {
  const cells = [];
  MAP.forEach((row, r) => [...row].forEach((ch, c) => {
    if (ch === '.' || ch === 'F' || taken.has(`${r},${c}`) || !s.test(r, ch)) return;
    taken.add(`${r},${c}`);
    cells.push({ r, c, ch });
  }));
  // Build from the bottom up, from the middle outward.
  cells.sort((a, b) => b.r - a.r || Math.abs(a.c - 12) - Math.abs(b.c - 12) || a.c - b.c);
  s.start = SLOTS.length;
  cells.forEach((x) => SLOTS.push({ ...x, stage: si }));
  s.end = SLOTS.length;
});
const slotAt = new Map(SLOTS.map((s, i) => [`${s.r},${s.c}`, i]));

// ---------- materials ----------
// Fruit of the Spirit map to the Revelation 21 foundation stones: [name, fruit, light, base, dark].
const GEMS = {
  carnelian:  ['Carnelian', 'Love', '#ff8a8a', '#e0102f', '#6e0014'],
  topaz:      ['Topaz', 'Joy', '#ffe27a', '#ffa400', '#9a5200'],
  sapphire:   ['Sapphire', 'Peace', '#7ab8ff', '#1450f5', '#081f7a'],
  chalcedony: ['Chalcedony', 'Patience', '#cfc6ff', '#7563ff', '#3424a8'],
  emerald:    ['Emerald', 'Kindness', '#7dffb6', '#00b25e', '#00502b'],
  chrysolite: ['Chrysolite', 'Goodness', '#f1ff7a', '#b4dc00', '#5b7400'],
  jasper:     ['Jasper', 'Faithfulness', '#ffffff', '#c8ecff', '#5aa6cc'],
  beryl:      ['Beryl', 'Gentleness', '#8ff8ff', '#00c2dd', '#00687a'],
  amethyst:   ['Amethyst', 'Self-control', '#eaa8ff', '#a12cff', '#46087f'],
};
const MAT = {
  gold:    { name: 'Gold', src: 'Prayer', burns: false },
  silver:  { name: 'Silver', src: 'Kind words / making peace', burns: false },
  pearl:   { name: 'Pearl', src: 'Owned up and made it right', burns: false },
  wood:    { name: 'Rotten wood', src: 'Fighting', burns: true },
  hay:     { name: 'Mouldy hay', src: 'Tantrum / disobeying', burns: true },
  stubble: { name: 'Stubble', src: 'Rude words', burns: true },
};
for (const [id, [name, fruit]] of Object.entries(GEMS)) MAT['gem-' + id] = { name, src: fruit, burns: false, gem: id };
const GEM_IDS = Object.keys(MAT).filter((m) => MAT[m].gem);
const BURNS = ['wood', 'hay', 'stubble'];

// ---------- drawing the stones ----------
const chamfer = (x0, y0, x1, y1, c) => `${x0 + c},${y0} ${x1 - c},${y0} ${x1},${y0 + c} ${x1},${y1 - c} ${x1 - c},${y1} ${x0 + c},${y1} ${x0},${y1 - c} ${x0},${y0 + c}`;

function defs() {
  let s = `<defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff4b0"/><stop offset=".35" stop-color="#f7cf3d"/><stop offset=".7" stop-color="#d79f12"/><stop offset="1" stop-color="#8f6206"/></linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#d6dee8"/><stop offset="1" stop-color="#7f8b9b"/></linearGradient>
    <radialGradient id="pearl" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#fbf3ff"/><stop offset=".75" stop-color="#eadff5"/><stop offset="1" stop-color="#cdbfb2"/></radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc8e6" stop-opacity="0"/><stop offset=".5" stop-color="#b8e4ff" stop-opacity=".55"/><stop offset="1" stop-color="#ffd6f0" stop-opacity="0"/></linearGradient>
    <linearGradient id="marble" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9e2d6"/></linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff3d00"/><stop offset=".55" stop-color="#ffa21f"/><stop offset="1" stop-color="#fff3a0" stop-opacity=".1"/></linearGradient>
    <path id="star" d="M0 -7 L1.6 -1.6 L7 0 L1.6 1.6 L0 7 L-1.6 1.6 L-7 0 L-1.6 -1.6Z" fill="#fff"/>`;

  for (const [id, [, , light, base, dark]] of Object.entries(GEMS)) {
    s += `<radialGradient id="glow-${id}"><stop offset="0" stop-color="${base}" stop-opacity=".55"/><stop offset="1" stop-color="${base}" stop-opacity="0"/></radialGradient>
      <linearGradient id="gm-${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${base}"/><stop offset="1" stop-color="${dark}"/></linearGradient>
      <linearGradient id="gt-${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${light}"/><stop offset=".6" stop-color="${base}"/><stop offset="1" stop-color="${dark}"/></linearGradient>
      <g id="m-gem-${id}">
        <polygon points="${chamfer(0, 0, 30, 22, 5)}" fill="${dark}"/>
        <polygon points="${chamfer(2.5, 2, 27.5, 20, 4)}" fill="url(#gm-${id})"/>
        <polygon points="${chamfer(8, 6, 22, 16, 2)}" fill="url(#gt-${id})"/>
        <g stroke="#fff" stroke-width=".6" opacity=".45">
          <path d="M5 0L10 6M25 0L20 6M30 5L22 8M30 17L22 14M25 22L20 16M5 22L10 16M0 17L8 14M0 5L8 8"/>
          <polygon points="${chamfer(8, 6, 22, 16, 2)}" fill="none"/>
        </g>
        <polygon points="9.5,7 16,7 11,11.5" fill="#fff" opacity=".75"/>
        <polygon points="3,3 11,2.4 4,8" fill="#fff" opacity=".35"/>
        <circle cx="21" cy="14.5" r="1" fill="#fff" opacity=".8"/>
      </g>`;
  }

  s += `
    <g id="m-gold">
      <rect x="0" y="0" width="30" height="22" rx="2.5" fill="url(#gold)"/>
      <rect x="2" y="2" width="26" height="18" rx="1.5" fill="none" stroke="#fff3b0" stroke-width=".8" opacity=".8"/>
      <rect x="3" y="2.5" width="24" height="3.5" rx="1.5" fill="#fff" opacity=".5"/>
      <path d="M6 15 L13 8" stroke="#fffbe6" stroke-width="1.2" opacity=".6"/>
    </g>
    <g id="m-silver">
      <rect x="0" y="0" width="30" height="22" rx="2.5" fill="url(#silver)"/>
      <rect x="2" y="2" width="26" height="18" rx="1.5" fill="none" stroke="#fff" stroke-width=".8" opacity=".9"/>
      <rect x="3" y="2.5" width="24" height="3.5" rx="1.5" fill="#fff" opacity=".7"/>
    </g>
    <g id="m-pearl">
      <rect x="0" y="0" width="30" height="22" rx="10" fill="url(#pearl)"/>
      <rect x="0" y="0" width="30" height="22" rx="10" fill="url(#sheen)"/>
      <ellipse cx="10" cy="7" rx="5" ry="2.6" fill="#fff" opacity=".85"/>
    </g>`;

  // Wood, hay and stubble: rotten, mouldy and full of flies.
  const hay = (v) => `
    <g id="m-hay-${v}">
      <rect x="0" y="0" width="30" height="22" rx="3" fill="#a89048"/>
      <g stroke-width="1" fill="none">
        <path d="M2 4 L12 7 M4 10 L18 8 M1 15 L14 17 M10 3 L26 6 M16 12 L29 10 M12 19 L28 16" stroke="#d6bf6a"/>
        <path d="M3 7 L15 4 M8 13 L22 15 M18 4 L27 9 M2 19 L10 13" stroke="#7a6526"/>
      </g>
      <rect x="0" y="14" width="30" height="8" rx="3" fill="#5a4a1c" opacity=".45"/>
      <circle cx="${7 + v * 5}" cy="${8 + v}" r="3.4" fill="#4f5b22" opacity=".85"/>
      <circle cx="${8 + v * 5}" cy="${9 + v}" r="1.6" fill="#7d8f33" opacity=".8"/>
      <circle cx="${22 - v * 3}" cy="${15 - v}" r="2.6" fill="#3d4419" opacity=".85"/>
      <circle cx="${18 + v}" cy="5" r="1.4" fill="#5d6a26" opacity=".8"/>
      <path d="M5 22 l-1 4 M11 22 l1 5 M20 22 l-1 3 M26 22 l1 4" stroke="#8a7432" stroke-width="1"/>
    </g>`;
  const wood = (v) => `
    <g id="m-wood-${v}">
      <rect x="0" y="0" width="30" height="22" rx="2" fill="#5e4836"/>
      <rect x="0" y="0" width="30" height="7" fill="#6e5741"/><rect x="0" y="14.5" width="30" height="7.5" fill="#53402f"/>
      <path d="M0 7 H30 M0 14.5 H30" stroke="#2e2117" stroke-width="1.2"/>
      <path d="M${4 + v * 6} 1 l3 4 l-2 3 l4 5" stroke="#2a1d13" stroke-width="1" fill="none"/>
      <circle cx="${20 - v * 2}" cy="4" r="1.1" fill="#1d140d"/><circle cx="${23 - v}" cy="11" r="1" fill="#1d140d"/><circle cx="9" cy="18" r="1.2" fill="#1d140d"/>
      <path d="M0 22 Q8 17 15 22 Q22 18 30 22 Z" fill="#5f7a2e" opacity=".75"/>
      <g transform="translate(${18 + v * 4} -1)"><rect x="-1" y="-3" width="2" height="4" fill="#e8e0cc"/><ellipse cx="0" cy="-3.5" rx="3.6" ry="2" fill="#c9b8a0"/><circle cx="-1" cy="-4" r=".6" fill="#fff"/></g>
    </g>`;
  const stubble = (v) => `
    <g id="m-stubble-${v}">
      <rect x="0" y="0" width="30" height="22" rx="3" fill="#6f5d34"/>
      <circle cx="6" cy="16" r="3.5" fill="#4d3f20"/><circle cx="20" cy="18" r="4" fill="#4a3c1e"/><circle cx="14" cy="9" r="2.6" fill="#57482a"/>
      <g stroke="#a99560" stroke-width="1.1" stroke-linecap="round" fill="none">
        <path d="M4 4 L2 -4 M8 5 L9 -5 M12 4 L14 -3 M17 5 L16 -6 M22 4 L25 -3 M26 6 L28 -2"/>
        <path d="M${9 + v} -5 l-3 2 M16 -6 l3 3 M2 -4 l-2 1" stroke="#7d6c3e"/>
      </g>
      <path d="M2 12 l3 -2 M24 10 l3 2 M10 20 l2 -2" stroke="#2f2614" stroke-width="1"/>
    </g>`;
  for (const v of [0, 1, 2]) s += hay(v) + wood(v) + stubble(v);

  // A burnt-out gap: a charred hole with dying embers.
  s += `<g id="gap">
      <rect x="0" y="0" width="30" height="22" rx="2" fill="#140c08"/>
      <rect x="1.5" y="1.5" width="27" height="19" rx="2" fill="none" stroke="#ff5a14" stroke-width="1.2" opacity=".45"/>
      <circle cx="8" cy="17" r="1.3" fill="#ff7a1a" class="ember-dot"/><circle cx="21" cy="15" r="1" fill="#ffb02e" class="ember-dot" style="animation-delay:.5s"/>
    </g>
    <g id="seam"><rect x=".5" y=".5" width="29" height="21" rx="2.5" fill="none" stroke="#ffd34d" stroke-width="1.4"/></g>
    <g id="fly"><ellipse cx="0" cy="0" rx="2.4" ry="1.7" fill="#111"/><ellipse class="wing" cx="-1.2" cy="-2.2" rx="1.8" ry="1.3" fill="#e9f3ff" opacity=".75"/><ellipse class="wing" cx="1.3" cy="-2.2" rx="1.8" ry="1.3" fill="#e9f3ff" opacity=".75"/></g>
  </defs>`;
  return s;
}

function matRef(b, i) {
  if (BURNS.includes(b.mat)) return `m-${b.mat}-${i % 3}`;
  return `m-${b.mat}`;
}

function scenery() {
  return `
    <g opacity=".85">
      <ellipse cx="80" cy="-20" rx="60" ry="16" fill="#fff"/><ellipse cx="120" cy="-30" rx="40" ry="14" fill="#fff"/>
      <ellipse cx="640" cy="10" rx="70" ry="15" fill="#fff"/><ellipse cx="690" cy="0" rx="40" ry="13" fill="#fff"/>
    </g>
    <circle cx="700" cy="-30" r="34" fill="#ffe27a" opacity=".9"/>
    <path d="M-60 330 Q120 250 300 320 T 820 300 V 520 H -60Z" fill="#a9dc8e"/>
    <path d="M-60 380 Q200 330 420 380 T 820 370 V 520 H -60Z" fill="#8fcf72"/>
    <rect x="-60" y="412" width="880" height="120" fill="#7fc062"/>
    <path d="M330 418 L420 418 L470 480 L280 480Z" fill="#f2cf72"/>`;
}

function foundation() {
  // Laid already: Jesus Christ, the one foundation (1 Cor 3:11). It never burns.
  const y = 17 * CH;
  return `
    <rect x="-12" y="${y}" width="774" height="${CH * 2 + 4}" rx="4" fill="url(#marble)" stroke="#d8c9a8" stroke-width="2"/>
    <rect x="-12" y="${y}" width="774" height="4" fill="#f7d774"/>
    <path d="M-12 ${y + CH} H 762" stroke="#e2d6bd" stroke-width="1.5"/>
    <text x="375" y="${y + 29}" text-anchor="middle" font-size="17" font-weight="900" fill="#b8860b" letter-spacing="3">✝ JESUS CHRIST · THE ONE FOUNDATION ✝</text>`;
}

// ---------- state ----------
let blocks, day, sealed, busy = false;
function reset() { blocks = new Map(); day = 0; sealed = -1; }
function firstGap() { let best = -1; for (const [i, b] of blocks) if (b.burnt && (best < 0 || i < best)) best = i; return best; }
function firstEmpty() { for (let i = 0; i < SLOTS.length; i++) if (!blocks.has(i)) return i; return -1; }

// A stage seals once it is complete with only fire-proof stones: then it can never fall.
function updateSealed() {
  while (sealed + 1 < STAGES.length) {
    const s = STAGES[sealed + 1];
    for (let i = s.start; i < s.end; i++) { const b = blocks.get(i); if (!b || b.burnt || MAT[b.mat].burns) return; }
    sealed++;
  }
}

// Precious stones fill burnt gaps first (lowest first); wood, hay and stubble go on top.
function place(mat) {
  let i = -1, seam = false;
  if (!MAT[mat].burns) { i = firstGap(); seam = i >= 0; }
  if (i < 0) i = firstEmpty();
  if (i < 0) return -1;
  blocks.set(i, { mat, day, burnt: false, seam });
  return i;
}

// How much of the unsealed building is burnt (gaps), and which side is weaker.
function stability() {
  let filled = 0, gaps = 0, left = 0, right = 0;
  for (const [i, b] of blocks) {
    if (SLOTS[i].stage <= sealed) continue;
    filled++;
    if (b.burnt) { gaps++; if (SLOTS[i].c < 12) left++; else if (SLOTS[i].c > 12) right++; }
  }
  const ratio = filled ? gaps / filled : 0;
  const side = right >= left ? 1 : -1;
  let tier = 0;
  if (ratio >= 0.4) tier = 3; else if (ratio >= 0.22) tier = 2; else if (ratio >= 0.08) tier = 1;
  return { ratio, gaps, tier, lean: side * Math.min(9, ratio * 26) };
}

function forecast() {
  let filled = 0, burn = 0;
  for (const [i, b] of blocks) {
    if (SLOTS[i].stage <= sealed || b.burnt) continue;
    filled++;
    if (MAT[b.mat].burns) burn++;
  }
  return filled ? burn / filled : 0;
}

// ---------- render ----------
const scene = document.getElementById('scene');
const pos = (s) => [s.c * CW, s.r * CH];

function render(newIdx = []) {
  const st = stability();
  let glows = '', cells = '', flies = '', cracks = '';
  let flyCount = 0;
  for (const [i, b] of blocks) {
    const s = SLOTS[i];
    const [x, y] = pos(s);
    if (b.burnt) {
      cells += `<use href="#gap" x="${x}" y="${y}" class="cell" data-i="${i}"/>`;
      if (st.tier >= 1) cracks += crackFrom(x, y, i);
      continue;
    }
    const m = MAT[b.mat];
    if (m.gem) glows += `<ellipse cx="${x + 15}" cy="${y + 11}" rx="26" ry="20" fill="url(#glow-${m.gem})"/>`;
    cells += `<use href="#${matRef(b, i)}" x="${x}" y="${y}" class="cell ${newIdx.includes(i) ? 'drop' : ''}" data-i="${i}"/>`;
    if (b.seam) cells += `<use href="#seam" x="${x}" y="${y}" pointer-events="none"/>`;
    if (m.burns && flyCount < 40 && (i * 7) % 3 !== 0) { flyCount++; flies += fly(x + 15, y + 8, i); }
  }
  scene.innerHTML = defs() + scenery() + `
    <g id="bld" class="${st.tier >= 2 ? `shake ${st.tier === 3 ? 'hard' : ''}` : ''}" style="--lean:${st.lean.toFixed(2)}deg">
      <g>${glows}</g><g id="cells">${cells}</g>${trims()}<g pointer-events="none">${cracks}</g><g id="flies" pointer-events="none">${flies}</g>
    </g>
    ${foundation()}
    <g id="fx"></g>`;
  document.getElementById('danger').classList.toggle('show', st.tier >= 2);
  renderPanel(st);
}

// Flies circle around rotten stones.
function fly(cx, cy, i) {
  const r = 9 + (i % 4) * 3, dur = (1.6 + (i % 5) * 0.35).toFixed(2), dir = i % 2 ? 360 : -360;
  return `<g transform="translate(${cx} ${cy})"><g>
    <animateTransform attributeName="transform" type="rotate" from="0" to="${dir}" dur="${dur}s" repeatCount="indefinite"/>
    <g transform="translate(${r} ${(i % 3) * 2 - 2})"><use href="#fly"/></g></g></g>`;
}

function crackFrom(x, y, i) {
  const dx = (i % 2 ? 1 : -1) * 6;
  return `<path d="M${x + 15} ${y} l${dx} -8 l${-dx / 2} -7 l${dx} -9 l${-dx} -8" stroke="#24160c" stroke-width="1.6" fill="none" opacity=".75"/>
    <path d="M${x + 15} ${y + 22} l${-dx} 7 l${dx / 2} 6" stroke="#24160c" stroke-width="1.2" fill="none" opacity=".6"/>`;
}

// Sealed stages get a gold trim along their outline.
function trims() {
  let out = '';
  for (let si = 0; si <= sealed; si++) {
    for (let i = STAGES[si].start; i < STAGES[si].end; i++) {
      const s = SLOTS[i], [x, y] = pos(s);
      const same = (r, c) => { const j = slotAt.get(`${r},${c}`); return j !== undefined && SLOTS[j].stage === si; };
      if (!same(s.r - 1, s.c)) out += `<path d="M${x} ${y} h${CW}"/>`;
      if (!same(s.r, s.c - 1)) out += `<path d="M${x} ${y} v${CH}"/>`;
      if (!same(s.r, s.c + 1)) out += `<path d="M${x + CW} ${y} v${CH}"/>`;
    }
  }
  return `<g stroke="#ffd34d" stroke-width="2.5" stroke-linecap="round" pointer-events="none">${out}</g>`;
}

function renderPanel(st) {
  document.getElementById('stages').innerHTML = STAGES.map((s, si) => {
    let n = 0;
    for (let i = s.start; i < s.end; i++) { const b = blocks.get(i); if (b && !b.burnt) n++; }
    const total = s.end - s.start;
    return `<div class="stage-row ${si <= sealed ? 'sealed' : ''}"><span class="ic">${s.icon}</span><span>${s.name}</span>
      <span>${si <= sealed ? '✓ Sealed' : `${n}/${total}`}</span><div class="bar"><i style="width:${(n / total) * 100}%"></i></div></div>`;
  }).join('');
  const f = forecast();
  const fb = document.getElementById('forecastBar');
  fb.style.width = `${Math.round(f * 100)}%`;
  fb.style.background = f > 0.3 ? '#dc2626' : f > 0.15 ? '#f59e0b' : '#22c55e';
  document.getElementById('forecast').innerHTML = `${Math.round(f * 100)}% would burn<small>${f > 0.3 ? 'Danger! The next fire could bring it down.' : f > 0.15 ? 'Careful: lots of hay and wood in your walls.' : 'Looking strong.'}</small>`;
  const label = ['💪 Strong and steady', '⚡ Cracking', '⚠️ About to topple!', '💥 Collapsing'][st.tier];
  const sub = ['Keep building with precious stones.', `${st.gaps} burnt gaps. Fill them with precious stones.`, `${st.gaps} burnt gaps. One more bad fire and it falls. Your work could be lost!`, 'Too many gaps.'][st.tier];
  const el = document.getElementById('stab');
  el.className = `stab ${st.tier >= 2 ? 'bad' : ''}`;
  el.innerHTML = `${label}<small>${sub}</small>`;
  document.getElementById('subtitle').textContent = `Day ${day} · Week ${Math.floor(day / 7) + 1} · built on Jesus Christ`;
}

function renderLegend() {
  const rows = [['m-gold', 'Gold = prayer'], ['m-silver', 'Silver = kind words'], ['m-gem-carnelian', 'Gems = fruit of the Spirit'], ['m-pearl', 'Pearl = owned up'],
    ['m-wood-0', 'Wood = fighting'], ['m-hay-0', 'Hay = tantrum'], ['m-stubble-0', 'Stubble = rude words']];
  document.getElementById('legend').innerHTML = `<svg width="0" height="0" style="position:absolute">${defs()}</svg>` + rows.map(([m, t]) =>
    `<span><svg viewBox="-2 -7 34 33"><use href="#${m}"/></svg>${t}</span>`).join('');
}

// ---------- simulated days ----------
const pick = (a) => a[Math.floor(Math.random() * a.length)];
function dayItems(kind) {
  const good = () => pick(['gold', 'gold', 'silver', ...GEM_IDS]);
  if (kind === 'great') return ['gold', 'gold', 'silver', pick(GEM_IDS), pick(GEM_IDS), pick(GEM_IDS)];
  if (kind === 'mixed') return [good(), good(), good(), good(), pick(BURNS), pick(BURNS)];
  if (kind === 'hard') return [good(), pick(BURNS), pick(BURNS), pick(BURNS), pick(BURNS)];
  if (kind === 'sorry') return ['pearl', 'pearl'];
  return [];
}
function addDay(kind, animate = true) {
  day++;
  const placed = [];
  for (const m of dayItems(kind)) { const i = place(m); if (i >= 0) placed.push(i); }
  updateSealed();
  if (animate) render(placed);
  return placed;
}

// Fire burns wood, hay and stubble. With too many gaps, the weakest row of the unsealed part
// and everything above it collapses, and that work is lost. Sealed stages and the foundation stand.
function fireCommit() {
  let burnt = 0;
  for (const b of blocks.values()) if (!b.burnt && MAT[b.mat].burns) { b.burnt = true; burnt++; }
  const st = stability();
  return { burnt, st, fallen: st.tier === 3 ? collapseSet() : null };
}
function collapseSet() {
  const gapsByRow = {};
  for (const [i, b] of blocks) if (b.burnt && SLOTS[i].stage > sealed) gapsByRow[SLOTS[i].r] = (gapsByRow[SLOTS[i].r] || 0) + 1;
  const weakRow = Number(Object.entries(gapsByRow).sort((a, b) => b[1] - a[1])[0][0]);
  return [...blocks.keys()].filter((i) => SLOTS[i].stage > sealed && SLOTS[i].r <= weakRow);
}
function lost(fallen) { return fallen.filter((i) => !blocks.get(i).burnt).length; }

// ---------- fire animation ----------
const area = document.getElementById('area');
const capEl = document.getElementById('caption');
function caption(html, ms, danger = false) {
  capEl.innerHTML = html;
  capEl.classList.toggle('danger', danger);
  capEl.classList.add('show');
  clearTimeout(caption.t);
  if (ms) caption.t = setTimeout(() => capEl.classList.remove('show'), ms);
}
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

async function fireTest() {
  if (busy || !blocks.size) return;
  busy = true; setButtons(false);
  area.classList.add('dusk');
  caption('🔥 The fire will test the quality of each one’s work.<em>1 Corinthians 3:13</em>');
  await wait(1500);
  const fx = document.getElementById('fx');
  const flame = (x, h, fill, o) => `<path d="M${x - 60} 420 C${x - 50} ${420 - h * .6} ${x - 30} ${420 - h * .5} ${x - 20} ${420 - h} C${x - 10} ${420 - h * .55} ${x + 10} ${420 - h * .6} ${x + 20} ${420 - h * .9} C${x + 30} ${420 - h * .5} ${x + 50} ${420 - h * .5} ${x + 60} 420Z" fill="${fill}" opacity="${o}"/>`;
  fx.innerHTML = `<g class="flames">${flame(-80, 330, 'url(#flame)', .85)}${flame(-20, 420, '#ff6a14', .7)}${flame(40, 300, 'url(#flame)', .9)}${flame(100, 380, '#ffb02e', .6)}${flame(0, 200, '#ffe066', .85)}</g>`;
  for (const u of scene.querySelectorAll('#cells use.cell')) {
    const b = blocks.get(Number(u.dataset.i));
    if (!b || b.burnt || !MAT[b.mat].burns) continue;
    const x = Number(u.getAttribute('x'));
    setTimeout(() => { u.classList.add('char'); sparks(x + 15, Number(u.getAttribute('y'))); }, 3400 * ((x + 520) / 1600));
  }
  setTimeout(() => { const f = document.getElementById('flies'); if (f) f.innerHTML = ''; }, 1800); // flies flee the heat
  await wait(3500);
  document.getElementById('bld').classList.add('refine');
  caption('✨ Gold, silver and precious stones: refined!');
  await wait(1500);
  const res = fireCommit();
  area.classList.remove('dusk');
  render();
  if (res.fallen) {
    caption('😱 The walls are cracking… it’s going to fall!', 0, true);
    await wait(2200);
    const lostN = lost(res.fallen);
    for (const i of res.fallen) {
      const u = scene.querySelector(`#cells use.cell[data-i="${i}"]`);
      if (!u) continue;
      u.style.setProperty('--tx', `${(Math.random() * 160 - 80).toFixed(0)}px`);
      u.style.setProperty('--rot', `${(Math.random() * 300 - 150).toFixed(0)}deg`);
      u.style.animationDelay = `${(Math.random() * 0.35).toFixed(2)}s`;
      u.classList.add('fall');
    }
    debrisBurst();
    await wait(1900);
    for (const i of res.fallen) blocks.delete(i);
    render();
    caption(`💥 It collapsed. ${lostN} stone${lostN === 1 ? '' : 's'} of your work were lost.<em>But Jesus, the foundation, still stands, and “he himself will be saved” (1 Cor 3:15). Rebuild with precious stones!</em>`, 9000, true);
    log(`Fire: ${res.burnt} burnt, then the top collapsed and ${lostN} stones were lost.`);
  } else if (res.st.tier === 2) {
    caption(`⚠️ ${res.burnt} rotten stones burnt away and the temple is leaning!<em>Fill the gaps with precious stones before the next fire, or it will fall.</em>`, 8000, true);
    log(`Fire: ${res.burnt} burnt. About to topple!`);
  } else {
    caption(res.burnt ? `🕊️ ${res.burnt} rotten stone${res.burnt === 1 ? '' : 's'} burnt away. What you built with God remains.<em>Fill the gaps with precious stones.</em>` : '🕊️ Nothing burnt! Everything you built with God remains.', 6000);
    log(res.burnt ? `Fire: ${res.burnt} burnt.` : 'Fire: nothing burnt!');
  }
  busy = false; setButtons(true);
}

function sparks(x, y) {
  const fx = document.getElementById('fx');
  for (let k = 0; k < 2; k++) {
    const e = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    e.setAttribute('cx', x + Math.random() * 16 - 8); e.setAttribute('cy', y + 8); e.setAttribute('r', 1.8);
    e.setAttribute('fill', k ? '#ffd166' : '#ff7a1a'); e.setAttribute('class', 'spark-up');
    fx.appendChild(e); setTimeout(() => e.remove(), 1700);
  }
}

function debrisBurst() {
  const fx = document.getElementById('fx');
  for (let k = 0; k < 24; k++) {
    const e = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    e.setAttribute('x', 150 + Math.random() * 450); e.setAttribute('y', 60 + Math.random() * 200);
    e.setAttribute('width', 4 + Math.random() * 5); e.setAttribute('height', 3 + Math.random() * 4);
    e.setAttribute('fill', pick(['#8a7a5a', '#6b5a40', '#b8a98a'])); e.setAttribute('class', 'debris');
    e.style.animationDelay = `${Math.random() * 0.6}s`;
    fx.appendChild(e); setTimeout(() => e.remove(), 2000);
  }
}

// Falling pebbles while the temple is unstable; sparkles on gold and gems.
setInterval(() => {
  if (document.hidden || busy) return;
  const fx = document.getElementById('fx');
  if (!fx) return;
  if (stability().tier >= 2) {
    const gaps = [...scene.querySelectorAll('#cells use[href="#gap"]')];
    if (gaps.length) {
      const g = pick(gaps);
      const e = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      e.setAttribute('x', Number(g.getAttribute('x')) + Math.random() * 24); e.setAttribute('y', Number(g.getAttribute('y')) + 20);
      e.setAttribute('width', 3); e.setAttribute('height', 3); e.setAttribute('fill', '#7a6a4a'); e.setAttribute('class', 'debris');
      fx.appendChild(e); setTimeout(() => e.remove(), 1300);
    }
  }
  const shiny = [...scene.querySelectorAll('#cells use.cell')].filter((u) => { const b = blocks.get(Number(u.dataset.i)); return b && !b.burnt && (MAT[b.mat].gem || b.mat === 'gold' || b.mat === 'pearl'); });
  for (let k = 0; k < 2 && shiny.length; k++) {
    const u = pick(shiny);
    const s = document.createElementNS('http://www.w3.org/2000/svg', 'use');
    s.setAttribute('href', '#star');
    s.setAttribute('x', Number(u.getAttribute('x')) + 6 + Math.random() * 18); s.setAttribute('y', Number(u.getAttribute('y')) + 4 + Math.random() * 10);
    s.setAttribute('class', 'twinkle');
    fx.appendChild(s); setTimeout(() => s.remove(), 1200);
  }
}, 600);

// ---------- UI ----------
function log(t) { document.getElementById('log').textContent = t; }
function setButtons(on) { document.querySelectorAll('button[data-act]').forEach((b) => { b.disabled = !on; }); }

function fastForward(days) {
  const kinds = ['great', 'great', 'mixed', 'mixed', 'mixed', 'hard', 'great', 'mixed', 'great', 'sorry'];
  let burnt = 0, falls = 0, lostN = 0;
  for (let d = 0; d < days; d++) {
    addDay(pick(kinds), false);
    if (day % 7 === 0) {
      const r = fireCommit();
      burnt += r.burnt;
      if (r.fallen) { lostN += lost(r.fallen); for (const i of r.fallen) blocks.delete(i); falls++; }
      updateSealed();
    }
  }
  render();
  log(`${days} days built. Fires burnt ${burnt} rotten stones${falls ? `, and the temple collapsed ${falls}× (${lostN} stones lost)` : ''}.`);
}

document.querySelector('.panel').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-act]');
  if (!b || busy) return;
  const a = b.dataset.act;
  if (a === 'fire') return fireTest();
  if (a === 'reset') { reset(); render(); return log('Fresh start on the one foundation: Jesus Christ.'); }
  if (a === 'week') return fastForward(7);
  if (a === 'month') return fastForward(28);
  const placed = addDay(a);
  log(`Day ${day}: ${placed.map((i) => MAT[blocks.get(i).mat].name).join(', ') || 'the temple is complete!'}`);
});

const tip = document.getElementById('tip');
scene.addEventListener('click', (e) => {
  const u = e.target.closest('use.cell');
  if (!u) return;
  const b = blocks.get(Number(u.dataset.i));
  if (!b) return;
  const m = MAT[b.mat];
  tip.textContent = b.burnt ? `🔥 Burnt away (was ${m.name}). Fill me with a precious stone!` : `${m.name} · ${m.src} · day ${b.day}${b.seam ? ' · ✨ gap filled again' : ''}`;
  tip.style.left = `${Math.min(e.clientX + 12, innerWidth - 380)}px`;
  tip.style.top = `${e.clientY - 46}px`;
  tip.classList.add('show');
  clearTimeout(tip.t);
  tip.t = setTimeout(() => tip.classList.remove('show'), 2600);
  u.classList.remove('click'); void u.getBoundingClientRect(); u.classList.add('click');
});

reset();
renderLegend();
render();
</script>
</body>
</html>
