<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Temple Builder</title>
<!-- Design prototype for the 1 Corinthians 3 "Temple Builder": a tiered gem tower on a sea cliff.
     Not wired into the app yet; the buttons on the right simulate days of logging. -->
<style>
  :root { --ink: #1f2430; --muted: #5b6170; --bg: #fff8ee; --shadow: 0 6px 0 rgba(0,0,0,.08), 0 12px 30px rgba(60,40,10,.08); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  .app { display: grid; grid-template-columns: 1fr 340px; height: 100vh; }
  .stage-area { position: relative; overflow: hidden;
    background: linear-gradient(#5b8fd6 0%, #f3b07a 62%, #ffd9a0 78%, #ffe9c4 100%); transition: background 1.2s; }
  .stage-area.dusk { background: linear-gradient(#140f2b 0%, #4a1f45 50%, #c4482a 80%, #ff8a3d 100%); }
  .stage-area.storm { background: linear-gradient(#3b4252 0%, #6b6f80 55%, #b98a6a 80%, #e0b080 100%); }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; }
  .firewall { position: absolute; left: 0; right: 0; bottom: 0; height: 0; pointer-events: none; z-index: 1;
    background: linear-gradient(to top, rgba(255,90,20,.55), rgba(255,170,40,.25) 60%, transparent); mix-blend-mode: screen; }
  .firewall.go { animation: rise 3.6s ease-in forwards; }
  @keyframes rise { 0% { height: 0; } 85% { height: 100%; opacity: 1; } 100% { height: 100%; opacity: 0; } }
  .title { position: absolute; top: 16px; left: 22px; margin: 0; font-size: 38px; font-weight: 900; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.35); z-index: 2; }
  .title small { display: block; font-size: 17px; font-weight: 700; opacity: .9; }
  .caption { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 3;
    background: rgba(20,14,8,.84); color: #fff; padding: 14px 26px; border-radius: 22px;
    font-size: 24px; font-weight: 800; max-width: 88%; text-align: center; opacity: 0; transition: opacity .4s; }
  .caption.show { opacity: 1; }
  .caption.danger { background: rgba(160,20,10,.92); }
  .caption em { display: block; font-size: 16px; font-weight: 600; opacity: .85; font-style: normal; }
  .danger-banner { position: absolute; top: 100px; left: 22px; max-width: 250px; z-index: 3;
    background: #c81e1e; color: #fff; font-weight: 900; font-size: 20px; line-height: 1.2; padding: 12px 18px; border-radius: 16px;
    box-shadow: 0 6px 0 #7f1010; display: none; animation: pulse 1s ease-in-out infinite; transform-origin: left center; }
  .danger-banner.show { display: block; }
  @keyframes pulse { 50% { transform: scale(1.05); } }
  .shimmer { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: soft-light; z-index: 1;
    background: linear-gradient(105deg, transparent 42%, rgba(255,255,255,.9) 50%, transparent 58%);
    background-size: 300% 100%; animation: shimmer 8s ease-in-out infinite; }
  @keyframes shimmer { 0%, 70% { background-position: 150% 0; } 100% { background-position: -50% 0; } }

  .cell { cursor: pointer; transform-box: fill-box; transform-origin: center; }
  .cell.drop { animation: drop .45s cubic-bezier(.3,1.5,.5,1); }
  .cell.char { animation: char .8s ease-in forwards; }
  .cell.click { animation: click .5s ease-out; }
  @keyframes drop { from { transform: translateY(-60px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes char {
    0% { filter: none; }
    30% { filter: brightness(1.9) sepia(1) saturate(5) hue-rotate(-25deg); }
    65% { filter: brightness(.2); opacity: 1; transform: none; }
    100% { filter: brightness(.05); opacity: 0; transform: translateY(-16px) scale(.5); }
  }
  @keyframes click { 0% { transform: scale(1.25); filter: brightness(1.6); } 100% { transform: none; filter: none; } }
  .refine { animation: refine 1.4s ease-out; }
  @keyframes refine { 0% { filter: none; } 40% { filter: brightness(1.8) saturate(1.4); } 100% { filter: none; } }
  .wing { animation: flap .06s linear infinite alternate; transform-box: fill-box; transform-origin: center bottom; }
  @keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(.3); } }
  .ember-dot { animation: glowdot 1.3s ease-in-out infinite alternate; }
  @keyframes glowdot { from { opacity: .3; } to { opacity: 1; } }
  .flame { animation: flick .18s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center bottom; }
  @keyframes flick { from { transform: scale(.9, .85) skewX(-6deg); } to { transform: scale(1.05, 1.15) skewX(6deg); } }
  .spark-up { animation: sparkup 1.6s ease-out forwards; }
  @keyframes sparkup { to { transform: translateY(-120px); opacity: 0; } }
  .debris { animation: debris 1.3s ease-in forwards; }
  @keyframes debris { to { transform: translateY(260px) rotate(200deg); opacity: 0; } }
  .splash { animation: splash 1.2s ease-out forwards; }
  @keyframes splash { 0% { transform: translate(0, 0); opacity: 1; } 100% { transform: translate(var(--sx), var(--sy)); opacity: 0; } }
  .twinkle { animation: twinkle 1.1s ease-out forwards; transform-box: fill-box; transform-origin: center; }
  @keyframes twinkle { 0% { transform: scale(0); opacity: 0; } 40% { transform: scale(1.3); opacity: 1; } 100% { transform: scale(0) rotate(90deg); opacity: 0; } }
  .wave { animation: wave 4s ease-in-out infinite alternate; }
  @keyframes wave { to { transform: translateX(-40px); } }
  .ghost { animation: ghost 2.4s ease-in-out infinite; }
  @keyframes ghost { 50% { opacity: .35; } }

  /* ----- panel ----- */
  .panel { background: #fffdf8; border-left: 1px solid #eadfce; padding: 16px 16px 22px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
  .panel h2 { margin: 0 0 6px; font-size: 19px; }
  .box { background: #fff; border-radius: 18px; box-shadow: var(--shadow); padding: 12px 14px; }
  .big { font-size: 26px; font-weight: 900; }
  .big small { font-size: 15px; font-weight: 700; color: var(--muted); }
  .levels { display: flex; flex-direction: column-reverse; gap: 3px; margin-top: 8px; }
  .lvl { display: grid; grid-template-columns: 56px 1fr 52px; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; }
  .lvl .bar { height: 9px; border-radius: 5px; background: #efe7da; overflow: hidden; }
  .lvl .bar i { display: block; height: 100%; background: linear-gradient(90deg, #f2c94c, #d4a017); }
  .lvl.sealed .bar i { background: linear-gradient(90deg, #6ee7b7, #10b981); }
  .lvl.bad .bar { box-shadow: 0 0 0 2px #dc2626; }
  .lvl.future { opacity: .35; }
  .meter { height: 14px; border-radius: 8px; background: #efe7da; overflow: hidden; margin: 6px 0 2px; }
  .meter i { display: block; height: 100%; transition: width .6s; }
  .stab { font-size: 20px; font-weight: 900; }
  .stab small { display: block; font-size: 14px; font-weight: 600; color: var(--muted); }
  .stab.bad { color: #b91c1c; }
  .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 8px; font-size: 13px; font-weight: 700; }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .legend svg { width: 26px; height: 19px; flex: none; overflow: visible; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  button { font: inherit; border: 0; border-radius: 16px; min-height: 58px; padding: 0 8px; font-size: 17px; font-weight: 800;
    background: #fff; box-shadow: var(--shadow); color: var(--ink); cursor: pointer; }
  button:active { transform: translateY(3px); }
  button.fire { grid-column: 1 / 3; background: linear-gradient(135deg, #ff9a3c, #e8501b); color: #fff; font-size: 21px; }
  button.wide { grid-column: 1 / 3; }
  button:disabled { opacity: .4; }
  .log { font-size: 13px; color: var(--muted); font-weight: 600; min-height: 36px; margin: 8px 0 0; }
  #tip { position: fixed; z-index: 10; pointer-events: none; background: #1f2430; color: #fff; padding: 8px 14px;
    border-radius: 12px; font-size: 16px; font-weight: 800; opacity: 0; transition: opacity .2s; white-space: nowrap; }
  #tip.show { opacity: 1; }
  @media (max-width: 900px) { .app { grid-template-columns: 1fr; grid-template-rows: 64vh auto; height: auto; } }
</style>
</head>
<body>
<div class="app">
  <div class="stage-area" id="area">
    <h1 class="title">My Tower<small id="subtitle">Day 0 · built on Jesus Christ</small></h1>
    <div class="danger-banner" id="danger">⚠️ ABOUT TO TOPPLE! Fill the burnt gaps before the next fire</div>
    <svg id="scene" viewBox="-300 -420 600 760" preserveAspectRatio="xMidYMax meet" aria-label="Gem tower on a cliff"></svg>
    <div class="firewall" id="firewall"></div>
    <div class="shimmer"></div>
    <div class="caption" id="caption"></div>
  </div>
  <aside class="panel">
    <div class="box">
      <div class="big" id="height"></div>
      <div class="levels" id="levels"></div>
    </div>
    <div class="box">
      <h2>🔥 Fire forecast</h2>
      <div class="meter"><i id="forecastBar"></i></div>
      <div class="stab" id="forecast"></div>
    </div>
    <div class="box"><div class="stab" id="stab"></div></div>
    <div class="box"><h2>What builds what</h2><div class="legend" id="legend"></div></div>
    <div class="box">
      <h2>Try it (simulate days)</h2>
      <div class="btns">
        <button data-act="great">🌟 Great day</button>
        <button data-act="mixed">🙂 Mixed day</button>
        <button data-act="hard">😣 Hard day</button>
        <button data-act="sorry">🫂 Made it right</button>
        <button class="fire" data-act="fire">🔥 Test by fire</button>
        <button data-act="week">⏩ 1 week</button>
        <button data-act="month">⏩ 1 month</button>
        <button class="wide" data-act="reset">↺ Start again</button>
      </div>
      <p class="log" id="log">Tap a day to start building. Tap any stone to see what built it.</p>
    </div>
  </aside>
</div>
<div id="tip"></div>
<svg width="0" height="0" style="position:absolute" id="defsHost"></svg>

<script>
// ---------- blueprint: a tower of 12 levels, each 3 rows of stones, narrowing as it rises ----------
const CW = 30, CH = 22, ROWS = 3, LEDGE = 8, TIER_H = ROWS * CH + LEDGE;
const WIDTHS = [14, 13, 12, 11, 10, 9, 8, 8, 7, 6, 5, 4];
const TIERS = [];
const SLOTS = [];
WIDTHS.forEach((w, k) => {
  const t = { k, w, bottom: -k * TIER_H, start: SLOTS.length };
  const cells = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < w; c++) cells.push({ r, c });
  cells.sort((a, b) => a.r - b.r || Math.abs(a.c - (w - 1) / 2) - Math.abs(b.c - (w - 1) / 2) || a.c - b.c);
  cells.forEach(({ r, c }) => SLOTS.push({ k, r, c, x: -w * CW / 2 + c * CW, y: t.bottom - (r + 1) * CH }));
  t.end = SLOTS.length;
  TIERS.push(t);
});

// ---------- materials ----------
// Fruit of the Spirit map to the Revelation 21 foundation stones: [name, fruit, light, base, dark].
const GEMS = {
  carnelian:  ['Carnelian', 'Love', '#ff8a8a', '#e0102f', '#6e0014'],
  topaz:      ['Topaz', 'Joy', '#ffe27a', '#ffa400', '#9a5200'],
  sapphire:   ['Sapphire', 'Peace', '#7ab8ff', '#1450f5', '#081f7a'],
  chalcedony: ['Chalcedony', 'Patience', '#cfc6ff', '#7563ff', '#3424a8'],
  emerald:    ['Emerald', 'Kindness', '#7dffb6', '#00b25e', '#00502b'],
  chrysolite: ['Chrysolite', 'Goodness', '#f1ff7a', '#b4dc00', '#5b7400'],
  jasper:     ['Jasper', 'Faithfulness', '#ffffff', '#c8ecff', '#5aa6cc'],
  beryl:      ['Beryl', 'Gentleness', '#8ff8ff', '#00c2dd', '#00687a'],
  amethyst:   ['Amethyst', 'Self-control', '#eaa8ff', '#a12cff', '#46087f'],
};
const MAT = {
  gold:    { name: 'Gold', src: 'Prayer', burns: false },
  silver:  { name: 'Silver', src: 'Kind words / making peace', burns: false },
  pearl:   { name: 'Pearl', src: 'Owned up and made it right', burns: false },
  wood:    { name: 'Rotten wood', src: 'Fighting', burns: true },
  hay:     { name: 'Mouldy hay', src: 'Tantrum / disobeying', burns: true },
  stubble: { name: 'Stubble', src: 'Rude words', burns: true },
};
for (const [id, [name, fruit]] of Object.entries(GEMS)) MAT['gem-' + id] = { name, src: fruit, burns: false, gem: id };
const GEM_IDS = Object.keys(MAT).filter((m) => MAT[m].gem);
const BURNS = ['wood', 'hay', 'stubble'];

// ---------- stone artwork (shared <defs>) ----------
const chamfer = (x0, y0, x1, y1, c) => `${x0 + c},${y0} ${x1 - c},${y0} ${x1},${y0 + c} ${x1},${y1 - c} ${x1 - c},${y1} ${x0 + c},${y1} ${x0},${y1 - c} ${x0},${y0 + c}`;

function defs() {
  let s = `<defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff4b0"/><stop offset=".35" stop-color="#f7cf3d"/><stop offset=".7" stop-color="#d79f12"/><stop offset="1" stop-color="#8f6206"/></linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#d6dee8"/><stop offset="1" stop-color="#7f8b9b"/></linearGradient>
    <radialGradient id="pearl" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#fbf3ff"/><stop offset=".75" stop-color="#eadff5"/><stop offset="1" stop-color="#cdbfb2"/></radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc8e6" stop-opacity="0"/><stop offset=".5" stop-color="#b8e4ff" stop-opacity=".55"/><stop offset="1" stop-color="#ffd6f0" stop-opacity="0"/></linearGradient>
    <linearGradient id="marble" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e2d8c6"/></linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9b48e"/><stop offset="1" stop-color="#8d7652"/></linearGradient>
    <linearGradient id="goldLedge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0a0"/><stop offset=".5" stop-color="#f0bf2c"/><stop offset="1" stop-color="#9a6a08"/></linearGradient>
    <linearGradient id="cliff" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a7a66"/><stop offset="1" stop-color="#4f4436"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fa9c9"/><stop offset="1" stop-color="#11506e"/></linearGradient>
    <linearGradient id="flameG" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff3d00"/><stop offset=".55" stop-color="#ffa21f"/><stop offset="1" stop-color="#fff3a0"/></linearGradient>
    <path id="star" d="M0 -7 L1.6 -1.6 L7 0 L1.6 1.6 L0 7 L-1.6 1.6 L-7 0 L-1.6 -1.6Z" fill="#fff"/>
    <path id="flame" d="M15 22 C3 22 2 12 9 6 C9 11 12 12 12 12 C11 6 14 1 18 -4 C18 4 25 7 25 14 C25 20 21 22 15 22Z" fill="url(#flameG)"/>`;

  for (const [id, [, , light, base, dark]] of Object.entries(GEMS)) {
    s += `<radialGradient id="glow-${id}"><stop offset="0" stop-color="${base}" stop-opacity=".55"/><stop offset="1" stop-color="${base}" stop-opacity="0"/></radialGradient>
      <linearGradient id="gm-${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${base}"/><stop offset="1" stop-color="${dark}"/></linearGradient>
      <linearGradient id="gt-${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${light}"/><stop offset=".6" stop-color="${base}"/><stop offset="1" stop-color="${dark}"/></linearGradient>
      <g id="m-gem-${id}">
        <rect x="0" y="0" width="30" height="22" rx="2" fill="url(#stone)"/>
        <polygon points="${chamfer(1.5, 1, 28.5, 21, 5)}" fill="${dark}"/>
        <polygon points="${chamfer(3.5, 2.8, 26.5, 19.2, 4)}" fill="url(#gm-${id})"/>
        <polygon points="${chamfer(9, 6.5, 21, 15.5, 2)}" fill="url(#gt-${id})"/>
        <g stroke="#fff" stroke-width=".6" opacity=".45">
          <path d="M6.5 1L11 6.5M23.5 1L19 6.5M28.5 6L21 8.5M28.5 16L21 13.5M23.5 21L19 15.5M6.5 21L11 15.5M1.5 16L9 13.5M1.5 6L9 8.5"/>
          <polygon points="${chamfer(9, 6.5, 21, 15.5, 2)}" fill="none"/>
        </g>
        <polygon points="10.5,7.5 16,7.5 11.5,11.5" fill="#fff" opacity=".8"/>
        <polygon points="4.5,3.5 11,3 5,8" fill="#fff" opacity=".35"/>
        <circle cx="20" cy="14" r="1" fill="#fff" opacity=".85"/>
      </g>`;
  }

  s += `
    <g id="m-gold">
      <rect x="0" y="0" width="30" height="22" rx="2.5" fill="url(#gold)"/>
      <rect x="2" y="2" width="26" height="18" rx="1.5" fill="none" stroke="#fff3b0" stroke-width=".8" opacity=".8"/>
      <rect x="3" y="2.5" width="24" height="3.5" rx="1.5" fill="#fff" opacity=".5"/>
      <path d="M6 15 L13 8" stroke="#fffbe6" stroke-width="1.2" opacity=".6"/>
    </g>
    <g id="m-silver">
      <rect x="0" y="0" width="30" height="22" rx="2.5" fill="url(#silver)"/>
      <rect x="2" y="2" width="26" height="18" rx="1.5" fill="none" stroke="#fff" stroke-width=".8" opacity=".9"/>
      <rect x="3" y="2.5" width="24" height="3.5" rx="1.5" fill="#fff" opacity=".7"/>
    </g>
    <g id="m-pearl">
      <rect x="0" y="0" width="30" height="22" rx="2" fill="url(#stone)"/>
      <rect x="2" y="1.5" width="26" height="19" rx="9" fill="url(#pearl)"/>
      <rect x="2" y="1.5" width="26" height="19" rx="9" fill="url(#sheen)"/>
      <ellipse cx="10" cy="7" rx="5" ry="2.6" fill="#fff" opacity=".85"/>
    </g>`;

  const hay = (v) => `
    <g id="m-hay-${v}">
      <rect x="0" y="0" width="30" height="22" rx="3" fill="#a89048"/>
      <g stroke-width="1" fill="none">
        <path d="M2 4 L12 7 M4 10 L18 8 M1 15 L14 17 M10 3 L26 6 M16 12 L29 10 M12 19 L28 16" stroke="#d6bf6a"/>
        <path d="M3 7 L15 4 M8 13 L22 15 M18 4 L27 9 M2 19 L10 13" stroke="#7a6526"/>
      </g>
      <rect x="0" y="14" width="30" height="8" rx="3" fill="#5a4a1c" opacity=".45"/>
      <circle cx="${7 + v * 5}" cy="${8 + v}" r="3.4" fill="#4f5b22" opacity=".85"/>
      <circle cx="${8 + v * 5}" cy="${9 + v}" r="1.6" fill="#7d8f33" opacity=".8"/>
      <circle cx="${22 - v * 3}" cy="${15 - v}" r="2.6" fill="#3d4419" opacity=".85"/>
      <circle cx="${18 + v}" cy="5" r="1.4" fill="#5d6a26" opacity=".8"/>
      <path d="M5 22 l-1 4 M11 22 l1 5 M20 22 l-1 3 M26 22 l1 4" stroke="#8a7432" stroke-width="1"/>
    </g>`;
  const wood = (v) => `
    <g id="m-wood-${v}">
      <rect x="0" y="0" width="30" height="22" rx="2" fill="#5e4836"/>
      <rect x="0" y="0" width="30" height="7" fill="#6e5741"/><rect x="0" y="14.5" width="30" height="7.5" fill="#53402f"/>
      <path d="M0 7 H30 M0 14.5 H30" stroke="#2e2117" stroke-width="1.2"/>
      <path d="M${4 + v * 6} 1 l3 4 l-2 3 l4 5" stroke="#2a1d13" stroke-width="1" fill="none"/>
      <circle cx="${20 - v * 2}" cy="4" r="1.1" fill="#1d140d"/><circle cx="${23 - v}" cy="11" r="1" fill="#1d140d"/><circle cx="9" cy="18" r="1.2" fill="#1d140d"/>
      <path d="M0 22 Q8 17 15 22 Q22 18 30 22 Z" fill="#5f7a2e" opacity=".75"/>
      <g transform="translate(${18 + v * 4} -1)"><rect x="-1" y="-3" width="2" height="4" fill="#e8e0cc"/><ellipse cx="0" cy="-3.5" rx="3.6" ry="2" fill="#c9b8a0"/><circle cx="-1" cy="-4" r=".6" fill="#fff"/></g>
    </g>`;
  const stubble = (v) => `
    <g id="m-stubble-${v}">
      <rect x="0" y="0" width="30" height="22" rx="3" fill="#6f5d34"/>
      <circle cx="6" cy="16" r="3.5" fill="#4d3f20"/><circle cx="20" cy="18" r="4" fill="#4a3c1e"/><circle cx="14" cy="9" r="2.6" fill="#57482a"/>
      <g stroke="#a99560" stroke-width="1.1" stroke-linecap="round" fill="none">
        <path d="M4 4 L2 -4 M8 5 L9 -5 M12 4 L14 -3 M17 5 L16 -6 M22 4 L25 -3 M26 6 L28 -2"/>
        <path d="M${9 + v} -5 l-3 2 M16 -6 l3 3 M2 -4 l-2 1" stroke="#7d6c3e"/>
      </g>
      <path d="M2 12 l3 -2 M24 10 l3 2 M10 20 l2 -2" stroke="#2f2614" stroke-width="1"/>
    </g>`;
  for (const v of [0, 1, 2]) s += hay(v) + wood(v) + stubble(v);

  s += `<g id="gap">
      <rect x="0" y="0" width="30" height="22" rx="2" fill="#140c08"/>
      <rect x="1.5" y="1.5" width="27" height="19" rx="2" fill="none" stroke="#ff5a14" stroke-width="1.2" opacity=".45"/>
      <circle cx="8" cy="17" r="1.3" fill="#ff7a1a" class="ember-dot"/><circle cx="21" cy="15" r="1" fill="#ffb02e" class="ember-dot" style="animation-delay:.5s"/>
    </g>

// ---------- state ----------
let blocks, day, sealed, busy = false;
function reset() { blocks = new Map(); day = 0; sealed = -1; anim.angle = 0; anim.fall = null; }
function firstGap() { let best = -1; for (const [i, b] of blocks) if (b.burnt && (best < 0 || i < best)) best = i; return best; }
function firstEmpty() { for (let i = 0; i < SLOTS.length; i++) if (!blocks.has(i)) return i; return -1; }

// A level seals once it is complete with only fire-proof stones: it can never lean or fall.
function updateSealed() {
  while (sealed + 1 < TIERS.length) {
    const t = TIERS[sealed + 1];
    for (let i = t.start; i < t.end; i++) { const b = blocks.get(i); if (!b || b.burnt || MAT[b.mat].burns) return; }
    sealed++;
  }
}

// Precious stones fill burnt gaps first (lowest first); wood, hay and stubble go on top.
function place(mat) {
  let i = -1, seam = false;
  if (!MAT[mat].burns) { i = firstGap(); seam = i >= 0; }
  if (i < 0) i = firstEmpty();
  if (i < 0) return -1;
  blocks.set(i, { mat, day, burnt: false, seam });
  return i;
}

function topTier() { let m = -1; for (const i of blocks.keys()) m = Math.max(m, SLOTS[i].k); return m; }

// The weakest unsealed level decides everything: it is where the tower bends, and where it breaks.
function stability() {
  let worst = { k: -1, ratio: 0, side: 1, gaps: 0 };
  let totalGaps = 0;
  for (const t of TIERS) {
    if (t.k <= sealed) continue;
    let filled = 0, gaps = 0, left = 0, right = 0;
    for (let i = t.start; i < t.end; i++) {
      const b = blocks.get(i);
      if (!b) continue;
      filled++;
      if (b.burnt) { gaps++; SLOTS[i].c < t.w / 2 ? left++ : right++; }
    }
    totalGaps += gaps;
    const ratio = filled ? gaps / filled : 0;
    if (ratio > worst.ratio) worst = { k: t.k, ratio, side: right >= left ? 1 : -1, gaps };
  }
  let tier = 0;
  if (worst.ratio >= 0.45) tier = 3; else if (worst.ratio >= 0.2) tier = 2; else if (worst.ratio >= 0.06) tier = 1;
  return { ...worst, tier, totalGaps, lean: worst.side * Math.min(16, worst.ratio * 38) };
}

function forecast() {
  let filled = 0, burn = 0;
  for (const [i, b] of blocks) {
    if (SLOTS[i].k <= sealed || b.burnt) continue;
    filled++;
    if (MAT[b.mat].burns) burn++;
  }
  return filled ? burn / filled : 0;
}

// ---------- render ----------
const scene = document.getElementById('scene');
const matRef = (b, i) => (BURNS.includes(b.mat) ? `m-${b.mat}-${i % 3}` : `m-${b.mat}`);

function tierSVG(t, st, newIdx) {
  let glows = '', cells = '', flies = '', cracks = '', any = false, flyN = 0, rows = 0;
  for (let i = t.start; i < t.end; i++) {
    const b = blocks.get(i);
    if (!b) continue;
    any = true;
    rows = Math.max(rows, SLOTS[i].r + 1);
    const { x, y } = SLOTS[i];
    if (b.burnt) {
      cells += `<use href="#gap" x="${x}" y="${y}" class="cell" data-i="${i}"/>`;
      if (st.tier >= 1) {
        const dx = (i % 2 ? 1 : -1) * 6;
        cracks += `<path d="M${x + 15} ${y} l${dx} -7 l${-dx / 2} -6 l${dx} -8" /><path d="M${x + 15} ${y + 22} l${-dx} 6 l${dx / 2} 5"/>`;
      }
      continue;
    }
    const m = MAT[b.mat];
    if (m.gem) glows += `<ellipse cx="${x + 15}" cy="${y + 11}" rx="24" ry="18" fill="url(#glow-${m.gem})"/>`;
    cells += `<use href="#${matRef(b, i)}" x="${x}" y="${y}" class="cell ${newIdx.includes(i) ? 'drop' : ''}" data-i="${i}"/>`;
    if (b.seam) cells += `<use href="#seam" x="${x}" y="${y}" pointer-events="none"/>`;
    if (m.burns && flyN < 6 && i % 3 !== 0) {
      flyN++;
      const r = 9 + (i % 4) * 3, dur = (1.6 + (i % 5) * 0.35).toFixed(2);
      flies += `<g transform="translate(${x + 15} ${y + 8})"><g><animateTransform attributeName="transform" type="rotate" from="0" to="${i % 2 ? 360 : -360}" dur="${dur}s" repeatCount="indefinite"/><g transform="translate(${r} 0)"><use href="#fly"/></g></g></g>`;
    }
  }
  if (!any) return '';
  // Stone backing behind the rows built so far; the ledge goes on once the top row has started.
  const w = t.w * CW, x0 = -w / 2, top = t.bottom - ROWS * CH, built = t.bottom - rows * CH;
  const gold = t.k <= sealed;
  return `
    <rect x="${x0 - 2}" y="${built}" width="${w + 4}" height="${rows * CH}" fill="#6d5a3f"/>
    <rect x="${x0 + w}" y="${built}" width="7" height="${rows * CH}" fill="#000" opacity=".22"/>
    <g>${glows}</g><g class="cells">${cells}</g>
    <g stroke="#1e130a" stroke-width="1.6" fill="none" opacity=".8" pointer-events="none">${cracks}</g>
    ${rows === ROWS ? `<rect x="${x0 - 10}" y="${top - LEDGE}" width="${w + 20}" height="${LEDGE}" rx="2" fill="${gold ? 'url(#goldLedge)' : '#b9a27a'}" stroke="${gold ? '#8a5e05' : '#7d6a4a'}" stroke-width="1"/>` : ''}
    ${gold ? `<rect x="${x0 - 10}" y="${top - LEDGE}" width="${w + 20}" height="2" fill="#fff8c8" opacity=".8"/>` : ''}
    <g class="flies" pointer-events="none">${flies}</g>`;
}

function ghostTier(k) {
  if (k >= TIERS.length) return '';
  const t = TIERS[k], w = t.w * CW, top = t.bottom - ROWS * CH;
  return `<rect x="${-w / 2}" y="${top - LEDGE}" width="${w}" height="${ROWS * CH + LEDGE}" rx="3" fill="rgba(255,255,255,.12)" stroke="#fff" stroke-width="1.5" stroke-dasharray="6 5" class="ghost" pointer-events="none"/>`;
}

function crown() {
  // The finished tower gets a golden crown and a glowing cross.
  const t = TIERS[TIERS.length - 1], top = t.bottom - ROWS * CH - LEDGE;
  return `<path d="M-50 ${top} L-40 ${top - 40} L-20 ${top - 18} L0 ${top - 60} L20 ${top - 18} L40 ${top - 40} L50 ${top}Z" fill="url(#gold)" stroke="#8a5e05"/>
    <circle cx="0" cy="${top - 95}" r="30" fill="#fff6c8" opacity=".5"/>
    <path d="M-4 ${top - 120} h8 v18 h14 v8 h-14 v26 h-8 v-26 h-14 v-8 h14z" fill="#fff8d8" stroke="#d4a017"/>`;
}

let pivotEl = null;
function render(newIdx = []) {
  const st = stability();
  const top = topTier();
  // Nest each level inside the one below it, so bending at the weak level carries everything above it.
  let inner = top + 1 < TIERS.length ? ghostTier(top + 1) : (sealed === TIERS.length - 1 ? crown() : '');
  for (let k = top; k >= 0; k--) inner = `<g id="tg${k}">${tierSVG(TIERS[k], st, newIdx)}${inner}</g>`;
  if (top < 0) inner = ghostTier(0);
  scene.innerHTML = scenery() + `<g id="tower">${inner}</g>` + foundation() + `<g id="fx"></g>`;
  pivotEl = st.k >= 0 && st.tier >= 1 ? document.getElementById(`tg${st.k}`) : null;
  if (pivotEl) {
    const t = TIERS[st.k];
    anim.px = st.side * (t.w * CW / 2);
    anim.py = t.bottom;
  }
  anim.target = st.tier >= 2 ? st.lean : st.tier === 1 ? st.lean * 0.35 : 0;
  if (!pivotEl) anim.angle = 0;
  anim.wobble = st.tier >= 2 ? (st.tier === 3 ? 1.2 : 0.5) : 0;
  setCamera(top);
  document.getElementById('danger').classList.toggle('show', st.tier >= 2);
  renderPanel(st);
}

// ---------- animation loop: lean, wobble, camera, falling ----------
const anim = { angle: 0, target: 0, wobble: 0, px: 0, py: 0, fall: null };
const cam = { x: -300, y: -420, w: 600, h: 760, tx: -300, ty: -420, tw: 600, th: 760 };
function setCamera(top) {
  const area = document.getElementById('area').getBoundingClientRect();
  const aspect = area.width / Math.max(1, area.height);
  const k = Math.max(top + 2, 4);
  const topY = -(Math.min(k, TIERS.length) * TIER_H) - 150;
  const bottomY = 330;
  let h = bottomY - topY, w = h * aspect;
  if (w < 640) { w = 640; h = w / aspect; }
  Object.assign(cam, { tx: -w / 2, ty: bottomY - h, tw: w, th: h });
}
function frame(t) {
  cam.x += (cam.tx - cam.x) * 0.07; cam.y += (cam.ty - cam.y) * 0.07; cam.w += (cam.tw - cam.w) * 0.07; cam.h += (cam.th - cam.h) * 0.07;
  scene.setAttribute('viewBox', `${cam.x.toFixed(1)} ${cam.y.toFixed(1)} ${cam.w.toFixed(1)} ${cam.h.toFixed(1)}`);
  if (pivotEl && pivotEl.isConnected) {
    let a, dy = 0;
    if (anim.fall) {
      const p = Math.min(1, (t - anim.fall.start) / anim.fall.dur);
      a = anim.fall.from + anim.fall.side * 100 * p * p;
      dy = 900 * p * p * p;
      if (p >= 1 && !anim.fall.done) { anim.fall.done = true; anim.fall.cb(); }
    } else {
      anim.angle += (anim.target - anim.angle) * 0.05;
      a = anim.angle + (anim.wobble ? Math.sin(t / 55) * anim.wobble + Math.sin(t / 23) * anim.wobble * 0.3 : 0);
    }
    pivotEl.setAttribute('transform', `translate(0 ${dy.toFixed(1)}) rotate(${a.toFixed(2)} ${anim.px} ${anim.py})`);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- panel ----------
function renderPanel(st) {
  const top = topTier();
  document.getElementById('height').innerHTML = `🗼 Level ${Math.max(0, top + 1)} of ${TIERS.length}<br><small>${sealed + 1} level${sealed === 0 ? '' : 's'} sealed in gold (safe forever)</small>`;
  document.getElementById('levels').innerHTML = TIERS.map((t) => {
    let n = 0;
    for (let i = t.start; i < t.end; i++) { const b = blocks.get(i); if (b && !b.burnt) n++; }
    const total = t.end - t.start;
    const cls = t.k <= sealed ? 'sealed' : t.k === st.k && st.tier >= 2 ? 'bad' : t.k > top + 1 ? 'future' : '';
    return `<div class="lvl ${cls}"><span>Level ${t.k + 1}</span><div class="bar"><i style="width:${(n / total) * 100}%"></i></div><span>${t.k <= sealed ? '✓ gold' : `${n}/${total}`}</span></div>`;
  }).join('');
  const f = forecast();
  const fb = document.getElementById('forecastBar');
  fb.style.width = `${Math.round(f * 100)}%`;
  fb.style.background = f > 0.3 ? '#dc2626' : f > 0.15 ? '#f59e0b' : '#22c55e';
  document.getElementById('forecast').innerHTML = `${Math.round(f * 100)}% would burn<small>${f > 0.3 ? 'Danger! The next fire could bring the top down.' : f > 0.15 ? 'Careful: lots of hay and wood in your tower.' : 'Looking strong.'}</small>`;
  const label = ['💪 Strong and steady', '⚡ Cracking', '⚠️ About to topple!', '💥 Collapsing'][st.tier];
  const sub = st.tier === 0 ? 'Keep building with precious stones.'
    : st.tier === 1 ? `Level ${st.k + 1} has burnt gaps. Fill them with precious stones.`
    : `Level ${st.k + 1} is ${Math.round(st.ratio * 100)}% burnt. One more bad fire and everything above it falls into the sea!`;
  const el = document.getElementById('stab');
  el.className = `stab ${st.tier >= 2 ? 'bad' : ''}`;
  el.innerHTML = `${label}<small>${sub}</small>`;
  document.getElementById('subtitle').textContent = `Day ${day} · Week ${Math.floor(day / 7) + 1} · built on Jesus Christ`;
}

function renderLegend() {
  const rows = [['m-gold', 'Gold = prayer'], ['m-silver', 'Silver = kind words'], ['m-gem-carnelian', 'Gems = fruit of the Spirit'], ['m-pearl', 'Pearl = owned up'],
    ['m-wood-0', 'Wood = fighting'], ['m-hay-0', 'Hay = tantrum'], ['m-stubble-0', 'Stubble = rude words']];
  document.getElementById('legend').innerHTML = rows.map(([m, t]) => `<span><svg viewBox="-2 -7 34 33"><use href="#${m}"/></svg>${t}</span>`).join('');
}

// ---------- simulated days ----------
const pick = (a) => a[Math.floor(Math.random() * a.length)];
function dayItems(kind) {
  const good = () => pick(['gold', 'gold', 'silver', ...GEM_IDS]);
  if (kind === 'great') return ['gold', 'gold', 'silver', pick(GEM_IDS), pick(GEM_IDS), pick(GEM_IDS)];
  if (kind === 'mixed') return [good(), good(), good(), good(), pick(BURNS), pick(BURNS)];
  if (kind === 'hard') return [good(), pick(BURNS), pick(BURNS), pick(BURNS), pick(BURNS)];
  if (kind === 'sorry') return ['pearl', 'pearl'];
  return [];
}
function addDay(kind, animate = true) {
  day++;
  const placed = [];
  for (const m of dayItems(kind)) { const i = place(m); if (i >= 0) placed.push(i); }
  updateSealed();
  if (animate) render(placed);
  return placed;
}

// Fire burns wood, hay and stubble. If the weakest level is too burnt, it breaks:
// that level and everything above it fall into the sea, and that work is lost.
function fireCommit() {
  let burnt = 0;
  for (const b of blocks.values()) if (!b.burnt && MAT[b.mat].burns) { b.burnt = true; burnt++; }
  const st = stability();
  return { burnt, st, breakAt: st.tier === 3 ? st.k : -1 };
}
function fallenSet(k) { return [...blocks.keys()].filter((i) => SLOTS[i].k >= k); }
function lost(list) { return list.filter((i) => !blocks.get(i).burnt).length; }

// ---------- fire ----------
const area = document.getElementById('area');
const capEl = document.getElementById('caption');
function caption(html, ms, danger = false) {
  capEl.innerHTML = html;
  capEl.classList.toggle('danger', danger);
  capEl.classList.add('show');
  clearTimeout(caption.t);
  if (ms) caption.t = setTimeout(() => capEl.classList.remove('show'), ms);
}
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

async function fireTest() {
  if (busy || !blocks.size) return;
  busy = true; setButtons(false);
  area.classList.add('dusk');
  caption('🔥 The fire will test the quality of each one’s work.<em>1 Corinthians 3:13</em>');
  await wait(1400);
  const fw = document.getElementById('firewall');
  fw.classList.remove('go'); void fw.offsetWidth; fw.classList.add('go');
  // The fire climbs the tower from the bottom: each rotten stone catches, flares and burns away.
  const topY = TIERS[Math.max(0, topTier())].bottom - TIER_H;
  for (const u of scene.querySelectorAll('.cells use.cell')) {
    const b = blocks.get(Number(u.dataset.i));
    if (!b || b.burnt || !MAT[b.mat].burns) continue;
    const x = Number(u.getAttribute('x')), y = Number(u.getAttribute('y'));
    const delay = 200 + 3000 * (y / Math.min(-1, topY));
    setTimeout(() => {
      const f = document.createElementNS('http://www.w3.org/2000/svg', 'use');
      f.setAttribute('href', '#flame'); f.setAttribute('x', x); f.setAttribute('y', y - 10); f.setAttribute('class', 'flame');
      u.parentNode.appendChild(f);
      setTimeout(() => { u.classList.add('char'); sparks(x + 15, y); }, 450);
      setTimeout(() => f.remove(), 1300);
    }, delay);
  }
  setTimeout(() => scene.querySelectorAll('.flies').forEach((g) => { g.innerHTML = ''; }), 1600); // flies flee
  await wait(3800);
  document.getElementById('tower').classList.add('refine');
  caption('✨ Gold, silver and precious stones: refined!');
  await wait(1400);
  const res = fireCommit();
  area.classList.remove('dusk');
  render();
  if (res.breakAt >= 0) {
    area.classList.add('storm');
    caption(`😱 Level ${res.breakAt + 1} is burnt through… the tower is going over!`, 0, true);
    anim.target = res.st.side * 24;
    anim.wobble = 2;
    await wait(2400);
    const fallen = fallenSet(res.breakAt);
    const lostN = lost(fallen);
    await new Promise((resolve) => {
      anim.fall = { start: performance.now(), dur: 1700, from: anim.angle, side: res.st.side, cb: resolve };
      debris(res.st.side);
    });
    splash(res.st.side);
    for (const i of fallen) blocks.delete(i);
    anim.fall = null; anim.angle = 0;
    area.classList.remove('storm');
    updateSealed();
    render();
    caption(`💥 It fell into the sea. ${lostN} stone${lostN === 1 ? '' : 's'} of your work were lost.<em>But Jesus, the foundation, still stands, and “he himself will be saved” (1 Cor 3:15). Rebuild with precious stones!</em>`, 9000, true);
    log(`Fire: ${res.burnt} burnt. Level ${res.breakAt + 1} broke and ${lostN} stones fell into the sea.`);
  } else if (res.st.tier === 2) {
    caption(`⚠️ ${res.burnt} rotten stones burnt away and the tower is leaning from level ${res.st.k + 1}!<em>Fill the gaps with precious stones before the next fire, or everything above it falls.</em>`, 8000, true);
    log(`Fire: ${res.burnt} burnt. About to topple!`);
  } else {
    caption(res.burnt ? `🕊️ ${res.burnt} rotten stone${res.burnt === 1 ? '' : 's'} burnt away. What you built with God remains.<em>Fill the gaps with precious stones.</em>` : '🕊️ Nothing burnt! Everything you built with God remains.', 6000);
    log(res.burnt ? `Fire: ${res.burnt} burnt.` : 'Fire: nothing burnt!');
  }
  document.getElementById('tower')?.classList.remove('refine');
  busy = false; setButtons(true);
}

function particle(tag, attrs, cls, ms, style = {}) {
  const fx = document.getElementById('fx');
  if (!fx) return;
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  e.setAttribute('class', cls);
  Object.assign(e.style, style);
  fx.appendChild(e);
  setTimeout(() => e.remove(), ms);
}
function sparks(x, y) {
  // Sparks rise from the tower's (possibly leaning) position; close enough for a quick effect.
  for (let k = 0; k < 2; k++) particle('circle', { cx: x + Math.random() * 16 - 8, cy: y + 8, r: 1.8, fill: k ? '#ffd166' : '#ff7a1a' }, 'spark-up', 1700);
}
function debris(side) {
  for (let k = 0; k < 30; k++) {
    particle('rect', { x: side * (40 + Math.random() * 200), y: -150 - Math.random() * 400, width: 4 + Math.random() * 6, height: 3 + Math.random() * 5,
      fill: pick(['#8a7a5a', '#6b5a40', '#b8a98a', '#d4a017']) }, 'debris', 2200, { animationDelay: `${Math.random() * 0.8}s` });
  }
}
function splash(side) {
  const x = side * 360;
  for (let k = 0; k < 26; k++) {
    particle('circle', { cx: x + Math.random() * 120 - 60, cy: 250, r: 3 + Math.random() * 5, fill: pick(['#e6f7ff', '#bfe9f7', '#8fd3ea']) }, 'splash', 1300,
      { '--sx': `${(Math.random() * 160 - 80).toFixed(0)}px`, '--sy': `${(-60 - Math.random() * 140).toFixed(0)}px` });
  }
}

// Pebbles drop from a leaning tower; gold and gems sparkle.
setInterval(() => {
  if (document.hidden || busy) return;
  const st = stability();
  if (st.tier >= 2 && pivotEl) particle('rect', { x: anim.px + Math.random() * 30 - 15, y: anim.py - 10, width: 3, height: 3, fill: '#7a6a4a' }, 'debris', 1400);
  const shiny = [...scene.querySelectorAll('.cells use.cell')].filter((u) => { const b = blocks.get(Number(u.dataset.i)); return b && !b.burnt && (MAT[b.mat].gem || b.mat === 'gold' || b.mat === 'pearl'); });
  for (let k = 0; k < 2 && shiny.length; k++) {
    const u = pick(shiny);
    const s = document.createElementNS('http://www.w3.org/2000/svg', 'use');
    s.setAttribute('href', '#star');
    s.setAttribute('x', Number(u.getAttribute('x')) + 6 + Math.random() * 18); s.setAttribute('y', Number(u.getAttribute('y')) + 4 + Math.random() * 10);
    s.setAttribute('class', 'twinkle');
    u.parentNode.appendChild(s); setTimeout(() => s.remove(), 1200);
  }
}, 600);

// ---------- UI ----------
function log(t) { document.getElementById('log').textContent = t; }
function setButtons(on) { document.querySelectorAll('button[data-act]').forEach((b) => { b.disabled = !on; }); }

function fastForward(days) {
  const kinds = ['great', 'great', 'mixed', 'mixed', 'great', 'hard', 'great', 'mixed', 'great', 'sorry'];
  let burnt = 0, falls = 0, lostN = 0;
  for (let d = 0; d < days; d++) {
    addDay(pick(kinds), false);
    if (day % 7 === 0) {
      const r = fireCommit();
      burnt += r.burnt;
      if (r.breakAt >= 0) { const f = fallenSet(r.breakAt); lostN += lost(f); for (const i of f) blocks.delete(i); falls++; }
      updateSealed();
    }
  }
  render();
  log(`${days} days built. Fires burnt ${burnt} rotten stones${falls ? `, and the top fell into the sea ${falls}× (${lostN} stones lost)` : ''}.`);
}

document.querySelector('.panel').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-act]');
  if (!b || busy) return;
  const a = b.dataset.act;
  if (a === 'fire') return fireTest();
  if (a === 'reset') { reset(); render(); return log('Fresh start on the one foundation: Jesus Christ.'); }
  if (a === 'week') return fastForward(7);
  if (a === 'month') return fastForward(28);
  const placed = addDay(a);
  log(`Day ${day}: ${placed.map((i) => MAT[blocks.get(i).mat].name).join(', ') || 'the tower is complete!'}`);
});

const tip = document.getElementById('tip');
scene.addEventListener('click', (e) => {
  const u = e.target.closest('use.cell');
  if (!u) return;
  const b = blocks.get(Number(u.dataset.i));
  if (!b) return;
  const m = MAT[b.mat];
  tip.textContent = b.burnt ? `🔥 Burnt away (was ${m.name}). Fill me with a precious stone!` : `${m.name} · ${m.src} · day ${b.day}${b.seam ? ' · ✨ gap filled again' : ''}`;
  tip.style.left = `${Math.min(e.clientX + 12, innerWidth - 380)}px`;
  tip.style.top = `${e.clientY - 46}px`;
  tip.classList.add('show');
  clearTimeout(tip.t);
  tip.t = setTimeout(() => tip.classList.remove('show'), 2600);
  u.classList.remove('click'); void u.getBoundingClientRect(); u.classList.add('click');
});
addEventListener('resize', () => setCamera(topTier()));

reset();
renderLegend();
// ?sim=60 builds 60 simulated days on load (handy for a quick look at a grown tower).
const simDays = Number(new URLSearchParams(location.search).get('sim')) || 0;
if (simDays) fastForward(simDays); else render();
Object.assign(cam, { x: cam.tx, y: cam.ty, w: cam.tw, h: cam.th });
</script>
</body>
