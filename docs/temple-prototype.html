<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Temple Builder</title>
<!-- Design prototype for the 1 Corinthians 3 "Temple Builder" idea. Not wired into the app yet:
     the buttons on the right simulate days of logging so you can watch weeks and months of growth. -->
<style>
  :root {
    --ink: #1f2430; --muted: #5b6170; --card: #fff; --bg: #fff8ee;
    --shadow: 0 6px 0 rgba(0,0,0,.08), 0 12px 30px rgba(60,40,10,.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  .app { display: grid; grid-template-columns: 1fr 340px; height: 100vh; }
  .stage-area { position: relative; overflow: hidden;
    background: linear-gradient(#9fd3ff 0%, #cfeaff 45%, #fff3dc 100%); transition: background 1.2s; }
  .stage-area.dusk { background: linear-gradient(#3a2d5c 0%, #8a4d6b 45%, #f2a65a 100%); }
  .sun { position: absolute; top: 40px; right: 70px; width: 90px; height: 90px; border-radius: 50%;
    background: radial-gradient(circle, #fff7c2, #ffd36b 60%, rgba(255,211,107,0) 70%); }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; }
  .title { position: absolute; top: 18px; left: 24px; margin: 0; font-size: 40px; font-weight: 900;
    color: #3b2a10; text-shadow: 0 2px 0 rgba(255,255,255,.6); }
  .title small { display: block; font-size: 18px; font-weight: 700; color: #6b5a3a; }
  .caption { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%);
    background: rgba(20,16,10,.78); color: #fff; padding: 14px 26px; border-radius: 22px;
    font-size: 24px; font-weight: 800; max-width: 86%; text-align: center; opacity: 0; transition: opacity .4s; }
  .caption.show { opacity: 1; }
  .caption em { display: block; font-size: 16px; font-weight: 600; opacity: .8; font-style: normal; }

  /* gold shimmer sweeping the building every few seconds */
  .shimmer { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: soft-light;
    background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,.9) 50%, transparent 60%);
    background-size: 300% 100%; animation: shimmer 9s ease-in-out infinite; }
  @keyframes shimmer { 0%, 70% { background-position: 150% 0; } 100% { background-position: -50% 0; } }

  #bld { transform-box: view-box; transition: transform 1s cubic-bezier(.3,1.4,.5,1); }
  .blk { cursor: pointer; transform-box: fill-box; transform-origin: center; }
  .blk.drop { animation: drop .45s cubic-bezier(.3,1.5,.5,1); }
  .blk.char { animation: char .7s ease-in forwards; }
  .blk.tumble { animation: tumble 1s ease-in forwards; }
  .blk.click { animation: click .6s ease-out; }
  .refine { animation: refine 1.4s ease-out; }
  @keyframes drop { from { transform: translateY(-40px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes char {
    0% { filter: brightness(1); }
    35% { filter: brightness(1.8) sepia(1) saturate(4) hue-rotate(-20deg); }
    65% { filter: brightness(.25); opacity: 1; transform: none; }
    100% { filter: brightness(.1); opacity: 0; transform: translateY(-14px) scale(.6); }
  }
  @keyframes tumble { to { transform: translate(var(--tx, 20px), 120px) rotate(var(--rot, 40deg)); opacity: 0; } }
  @keyframes click { 0% { transform: scale(1.5); filter: brightness(2); } 100% { transform: none; filter: none; } }
  @keyframes refine { 0% { filter: none; } 40% { filter: brightness(1.9) saturate(1.3); } 100% { filter: none; } }

  .flames { animation: sweep 3.2s linear forwards; }
  .flames path { animation: flicker .25s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: bottom; }
  .flames path:nth-child(2) { animation-duration: .31s; }
  .flames path:nth-child(3) { animation-duration: .19s; }
  @keyframes sweep { from { transform: translateX(-420px); } to { transform: translateX(420px); } }
  @keyframes flicker { from { transform: scaleY(.9) skewX(-3deg); } to { transform: scaleY(1.08) skewX(3deg); } }
  .ember { animation: ember 1.6s ease-out forwards; }
  @keyframes ember { to { transform: translateY(-90px); opacity: 0; } }
  .spark { animation: spark 1.1s ease-out forwards; transform-box: fill-box; transform-origin: center; }
  @keyframes spark { 0% { transform: scale(0); opacity: 0; } 40% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(0); opacity: 0; } }
  .wobble { animation: wobble 2.4s ease-in-out infinite; }
  @keyframes wobble { 0%, 100% { transform: rotate(var(--lean, 0deg)); } 50% { transform: rotate(calc(var(--lean, 0deg) + .6deg)); } }

  /* ----- panel ----- */
  .panel { background: #fffdf8; border-left: 1px solid #eadfce; padding: 18px 18px 24px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 14px; }
  .panel h2 { margin: 0; font-size: 20px; }
  .box { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 14px 16px; }
  .stage-row { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 8px; margin: 6px 0; font-weight: 800; }
  .stage-row .ic { font-size: 24px; }
  .stage-row .bar { grid-column: 2 / 4; height: 10px; border-radius: 6px; background: #efe7da; overflow: hidden; margin-top: -4px; }
  .stage-row .bar i { display: block; height: 100%; background: linear-gradient(90deg, #f2c94c, #d4a017); }
  .stage-row.sealed .bar i { background: linear-gradient(90deg, #6ee7b7, #10b981); }
  .stage-row.locked { opacity: .45; }
  .stab { font-size: 22px; font-weight: 900; }
  .stab small { display: block; font-size: 15px; font-weight: 600; color: var(--muted); }
  .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; font-size: 14px; font-weight: 700; }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .legend i { width: 18px; height: 18px; border-radius: 5px; display: inline-block; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button { font: inherit; border: 0; border-radius: 16px; min-height: 60px; padding: 0 10px; font-size: 18px; font-weight: 800;
    background: #fff; box-shadow: var(--shadow); color: var(--ink); cursor: pointer; }
  button:active { transform: translateY(3px); }
  button.fire { grid-column: 1 / 3; background: linear-gradient(135deg, #ff9a3c, #e8501b); color: #fff; font-size: 22px; }
  button.wide { grid-column: 1 / 3; }
  button:disabled { opacity: .4; }
  .log { font-size: 14px; color: var(--muted); font-weight: 600; min-height: 40px; }
  .note { font-size: 13px; color: var(--muted); }
  #tip { position: fixed; z-index: 10; pointer-events: none; background: #1f2430; color: #fff; padding: 8px 14px;
    border-radius: 12px; font-size: 16px; font-weight: 800; opacity: 0; transition: opacity .2s; white-space: nowrap; }
  #tip.show { opacity: 1; }
  @media (max-width: 900px) { .app { grid-template-columns: 1fr; grid-template-rows: 60vh auto; height: auto; } }
  @media (prefers-reduced-motion: reduce) { .shimmer, .wobble { animation: none; } }
</style>
</head>
<body>
<div class="app">
  <div class="stage-area" id="area">
    <div class="sun"></div>
    <h1 class="title">My Temple<small id="subtitle">Day 0 · built on Jesus, the cornerstone</small></h1>
    <svg id="scene" viewBox="-175 -160 350 330" preserveAspectRatio="xMidYMid meet" aria-label="Temple building"></svg>
    <div class="shimmer"></div>
    <div class="caption" id="caption"></div>
  </div>
  <aside class="panel">
    <div class="box">
      <h2>Building stages</h2>
      <div id="stages"></div>
    </div>
    <div class="box"><div class="stab" id="stab"></div></div>
    <div class="box">
      <h2 style="margin-bottom:8px">What builds what</h2>
      <div class="legend" id="legend"></div>
    </div>
    <div class="box">
      <h2 style="margin-bottom:10px">Try it (simulate days)</h2>
      <div class="btns">
        <button data-act="great">🌟 Great day</button>
        <button data-act="mixed">🙂 Mixed day</button>
        <button data-act="hard">😣 Hard day</button>
        <button data-act="sorry">🫂 Made it right</button>
        <button class="fire" data-act="fire">🔥 Test by fire</button>
        <button data-act="week">⏩ 1 week</button>
        <button data-act="month">⏩ 1 month</button>
        <button data-act="mode" id="modeBtn">Fire style: Topple</button>
        <button data-act="reset">↺ Start again</button>
      </div>
      <p class="log" id="log">Tap a day to start building. Tap any block to see what built it.</p>
      <p class="note">Fast-forward runs a fire test every 7 days. The foundation (Jesus) never burns, and finished stages are sealed for good.</p>
    </div>
  </aside>
</div>
<div id="tip"></div>

<script>
// ---------- materials ----------
// Cube faces: [top, left, right]. Fruit of the Spirit map to Revelation 21 foundation stones.
const MAT = {
  gold:    { name: 'Gold', src: 'Prayer', faces: ['url(#gTop)', 'url(#gLeft)', 'url(#gRight)'], burns: false, chip: '#e6b422' },
  silver:  { name: 'Silver', src: 'Kind words / making peace', faces: ['url(#sTop)', '#b8c2cf', '#7d8896'], burns: false, chip: '#c5ced9' },
  pearl:   { name: 'Pearl', src: 'Owned up and made it right', faces: ['url(#pTop)', '#eadfd3', '#c9bbae'], burns: false, chip: '#f3ebe2' },
  wood:    { name: 'Wood', src: 'Fight with a sibling', faces: ['#d9a066', '#b97a3e', '#8e5a2b'], burns: true, chip: '#b97a3e', tex: 'wood' },
  hay:     { name: 'Hay', src: 'Tantrum', faces: ['#f0d67a', '#e3c46a', '#c4a44c'], burns: true, chip: '#e3c46a', tex: 'hay' },
  stubble: { name: 'Stubble', src: 'Rude words', faces: ['#c9d3b0', '#aeb98f', '#8e9a70'], burns: true, chip: '#aeb98f', tex: 'stubble' },
};
const GEMS = {
  // Symbolic links, chosen with Scripture in mind (see docs/temple-builder-concept.md).
  carnelian:  ['Carnelian', 'Love', '#ff9e9e', '#e53935', '#9b1c1c'],
  topaz:      ['Topaz', 'Joy', '#ffe08a', '#f5a623', '#b86e00'],
  sapphire:   ['Sapphire', 'Peace', '#9cc9ff', '#2e6fd8', '#173f8a'],
  chalcedony: ['Chalcedony', 'Patience', '#e9eef8', '#a9b4cf', '#6f7ba0'],
  emerald:    ['Emerald', 'Kindness', '#9af0b8', '#1e9e57', '#0e6236'],
  chrysolite: ['Chrysolite', 'Goodness', '#e4ff9a', '#93c83e', '#5c8a1c'],
  jasper:     ['Jasper', 'Faithfulness', '#f2fbff', '#b9dcea', '#7fb0c6'],
  beryl:      ['Beryl', 'Gentleness', '#b3f3ff', '#3fb8cf', '#1d7f94'],
  amethyst:   ['Amethyst', 'Self-control', '#e0bfff', '#8e44ad', '#5b2275'],
};
for (const [id, [name, fruit, top, left, right]] of Object.entries(GEMS)) {
  MAT['gem-' + id] = { name, src: fruit, faces: [top, left, right], burns: false, gem: true, chip: left };
}
const PRECIOUS = Object.keys(MAT).filter((m) => !MAT[m].burns);
const GEM_IDS = Object.keys(MAT).filter((m) => MAT[m].gem);
const BURNS = ['wood', 'hay', 'stubble'];

// ---------- blueprint: ordered slots [x, y, z], grouped into stages ----------
const STAGES = (() => {
  const st = [];
  const inTower = (x, y) => (x <= 1 || x >= 8) && (y <= 1 || y >= 6);
  const perim = (x, y) => x === 0 || x === 9 || y === 0 || y === 7;
  const window = (x, y, z) => (z === 2 || z === 3) && (((y === 0 || y === 7) && (x === 2 || x === 7)) || ((x === 0 || x === 9) && (y === 3 || y === 4)));
  const gate = (x, y, z) => y === 7 && (x === 4 || x === 5) && z <= 3;
  const s1 = [], s2 = [], s3 = [], s4 = [], s5 = [];
  for (let y = 0; y < 8; y++) for (let x = 0; x < 10; x++) s1.push([x, y, 0]);
  for (let z = 1; z <= 4; z++) for (let y = 0; y < 8; y++) for (let x = 0; x < 10; x++)
    if (perim(x, y) && !window(x, y, z) && !gate(x, y, z)) s2.push([x, y, z]);
  for (let z = 5; z <= 8; z++) for (let y = 0; y < 8; y++) for (let x = 0; x < 10; x++)
    if (inTower(x, y) && perim(x, y) || (inTower(x, y) && z <= 8 && (x === 1 || x === 8) && (y === 1 || y === 6))) s3.push([x, y, z]);
  for (let y = 0; y < 8; y++) for (let x = 0; x < 10; x++)
    if (perim(x, y) && !inTower(x, y) && (x + y) % 2 === 0) s3.push([x, y, 5]);
  for (let z = 0; z <= 4; z++) { s4.push([3, 8, z]); s4.push([6, 8, z]); }
  for (const x of [3, 4, 5, 6]) s4.push([x, 8, 5]);
  for (const x of [4, 5]) s4.push([x, 7, 4]);
  for (let y = 1; y <= 6; y++) for (let x = 1; x <= 8; x++) if (!inTower(x, y)) s5.push([x, y, 5]);
  for (let y = 2; y <= 5; y++) for (let x = 2; x <= 7; x++) s5.push([x, y, 6]);
  for (let y = 3; y <= 4; y++) for (let x = 3; x <= 6; x++) s5.push([x, y, 7]);
  for (let y = 3; y <= 4; y++) for (let x = 4; x <= 5; x++) s5.push([x, y, 8]);
  s5.push([4, 3, 9], [4, 3, 10]);
  const sortZ = (a, b) => a[2] - b[2] || (a[0] + a[1]) - (b[0] + b[1]);
  st.push({ name: 'Foundation', icon: '🧱', slots: s1.sort(sortZ) });
  st.push({ name: 'Walls', icon: '🏛️', slots: s2.sort(sortZ) });
  st.push({ name: 'Towers', icon: '🗼', slots: s3.sort(sortZ) });
  st.push({ name: 'Pearl gate', icon: '🚪', slots: s4.sort(sortZ) });
  st.push({ name: 'Golden dome', icon: '🕌', slots: s5.sort(sortZ) });
  return st;
})();
const SLOTS = [];
STAGES.forEach((s, si) => { s.start = SLOTS.length; s.slots.forEach((p) => SLOTS.push({ p, stage: si })); s.end = SLOTS.length; });

// ---------- state ----------
let blocks, day, sealed, busy = false;
let gentle = false; // gentle style: nothing falls; too many gaps just stop the next storey rising
function reset() {
  blocks = new Map(); // slot index -> { mat, day, burnt, seam }
  day = 0;
  sealed = -1;        // highest stage that is sealed (finished with only fire-proof blocks)
}

// ---------- iso drawing ----------
const W = 28, HZ = 16;
const scr = ([x, y, z]) => [(x - y) * W / 2, (x + y) * W / 4 - z * HZ];
const TOP = `0,0 ${W/2},${W/4} 0,${W/2} ${-W/2},${W/4}`;
const LEFT = `${-W/2},${W/4} 0,${W/2} 0,${W/2+HZ} ${-W/2},${W/4+HZ}`;
const RIGHT = `0,${W/2} ${W/2},${W/4} ${W/2},${W/4+HZ} 0,${W/2+HZ}`;

function texture(t) {
  if (t === 'hay') return `<g stroke="#a8862f" stroke-width=".7" opacity=".55">
      <path d="M-12 12l4 9M-8 10l4 9M-4 12l3 8M4 12l-3 8M8 10l-4 9M12 12l-4 9"/></g>
      <path d="M-14 ${W/4+9} L0 ${W/2+9} L14 ${W/4+9}" stroke="#8a5a2b" stroke-width="1.4" fill="none"/>`;
  if (t === 'wood') return `<g stroke="#7a4a20" stroke-width=".8" opacity=".6" fill="none">
      <path d="M-14 ${W/4+5} L0 ${W/2+5} M-14 ${W/4+10} L0 ${W/2+10} M0 ${W/2+5} L14 ${W/4+5} M0 ${W/2+10} L14 ${W/4+10}"/></g>`;
  if (t === 'stubble') return `<g stroke="#6f7a52" stroke-width=".9" opacity=".7">
      <path d="M-10 13v3M-6 16v3M-2 18v3M3 18v3M7 15v3M11 13v3M-9 22v3M9 21v3"/></g>`;
  return '';
}

function defs() {
  let s = `<defs>
    <linearGradient id="gTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff6c4"/><stop offset=".45" stop-color="#f6d35b"/><stop offset="1" stop-color="#d4a017"/></linearGradient>
    <linearGradient id="gLeft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8b93c"/><stop offset="1" stop-color="#b8860b"/></linearGradient>
    <linearGradient id="gRight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b08417"/><stop offset="1" stop-color="#7a5410"/></linearGradient>
    <linearGradient id="sTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfd8e3"/></linearGradient>
    <radialGradient id="pTop"><stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#f6eee6"/><stop offset="1" stop-color="#e2d3c4"/></radialGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#ffe9a8" stop-opacity=".9"/><stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/></radialGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff5a1f"/><stop offset=".6" stop-color="#ffb02e"/><stop offset="1" stop-color="#fff2a8" stop-opacity=".2"/></linearGradient>`;
  for (const [id, m] of Object.entries(MAT)) {
    const [t, l, r] = m.faces;
    s += `<g id="m-${id}">
      <polygon points="${LEFT}" fill="${l}"/><polygon points="${RIGHT}" fill="${r}"/><polygon points="${TOP}" fill="${t}"/>
      ${m.gem ? `<polygon points="0,${W/8} ${W/4},${W/4} 0,${3*W/8} ${-W/4},${W/4}" fill="#fff" opacity=".35"/>
        <path d="M0 0L0 ${W/8}M${W/2} ${W/4}L${W/4} ${W/4}M0 ${W/2}L0 ${3*W/8}M${-W/2} ${W/4}L${-W/4} ${W/4}" stroke="#fff" stroke-width=".6" opacity=".5"/>
        <circle cx="-3" cy="5" r="1.4" fill="#fff"/>` : ''}
      ${id === 'gold' ? `<path d="M-6 3 L4 8" stroke="#fffbe0" stroke-width="1.4" opacity=".8"/>` : ''}
      ${texture(m.tex)}
      <polyline points="${-W/2},${W/4} 0,${W/2} ${W/2},${W/4}" fill="none" stroke="rgba(255,255,255,.35)" stroke-width=".6"/>
      <polygon points="0,0 ${W/2},${W/4} ${W/2},${W/4+HZ} 0,${W/2+HZ} ${-W/2},${W/4+HZ} ${-W/2},${W/4}" fill="none" stroke="rgba(40,25,0,.25)" stroke-width=".6"/>
    </g>`;
  }
  // An empty, softly glowing setting where something burnt away.
  s += `<g id="socket">
      <polygon points="${LEFT}" fill="rgba(255,214,120,.10)"/><polygon points="${RIGHT}" fill="rgba(255,214,120,.06)"/>
      <polygon points="${TOP}" fill="url(#glow)" stroke="#f5c542" stroke-width="1" stroke-dasharray="2 2"/>
    </g>
    <g id="seam"><polyline points="${-W/2},${W/4} 0,${W/2} ${W/2},${W/4} ${W/2},${W/4+HZ} 0,${W/2+HZ} ${-W/2},${W/4+HZ} ${-W/2},${W/4} 0,0 ${W/2},${W/4}" fill="none" stroke="#ffd34d" stroke-width="1" opacity=".75"/></g>
    <path id="star" d="M0 -6 L1.5 -1.5 L6 0 L1.5 1.5 L0 6 L-1.5 1.5 L-6 0 L-1.5 -1.5Z" fill="#fff"/>
  </defs>`;
  return s;
}

function scenery() {
  // Hills, then an iso grass plot with a gold path to the gate.
  const g = (x, y) => scr([x, y, 0]);
  const corner = (x, y) => { const [a, b] = g(x, y); return `${a},${b + W / 4}`; };
  return `
    <path d="M-260 60 Q-150 -40 -40 50 T 200 30 T 300 60 V 260 H -260Z" fill="#b9e3a0" opacity=".7"/>
    <path d="M-260 90 Q-120 20 20 90 T 300 80 V 260 H -260Z" fill="#a3d98a" opacity=".8"/>
    <polygon points="${corner(-3, -3)} ${corner(13, -3)} ${corner(13, 12)} ${corner(-3, 12)}" fill="#8fcf72" stroke="#7bbf5f" stroke-width="2"/>
    <polygon points="${corner(4, 8)} ${corner(6, 8)} ${corner(6, 12)} ${corner(4, 12)}" fill="#f3d27a" opacity=".9"/>
    <g opacity=".9">
      <text x="${g(-2, 4)[0]}" y="${g(-2, 4)[1]}" font-size="22">🌳</text>
      <text x="${g(11, 1)[0]}" y="${g(11, 1)[1]}" font-size="22">🌳</text>
      <text x="${g(10, 10)[0]}" y="${g(10, 10)[1]}" font-size="18">🌷</text>
      <text x="${g(-1, 10)[0]}" y="${g(-1, 10)[1]}" font-size="18">🐑</text>
    </g>
    <text x="${g(0, 0)[0] - 52}" y="${g(0, 0)[1] + 40}" font-size="9" fill="#2f5d1f" font-weight="800">✝ Cornerstone: Jesus</text>`;
}

// ---------- state helpers ----------
const key = ([x, y, z]) => `${x},${y},${z}`;
function solidSet() {
  const s = new Set();
  for (const [i, b] of blocks) if (!b.burnt) s.add(key(SLOTS[i].p));
  return s;
}
function firstGap() { let best = -1; for (const [i, b] of blocks) if (b.burnt && (best < 0 || i < best)) best = i; return best; }
function firstEmpty() { for (let i = 0; i < SLOTS.length; i++) if (!blocks.has(i)) return i; return -1; }

// A stage seals once every slot holds a fire-proof block: from then on it can never fall.
function updateSealed() {
  while (sealed + 1 < STAGES.length) {
    const s = STAGES[sealed + 1];
    for (let i = s.start; i < s.end; i++) {
      const b = blocks.get(i);
      if (!b || b.burnt || MAT[b.mat].burns) return;
    }
    sealed++;
  }
}

// Precious materials fill burnt gaps first (lowest first); wood and hay only ever go on top.
function place(mat) {
  let i = -1, seam = false;
  if (!MAT[mat].burns) { i = firstGap(); seam = i >= 0; }
  if (i < 0 && gentle && stability().tier === 3 && MAT[mat].burns) return -1;
  if (i < 0) i = firstEmpty();
  if (i < 0) return -1;
  blocks.set(i, { mat, day, burnt: false, seam });
  return i;
}

function stability() {
  let filled = 0, gaps = 0;
  for (const [i, b] of blocks) {
    if (SLOTS[i].stage <= sealed) continue;
    filled++;
    if (b.burnt) gaps++;
  }
  const ratio = filled ? gaps / filled : 0;
  if (ratio < 0.1) return { tier: 0, ratio, label: '💪 Strong and steady', sub: gaps ? 'A few empty settings to fill.' : 'Nothing burnt. Keep building!' };
  if (ratio < 0.25) return { tier: 1, ratio, label: '⚡ A few cracks', sub: 'Fill the gaps with precious stones.' };
  if (ratio < 0.4) return { tier: 2, ratio, label: '🏗️ Leaning: builders are coming', sub: 'Scaffolding is holding it up.' };
  return { tier: 3, ratio, label: '⚠️ Unsteady', sub: gentle ? 'Fill the gaps before it can grow higher.' : 'The next fire could topple the top.' };
}

// ---------- render ----------
const scene = document.getElementById('scene');
function render(newIdx = []) {
  const solid = solidSet();
  const items = [];
  for (const [i, b] of blocks) {
    const p = SLOTS[i].p;
    const [x, y, z] = p;
    // Skip blocks completely hidden behind their neighbours.
    if (!b.burnt && solid.has(key([x + 1, y, z])) && solid.has(key([x, y + 1, z])) && solid.has(key([x, y, z + 1]))) continue;
    items.push({ i, b, p, order: (x + y + z) * 100 + z });
  }
  items.sort((a, b) => a.order - b.order);
  const st = stability();
  const lean = st.tier >= 2 ? (st.tier === 3 ? 3.5 : 2) : 0;
  const body = items.map(({ i, b, p }) => {
    const [sx, sy] = scr(p);
    if (b.burnt) return `<use href="#socket" x="${sx}" y="${sy}" class="blk" data-i="${i}"/>`;
    const cls = `blk ${newIdx.includes(i) ? 'drop' : ''}`;
    return `<use href="#m-${b.mat}" x="${sx}" y="${sy}" class="${cls}" data-i="${i}"/>${b.seam ? `<use href="#seam" x="${sx}" y="${sy}" pointer-events="none"/>` : ''}`;
  }).join('');
  scene.innerHTML = defs() + scenery() + `
    <g id="bld" class="${st.tier >= 1 ? 'wobble' : ''}" style="--lean:${lean}deg; transform-origin: 0px 90px">${body}${cracks(st)}${scaffold(st)}</g>
    <g id="fx"></g>`;
  renderPanel(st);
}

function topZ() { let m = 0; for (const [i, b] of blocks) if (!b.burnt) m = Math.max(m, SLOTS[i].p[2]); return m; }

function cracks(st) {
  if (st.tier < 1) return '';
  const z = Math.max(1, topZ() - 1);
  const [ax, ay] = scr([0, 3, z]);
  const [bx, by] = scr([6, 0, z]);
  return `<g stroke="#3b2a10" stroke-width="1.2" fill="none" opacity=".55" pointer-events="none">
    <path d="M${ax} ${ay + 10} l6 8 l-4 6 l7 9"/><path d="M${bx} ${by + 8} l-5 7 l5 5 l-3 10"/></g>`;
}

function scaffold(st) {
  if (st.tier < 2) return '';
  const z = topZ() + 1;
  const poles = [[-1, 8], [10, 0], [10, 8]].map(([x, y]) => {
    const [px, py] = scr([x, y, 0]);
    const [, ty] = scr([x, y, z]);
    return `<line x1="${px}" y1="${py + 14}" x2="${px}" y2="${ty}"/>`;
  }).join('');
  return `<g stroke="#8b5a2b" stroke-width="2.2" pointer-events="none">${poles}</g>`;
}

function renderPanel(st) {
  document.getElementById('stages').innerHTML = STAGES.map((s, si) => {
    let n = 0;
    for (let i = s.start; i < s.end; i++) { const b = blocks.get(i); if (b && !b.burnt) n++; }
    const total = s.end - s.start;
    const locked = n === 0 && si > 0 && !blocks.has(STAGES[si - 1].end - 1);
    return `<div class="stage-row ${si <= sealed ? 'sealed' : ''} ${locked ? 'locked' : ''}">
      <span class="ic">${s.icon}</span><span>${s.name}</span><span>${si <= sealed ? '✓ Sealed' : `${n}/${total}`}</span>
      <div class="bar"><i style="width:${(n / total) * 100}%"></i></div></div>`;
  }).join('');
  document.getElementById('stab').innerHTML = `${st.label}<small>${st.sub}</small>`;
  document.getElementById('subtitle').textContent = `Day ${day} · Week ${Math.floor(day / 7) + 1} · built on Jesus, the cornerstone`;
}

function renderLegend() {
  const rows = [['gold', 'Gold = prayer'], ['silver', 'Silver = kind words'], ['gem-emerald', 'Gems = fruit of the Spirit'], ['pearl', 'Pearl = owned up'],
    ['wood', 'Wood = fighting'], ['hay', 'Hay = tantrum'], ['stubble', 'Stubble = rude words']];
  document.getElementById('legend').innerHTML = rows.map(([m, t]) => `<span><i style="background:${MAT[m].chip}"></i>${t}</span>`).join('');
}

// ---------- simulated days ----------
const pick = (a) => a[Math.floor(Math.random() * a.length)];
function dayItems(kind) {
  const good = () => pick(['gold', 'gold', 'silver', ...GEM_IDS]);
  if (kind === 'great') return ['gold', 'gold', 'silver', pick(GEM_IDS), pick(GEM_IDS), pick(GEM_IDS)];
  if (kind === 'mixed') return [good(), good(), good(), good(), pick(BURNS), pick(BURNS)];
  if (kind === 'hard') return [good(), pick(BURNS), pick(BURNS), pick(BURNS), pick(BURNS)];
  if (kind === 'sorry') return ['pearl', 'pearl'];
  return [];
}

function addDay(kind, animate = true) {
  day++;
  const placed = [];
  for (const m of dayItems(kind)) { const i = place(m); if (i >= 0) placed.push(i); }
  updateSealed();
  if (animate) render(placed);
  return placed;
}

// Fire: burnable blocks burn to empty settings; then check stability, and maybe topple the unsealed top.
function fireCommit() {
  let burnt = 0;
  for (const b of blocks.values()) if (!b.burnt && MAT[b.mat].burns) { b.burnt = true; burnt++; }
  const st = stability();
  let fell = null;
  if (st.tier === 3 && !gentle) fell = topple();
  updateSealed();
  return { burnt, st, fell };
}

// The weakest row of the unsealed part and everything above it falls. Gold and gems are salvaged and re-laid.
function topple() {
  const gapsByZ = {};
  for (const [i, b] of blocks) if (b.burnt && SLOTS[i].stage > sealed) gapsByZ[SLOTS[i].p[2]] = (gapsByZ[SLOTS[i].p[2]] || 0) + 1;
  const weakZ = Number(Object.entries(gapsByZ).sort((a, b) => b[1] - a[1])[0]?.[0] ?? 0);
  const fallen = [], salvage = [];
  for (const [i, b] of blocks) {
    if (SLOTS[i].stage > sealed && SLOTS[i].p[2] >= weakZ) {
      fallen.push(i);
      if (!b.burnt && !MAT[b.mat].burns) salvage.push(b.mat);
    }
  }
  return { fallen, salvage, weakZ };
}

function settleTopple(fell) {
  for (const i of fell.fallen) blocks.delete(i);
  for (const m of fell.salvage) place(m);
}

// ---------- fire animation ----------
const area = document.getElementById('area');
const capEl = document.getElementById('caption');
function caption(html, ms) {
  capEl.innerHTML = html;
  capEl.classList.add('show');
  clearTimeout(caption.t);
  if (ms) caption.t = setTimeout(() => capEl.classList.remove('show'), ms);
}
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

async function fireTest() {
  if (busy || !blocks.size) return;
  busy = true;
  setButtons(false);
  area.classList.add('dusk');
  caption('🔥 The fire will test the quality of each one’s work.<em>1 Corinthians 3:13</em>');
  await wait(1400);
  const fx = document.getElementById('fx');
  fx.innerHTML = `<g class="flames">
      <path d="M-120 140 C-110 60 -80 80 -70 20 C-60 70 -40 50 -30 -20 C-20 40 0 30 10 -40 C20 30 40 40 50 10 C60 60 80 50 90 140 Z" fill="url(#flame)" opacity=".85"/>
      <path d="M-100 150 C-90 90 -70 100 -55 50 C-45 90 -25 80 -15 20 C-5 70 15 60 25 30 C40 80 60 90 70 150 Z" fill="#ff7a1a" opacity=".7"/>
      <path d="M-80 150 C-70 110 -55 115 -45 80 C-35 110 -15 100 -5 70 C5 100 25 105 35 150 Z" fill="#ffd166" opacity=".8"/>
    </g>`;
  // Each burnable block chars as the flame front passes it.
  const els = [...scene.querySelectorAll('use.blk')].filter((u) => { const b = blocks.get(Number(u.dataset.i)); return b && !b.burnt && MAT[b.mat].burns; });
  for (const u of els) {
    const x = Number(u.getAttribute('x'));
    setTimeout(() => { u.classList.add('char'); ember(x, Number(u.getAttribute('y'))); }, 3200 * ((x + 460) / 840)); // when the flame front (sweeping -420 → 420) reaches it
  }
  await wait(3300);
  document.getElementById('bld').classList.add('refine');
  caption('✨ Gold, silver and precious stones: refined!', 0);
  await wait(1500);
  const res = fireCommit();
  area.classList.remove('dusk');
  if (res.fell) {
    render();
    caption('⚠️ Too many gaps: the top section is falling…');
    await wait(900);
    for (const i of res.fell.fallen) {
      const u = scene.querySelector(`use.blk[data-i="${i}"]`);
      if (u) { u.style.setProperty('--tx', `${(Math.random() * 60 - 30).toFixed(0)}px`); u.style.setProperty('--rot', `${(Math.random() * 80 - 40).toFixed(0)}deg`); u.classList.add('tumble'); }
    }
    await wait(1300);
    settleTopple(res.fell);
    render();
    caption(`🏗️ ${res.fell.salvage.length ? `The builders saved ${res.fell.salvage.length} gold and gem blocks and laid them again.` : 'The burnt section was cleared away, ready to rebuild.'}<em>“He himself will be saved, but only as through fire.” 1 Cor 3:15. Jesus, the foundation, never falls.</em>`, 7000);
  } else {
    render();
    caption(res.burnt
      ? `🕊️ ${res.burnt} block${res.burnt === 1 ? '' : 's'} of wood, hay and stubble burnt away. What you built with God remains.<em>Fill the glowing gaps with precious stones.</em>`
      : '🕊️ Nothing burnt! Everything you built with God remains.', 6000);
  }
  log(res.burnt ? `Fire test: ${res.burnt} burnt.` : 'Fire test: nothing burnt.');
  busy = false;
  setButtons(true);
}

function ember(x, y) {
  const fx = document.getElementById('fx');
  const e = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  e.setAttribute('cx', x + Math.random() * 10 - 5);
  e.setAttribute('cy', y + 4);
  e.setAttribute('r', 1.6);
  e.setAttribute('fill', '#ffb347');
  e.setAttribute('class', 'ember');
  fx.appendChild(e);
  setTimeout(() => e.remove(), 1700);
}

// Sparkles on random gold and gem blocks.
setInterval(() => {
  if (document.hidden) return;
  const shiny = [...scene.querySelectorAll('use.blk')].filter((u) => { const b = blocks.get(Number(u.dataset.i)); return b && !b.burnt && (MAT[b.mat].gem || b.mat === 'gold' || b.mat === 'pearl'); });
  const fx = document.getElementById('fx');
  if (!shiny.length || !fx) return;
  for (let k = 0; k < 2; k++) {
    const u = pick(shiny);
    const s = document.createElementNS('http://www.w3.org/2000/svg', 'use');
    s.setAttribute('href', '#star');
    s.setAttribute('x', Number(u.getAttribute('x')) + (Math.random() * 10 - 5));
    s.setAttribute('y', Number(u.getAttribute('y')) + 6);
    s.setAttribute('class', 'spark');
    fx.appendChild(s);
    setTimeout(() => s.remove(), 1200);
  }
}, 700);

// ---------- UI ----------
function log(t) { document.getElementById('log').textContent = t; }
function setButtons(on) { document.querySelectorAll('button[data-act]').forEach((b) => { b.disabled = !on; }); }

function fastForward(days) {
  const kinds = ['great', 'great', 'mixed', 'mixed', 'mixed', 'hard', 'great', 'mixed', 'great', 'sorry'];
  let burnt = 0, falls = 0;
  for (let d = 0; d < days; d++) {
    addDay(pick(kinds), false);
    if (day % 7 === 0) {
      const r = fireCommit();
      burnt += r.burnt;
      if (r.fell) { settleTopple(r.fell); falls++; }
    }
  }
  updateSealed();
  render();
  log(`${days} days built. Fires burnt ${burnt} blocks${falls ? `, and the top fell ${falls} time${falls === 1 ? '' : 's'} (gold and gems were saved)` : ''}.`);
}

document.querySelector('.panel').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-act]');
  if (!b || busy) return;
  const a = b.dataset.act;
  if (a === 'fire') return fireTest();
  if (a === 'mode') { gentle = !gentle; b.textContent = `Fire style: ${gentle ? 'Gentle' : 'Topple'}`; render(); return log(gentle ? 'Gentle style: nothing ever falls. Too many gaps stop the building growing until they are filled.' : 'Topple style: with too many gaps, the unsealed top falls (gold and gems are saved).'); }
  if (a === 'reset') { reset(); render(); return log('Fresh start. Jesus is the cornerstone.'); }
  if (a === 'week') return fastForward(7);
  if (a === 'month') return fastForward(28);
  const placed = addDay(a);
  const names = placed.map((i) => MAT[blocks.get(i).mat].name);
  log(`Day ${day}: ${names.join(', ') || 'the building is complete!'}`);
});

const tip = document.getElementById('tip');
scene.addEventListener('click', (e) => {
  const u = e.target.closest('use.blk');
  if (!u) return;
  const b = blocks.get(Number(u.dataset.i));
  if (!b) return;
  const m = MAT[b.mat];
  tip.textContent = b.burnt ? `🔥 Burnt away (was ${m.name}). Fill me with a precious stone!` : `${m.name} · ${m.src} · day ${b.day}${b.seam ? ' · ✨ gold seam: a gap filled again' : ''}`;
  tip.style.left = `${Math.min(e.clientX + 12, innerWidth - 360)}px`;
  tip.style.top = `${e.clientY - 44}px`;
  tip.classList.add('show');
  clearTimeout(tip.t);
  tip.t = setTimeout(() => tip.classList.remove('show'), 2600);
  u.classList.remove('click'); void u.getBoundingClientRect(); u.classList.add('click');
});

reset();
renderLegend();
render();
</script>
</body>
</html>
