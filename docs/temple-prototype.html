<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Temple Builder</title>
<!-- Design prototype for the 1 Corinthians 3 "Temple Builder": a brick tower on a sea cliff.
     Rules: every brick rests on two bricks below (two hands). Gold gives light and strength; hay rots and spreads flies.
     Not wired into the app yet; the buttons on the right simulate days of logging. Add ?sim=60 to preview 60 days. -->
<style>
  :root { --ink: #1f2430; --muted: #5b6170; --bg: #fff8ee; --shadow: 0 6px 0 rgba(0,0,0,.08), 0 12px 30px rgba(60,40,10,.08); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  .app { display: grid; grid-template-columns: 1fr 350px; height: 100vh; }
  .stage-area { position: relative; overflow: hidden;
    background: linear-gradient(#5b8fd6 0%, #f3b07a 62%, #ffd9a0 78%, #ffe9c4 100%); transition: background 1.2s; }
  .stage-area.dusk { background: linear-gradient(#140f2b 0%, #4a1f45 50%, #c4482a 80%, #ff8a3d 100%); }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; }
  .firewall { position: absolute; left: 0; right: 0; bottom: 0; height: 0; pointer-events: none; z-index: 1;
    background: linear-gradient(to top, rgba(255,90,20,.55), rgba(255,170,40,.25) 60%, transparent); mix-blend-mode: screen; }
  .firewall.go { animation: rise 3.6s ease-in forwards; }
  @keyframes rise { 0% { height: 0; } 85% { height: 100%; opacity: 1; } 100% { height: 100%; opacity: 0; } }
  .title { position: absolute; top: 16px; left: 22px; margin: 0; font-size: 38px; font-weight: 900; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.35); z-index: 2; }
  .title small { display: block; font-size: 17px; font-weight: 700; opacity: .9; }
  .caption { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 3;
    background: rgba(20,14,8,.84); color: #fff; padding: 14px 26px; border-radius: 22px;
    font-size: 23px; font-weight: 800; max-width: 88%; text-align: center; opacity: 0; transition: opacity .4s; }
  .caption.show { opacity: 1; }
  .caption.danger { background: rgba(160,20,10,.92); }
  .caption em { display: block; font-size: 16px; font-weight: 600; opacity: .85; font-style: normal; }
  .warn { position: absolute; top: 100px; left: 22px; max-width: 260px; z-index: 3;
    background: #c81e1e; color: #fff; font-weight: 900; font-size: 19px; line-height: 1.25; padding: 12px 16px; border-radius: 16px;
    box-shadow: 0 6px 0 #7f1010; display: none; }
  .warn.show { display: block; animation: pulse 1.2s ease-in-out infinite; transform-origin: left center; }
  @keyframes pulse { 50% { transform: scale(1.04); } }
  .shimmer { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: soft-light; z-index: 1;
    background: linear-gradient(105deg, transparent 42%, rgba(255,255,255,.9) 50%, transparent 58%);
    background-size: 300% 100%; animation: shimmer 8s ease-in-out infinite; }
  @keyframes shimmer { 0%, 70% { background-position: 150% 0; } 100% { background-position: -50% 0; } }

  .brick { cursor: pointer; transform-box: fill-box; transform-origin: center bottom; }
  .brick.drop { animation: drop .45s cubic-bezier(.3,1.5,.5,1); }
  .brick.cracked { animation: wob 1.6s ease-in-out infinite; }
  .brick.char { animation: char .8s ease-in forwards; }
  .brick.fall { animation: fall 1.3s cubic-bezier(.5,0,.9,.6) forwards; }
  .brick.click { animation: click .5s ease-out; }
  @keyframes drop { from { transform: translateY(-60px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes wob { 0%, 100% { transform: rotate(-1.6deg); } 50% { transform: rotate(1.6deg); } }
  @keyframes char { 0% { filter: none; } 30% { filter: brightness(1.9) sepia(1) saturate(5) hue-rotate(-25deg); } 65% { filter: brightness(.2); opacity: 1; transform: none; } 100% { filter: brightness(.05); opacity: 0; transform: translateY(-16px) scale(.5); } }
  @keyframes fall { 0% { transform: none; } 15% { transform: translate(calc(var(--tx) * .1), -5px) rotate(calc(var(--rot) * .1)); } 100% { transform: translate(var(--tx), 700px) rotate(var(--rot)); opacity: .3; } }
  @keyframes click { 0% { transform: scale(1.25); filter: brightness(1.6); } 100% { transform: none; filter: none; } }
  .doom { animation: doom 1s ease-in-out infinite; }
  @keyframes doom { 50% { opacity: .35; } }
  .refine { animation: refine 1.4s ease-out; }
  @keyframes refine { 40% { filter: brightness(1.8) saturate(1.4); } }
  .wing { animation: flap .06s linear infinite alternate; transform-box: fill-box; transform-origin: center bottom; }
  @keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(.3); } }
  .flame { animation: flick .18s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center bottom; }
  @keyframes flick { from { transform: scale(.9, .85) skewX(-6deg); } to { transform: scale(1.05, 1.15) skewX(6deg); } }
  .spark-up { animation: sparkup 1.6s ease-out forwards; }
  @keyframes sparkup { to { transform: translateY(-120px); opacity: 0; } }
  .twinkle { animation: twinkle 1.1s ease-out forwards; transform-box: fill-box; transform-origin: center; }
  @keyframes twinkle { 0% { transform: scale(0); opacity: 0; } 40% { transform: scale(1.3); opacity: 1; } 100% { transform: scale(0) rotate(90deg); opacity: 0; } }
  .lightpulse { animation: lp 3s ease-in-out infinite; }
  @keyframes lp { 50% { opacity: .55; } }
  .wave { animation: wave 4s ease-in-out infinite alternate; }
  @keyframes wave { to { transform: translateX(-40px); } }
  .ghost { animation: ghost 2.4s ease-in-out infinite; }
  @keyframes ghost { 50% { opacity: .3; } }
  .dove { animation: dove 3s ease-in-out infinite; }
  @keyframes dove { 50% { transform: translateY(-3px); } }
  .splash { animation: splash 1.2s ease-out forwards; }
  @keyframes splash { to { transform: translate(var(--sx), var(--sy)); opacity: 0; } }

  /* ----- panel ----- */
  .panel { background: #fffdf8; border-left: 1px solid #eadfce; padding: 14px 14px 22px; overflow-y: auto; display: flex; flex-direction: column; gap: 11px; }
  .panel h2 { margin: 0 0 6px; font-size: 18px; }
  .box { background: #fff; border-radius: 18px; box-shadow: var(--shadow); padding: 12px 14px; }
  .big { font-size: 24px; font-weight: 900; }
  .big small { display: block; font-size: 14px; font-weight: 700; color: var(--muted); }
  .rowline { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 800; margin: 4px 0; }
  .rowline b { min-width: 30px; text-align: right; font-size: 20px; }
  .rowline.red { color: #b91c1c; }
  .rowline.orange { color: #c2410c; }
  .rowline.green { color: #15803d; }
  .rowline.gold { color: #a16207; }
  .note { font-size: 13px; color: var(--muted); font-weight: 600; margin: 6px 0 0; }
  .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 8px; font-size: 13px; font-weight: 700; }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .legend svg { width: 26px; height: 19px; flex: none; overflow: visible; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  button { font: inherit; border: 0; border-radius: 16px; min-height: 56px; padding: 0 8px; font-size: 16px; font-weight: 800;
    background: #fff; box-shadow: var(--shadow); color: var(--ink); cursor: pointer; }
  button:active { transform: translateY(3px); }
  button.fire { grid-column: 1 / 3; background: linear-gradient(135deg, #ff9a3c, #e8501b); color: #fff; font-size: 20px; }
  button.right { background: #fdf2f8; color: #9d174d; }
  button.wide { grid-column: 1 / 3; }
  button:disabled { opacity: .4; }
  .log { font-size: 13px; color: var(--muted); font-weight: 600; min-height: 36px; margin: 8px 0 0; }
  #tip { position: fixed; z-index: 10; pointer-events: none; background: #1f2430; color: #fff; padding: 8px 14px;
    border-radius: 12px; font-size: 15px; font-weight: 800; opacity: 0; transition: opacity .2s; max-width: 420px; }
  #tip.show { opacity: 1; }
  @media (max-width: 900px) { .app { grid-template-columns: 1fr; grid-template-rows: 64vh auto; height: auto; } }
</style>
</head>
<body>
<div class="app">
  <div class="stage-area" id="area">
    <h1 class="title">My Tower<small id="subtitle">Day 0 · built on Jesus Christ</small></h1>
    <div class="warn" id="warn"></div>
    <svg id="scene" viewBox="-300 -420 600 760" preserveAspectRatio="xMidYMax meet" aria-label="Brick tower on a cliff"></svg>
    <div class="firewall" id="firewall"></div>
    <div class="shimmer"></div>
    <div class="caption" id="caption"></div>
  </div>
  <aside class="panel">
    <div class="box"><div class="big" id="height"></div></div>
    <div class="box">
      <h2>🔥 If the fire came now…</h2>
      <div id="forecast"></div>
      <p class="note">Red glowing bricks would fall. Wobbling bricks have lost one of their two “hands”.</p>
    </div>
    <div class="box">
      <h2>💡 Light vs 🪰 rot</h2>
      <div id="lightrot"></div>
    </div>
    <div class="box"><h2>What builds what</h2><div class="legend" id="legend"></div></div>
    <div class="box">
      <h2>Try it (simulate days)</h2>
      <div class="btns">
        <button data-act="great">🌟 Great day</button>
        <button data-act="mixed">🙂 Mixed day</button>
        <button data-act="hard">😣 Hard day</button>
        <button data-act="right" class="right">🫂 Make it right</button>
        <button class="fire" data-act="fire">🔥 Test by fire</button>
        <button data-act="week">⏩ 1 week</button>
        <button data-act="month">⏩ 1 month</button>
        <button class="wide" data-act="reset">↺ Start again</button>
      </div>
      <p class="log" id="log">Tap a day to start building. Tap any brick to see what built it and how safe it is.</p>
    </div>
  </aside>
</div>
<div id="tip"></div>
<svg width="0" height="0" style="position:absolute" id="defsHost"></svg>

<script>
// ---------- blueprint: brickwork tower ----------
// Rows alternate N and N-1 bricks, offset by half a brick, so each brick rests on the two below it
// (edge bricks of the wider rows rest on one). Every 6 rows the tower steps in by one brick each side.
const W = 30, H = 22, HALF = W / 2;
const TIER_N = [14, 12, 10, 8, 6, 4];
const ROWS_PER_TIER = 6;
const SLOTS = [];
const at = new Map();
let rowNo = 0;
TIER_N.forEach((N, k) => {
  for (let j = 0; j < ROWS_PER_TIER; j++, rowNo++) {
    const even = j % 2 === 0;
    const n = even ? N : N - 1;
    const start = even ? -N : -N + 1; // in half-brick units
    const cells = [];
    for (let c = 0; c < n; c++) cells.push(start + 2 * c);
    cells.sort((a, b) => Math.abs(a + 1) - Math.abs(b + 1) || a - b); // middle outward
    for (const s of cells) {
      const i = SLOTS.length;
      SLOTS.push({ row: rowNo, s, k, x: s * HALF, y: -(rowNo + 1) * H });
      at.set(`${rowNo},${s}`, i);
    }
  }
});
const ROWS = rowNo;
for (const sl of SLOTS) {
  sl.sup = sl.row === 0 ? [] : [at.get(`${sl.row - 1},${sl.s - 1}`), at.get(`${sl.row - 1},${sl.s + 1}`)].filter((x) => x !== undefined);
  sl.above = [at.get(`${sl.row + 1},${sl.s - 1}`), at.get(`${sl.row + 1},${sl.s + 1}`)].filter((x) => x !== undefined);
  sl.nb = [[0, -2], [0, 2], [-1, -1], [-1, 1], [1, -1], [1, 1]].map(([dr, ds]) => at.get(`${sl.row + dr},${sl.s + ds}`)).filter((x) => x !== undefined);
}
const rowSlots = Array.from({ length: ROWS }, () => []);
SLOTS.forEach((sl, i) => rowSlots[sl.row].push(i));
const tierSlots = TIER_N.map(() => []);
SLOTS.forEach((sl, i) => tierSlots[sl.k].push(i));

// ---------- materials ----------
const GEMS = {
  carnelian:  ['Carnelian', 'Love', '#ff8a8a', '#e0102f', '#6e0014'],
  topaz:      ['Topaz', 'Joy', '#ffe27a', '#ffa400', '#9a5200'],
  sapphire:   ['Sapphire', 'Peace', '#7ab8ff', '#1450f5', '#081f7a'],
  chalcedony: ['Chalcedony', 'Patience', '#cfc6ff', '#7563ff', '#3424a8'],
  emerald:    ['Emerald', 'Kindness', '#7dffb6', '#00b25e', '#00502b'],
  chrysolite: ['Chrysolite', 'Goodness', '#f1ff7a', '#b4dc00', '#5b7400'],
  jasper:     ['Jasper', 'Faithfulness', '#ffffff', '#c8ecff', '#5aa6cc'],
  beryl:      ['Beryl', 'Gentleness', '#8ff8ff', '#00c2dd', '#00687a'],
  amethyst:   ['Amethyst', 'Self-control', '#eaa8ff', '#a12cff', '#46087f'],
};
const MAT = {
  gold:    { name: 'Gold', src: 'Prayer', burns: false, metal: true },
  silver:  { name: 'Silver', src: 'Kind words / making peace', burns: false, metal: true },
  pearl:   { name: 'Pearl', src: 'Owned up', burns: false },
  stone:   { name: 'Redeemed stone', src: 'Hay that was made right', burns: false },
  wood:    { name: 'Rotten wood', src: 'Fighting', burns: true },
  hay:     { name: 'Mouldy hay', src: 'Tantrum / disobeying', burns: true },
  stubble: { name: 'Stubble', src: 'Rude words', burns: true },
};
for (const [id, [name, fruit]] of Object.entries(GEMS)) MAT['gem-' + id] = { name, src: fruit, burns: false, gem: id };
const GEM_IDS = Object.keys(MAT).filter((m) => MAT[m].gem);
const BURNS = ['wood', 'hay', 'stubble'];
const ROT = ['fresh', 'damp', 'mouldy', 'swarming with flies'];

// ---------- artwork ----------
const chamfer = (x0, y0, x1, y1, c) => `${x0 + c},${y0} ${x1 - c},${y0} ${x1},${y0 + c} ${x1},${y1 - c} ${x1 - c},${y1} ${x0 + c},${y1} ${x0},${y1 - c} ${x0},${y0 + c}`;
function defs() {
  let s = `<defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff4b0"/><stop offset=".35" stop-color="#f7cf3d"/><stop offset=".7" stop-color="#d79f12"/><stop offset="1" stop-color="#8f6206"/></linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#d6dee8"/><stop offset="1" stop-color="#7f8b9b"/></linearGradient>
    <radialGradient id="pearl" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#fbf3ff"/><stop offset=".75" stop-color="#eadff5"/><stop offset="1" stop-color="#cdbfb2"/></radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc8e6" stop-opacity="0"/><stop offset=".5" stop-color="#b8e4ff" stop-opacity=".55"/><stop offset="1" stop-color="#ffd6f0" stop-opacity="0"/></linearGradient>
    <linearGradient id="marble" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e2d8c6"/></linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9b48e"/><stop offset="1" stop-color="#8d7652"/></linearGradient>
    <linearGradient id="grey" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9e6df"/><stop offset="1" stop-color="#a9a49a"/></linearGradient>
    <linearGradient id="cliff" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a7a66"/><stop offset="1" stop-color="#4f4436"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fa9c9"/><stop offset="1" stop-color="#11506e"/></linearGradient>
    <linearGradient id="flameG" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff3d00"/><stop offset=".55" stop-color="#ffa21f"/><stop offset="1" stop-color="#fff3a0"/></linearGradient>
    <radialGradient id="lightG"><stop offset="0" stop-color="#fff2a8" stop-opacity=".75"/><stop offset=".5" stop-color="#ffd24d" stop-opacity=".3"/><stop offset="1" stop-color="#ffd24d" stop-opacity="0"/></radialGradient>
    <path id="star" d="M0 -7 L1.6 -1.6 L7 0 L1.6 1.6 L0 7 L-1.6 1.6 L-7 0 L-1.6 -1.6Z" fill="#fff"/>
    <path id="flame" d="M15 22 C3 22 2 12 9 6 C9 11 12 12 12 12 C11 6 14 1 18 -4 C18 4 25 7 25 14 C25 20 21 22 15 22Z" fill="url(#flameG)"/>`;
  for (const [id, [, , light, base, dark]] of Object.entries(GEMS)) {
    s += `<linearGradient id="gm-${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${base}"/><stop offset="1" stop-color="${dark}"/></linearGradient>
      <linearGradient id="gt-${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${light}"/><stop offset=".6" stop-color="${base}"/><stop offset="1" stop-color="${dark}"/></linearGradient>
      <g id="m-gem-${id}">
        <rect x="0" y="0" width="30" height="22" rx="2" fill="url(#stone)"/>
        <polygon points="${chamfer(1.5, 1, 28.5, 21, 5)}" fill="${dark}"/>
        <polygon points="${chamfer(3.5, 2.8, 26.5, 19.2, 4)}" fill="url(#gm-${id})"/>
        <polygon points="${chamfer(9, 6.5, 21, 15.5, 2)}" fill="url(#gt-${id})"/>
        <g stroke="#fff" stroke-width=".6" opacity=".45"><path d="M6.5 1L11 6.5M23.5 1L19 6.5M28.5 6L21 8.5M28.5 16L21 13.5M23.5 21L19 15.5M6.5 21L11 15.5M1.5 16L9 13.5M1.5 6L9 8.5"/></g>
        <polygon points="10.5,7.5 16,7.5 11.5,11.5" fill="#fff" opacity=".8"/>
        <circle cx="20" cy="14" r="1" fill="#fff" opacity=".85"/>
      </g>`;
  }
  s += `
    <g id="m-gold"><rect width="30" height="22" rx="2.5" fill="url(#gold)"/><rect x="2" y="2" width="26" height="18" rx="1.5" fill="none" stroke="#fff3b0" stroke-width=".8" opacity=".8"/><rect x="3" y="2.5" width="24" height="3.5" rx="1.5" fill="#fff" opacity=".5"/><path d="M6 15 L13 8" stroke="#fffbe6" stroke-width="1.2" opacity=".6"/></g>
    <g id="m-silver"><rect width="30" height="22" rx="2.5" fill="url(#silver)"/><rect x="2" y="2" width="26" height="18" rx="1.5" fill="none" stroke="#fff" stroke-width=".8" opacity=".9"/><rect x="3" y="2.5" width="24" height="3.5" rx="1.5" fill="#fff" opacity=".7"/></g>
    <g id="m-pearl"><rect width="30" height="22" rx="2" fill="url(#stone)"/><rect x="2" y="1.5" width="26" height="19" rx="9" fill="url(#pearl)"/><rect x="2" y="1.5" width="26" height="19" rx="9" fill="url(#sheen)"/><ellipse cx="10" cy="7" rx="5" ry="2.6" fill="#fff" opacity=".85"/></g>
    <g id="m-stone"><rect width="30" height="22" rx="2" fill="url(#grey)"/><path d="M4 7 l6 3 M20 15 l5 -2" stroke="#8a857a" stroke-width=".8"/><circle cx="15" cy="11" r="3.2" fill="url(#pearl)"/><path d="M15 6.5v9M11 10h8" stroke="#d9b24a" stroke-width="1.1"/></g>
    <g id="m-hay"><rect width="30" height="22" rx="3" fill="#b39a4c"/><g stroke-width="1" fill="none"><path d="M2 4 L12 7 M4 10 L18 8 M1 15 L14 17 M10 3 L26 6 M16 12 L29 10 M12 19 L28 16" stroke="#dcc671"/><path d="M3 7 L15 4 M8 13 L22 15 M18 4 L27 9 M2 19 L10 13" stroke="#7a6526"/></g><path d="M5 22 l-1 4 M11 22 l1 5 M20 22 l-1 3 M26 22 l1 4" stroke="#8a7432" stroke-width="1"/></g>
    <g id="m-wood"><rect width="30" height="22" rx="2" fill="#6a523d"/><rect width="30" height="7" fill="#7a6048"/><rect y="14.5" width="30" height="7.5" fill="#5a4532"/><path d="M0 7 H30 M0 14.5 H30" stroke="#2e2117" stroke-width="1.2"/><path d="M6 1 l3 4 l-2 3 l4 5" stroke="#2a1d13" stroke-width="1" fill="none"/><circle cx="20" cy="4" r="1.1" fill="#1d140d"/><circle cx="23" cy="11" r="1" fill="#1d140d"/><circle cx="9" cy="18" r="1.2" fill="#1d140d"/></g>
    <g id="m-stubble"><rect width="30" height="22" rx="3" fill="#7a6838"/><circle cx="6" cy="16" r="3.5" fill="#4d3f20"/><circle cx="20" cy="18" r="4" fill="#4a3c1e"/><g stroke="#a99560" stroke-width="1.1" stroke-linecap="round" fill="none"><path d="M4 4 L2 -4 M8 5 L9 -5 M12 4 L14 -3 M17 5 L16 -6 M22 4 L25 -3 M26 6 L28 -2"/></g></g>
    <g id="rot1"><circle cx="8" cy="8" r="3" fill="#5d6a26" opacity=".8"/><circle cx="22" cy="15" r="2.2" fill="#4a5420" opacity=".8"/><rect y="15" width="30" height="7" rx="3" fill="#3f3512" opacity=".3"/></g>
    <g id="rot2"><circle cx="8" cy="8" r="4" fill="#4f5b22" opacity=".9"/><circle cx="9" cy="9" r="1.8" fill="#8fa33a"/><circle cx="21" cy="14" r="3.6" fill="#3d4419" opacity=".9"/><circle cx="16" cy="5" r="2" fill="#5d6a26"/><rect y="12" width="30" height="10" rx="3" fill="#2f2a0e" opacity=".4"/><path d="M8 22 q1 4 0 6 M19 22 q1 3 0 5" stroke="#5a6a22" stroke-width="1.6" fill="none"/></g>
    <g id="rot3"><rect width="30" height="22" rx="3" fill="#2d3310" opacity=".55"/><circle cx="7" cy="7" r="4.5" fill="#6f8a24"/><circle cx="22" cy="13" r="4.5" fill="#56701a"/><circle cx="14" cy="17" r="3" fill="#8fa33a"/><circle cx="7" cy="7" r="1.5" fill="#c4d86a"/><path d="M6 22 q1 5 0 8 M15 22 q1 4 0 7 M24 22 q1 5 0 8" stroke="#6f8a24" stroke-width="2" fill="none"/></g>

  return s;
}
document.getElementById('defsHost').innerHTML = defs();

function foundation() {

function rubblePile() {
  if (!rubble.length) return '';
  const shown = rubble.slice(-14);
  return `<g transform="translate(250 30)">${shown.map((m, i) => `<use href="#m-${m}" transform="translate(${(i % 5) * 9 - 20} ${-Math.floor(i / 5) * 7 - 14}) rotate(${(i * 37) % 50 - 25}) scale(.42)"/>`).join('')}
    <text x="0" y="22" text-anchor="middle" font-size="12" font-weight="900" fill="#fff" stroke="#3b2a10" stroke-width="3" paint-order="stroke">🧺 ${rubble.length} to re-lay</text></g>`;

// ---------- state ----------
let blocks, day, rubble, busy = false;
function reset() { blocks = new Map(); day = 0; rubble = []; }
const mat = (i) => blocks.get(i)?.mat;
const burns = (i) => blocks.has(i) && MAT[mat(i)].burns;

// A level is sealed once it is complete and contains no hay, wood or stubble: it can never fall.
function tierSealed(k) { return tierSlots[k].every((i) => blocks.has(i) && !burns(i)); }

// The two-hands rule, worked out from the bottom up.
//   both hands present → solid (unless both of them are cracked)
//   one hand missing   → cracked, unless the remaining hand is gold (gold spans the gap)
//   no hands           → falls, and the bricks above re-check
// A complete row of gold and silver is a beam: it counts as new ground.
function supportStatus(present) {
  const st = new Array(SLOTS.length).fill(null);
  const sealed = TIER_N.map((_, k) => tierSealed(k));
  const beam = rowSlots.map((ids) => ids.every((i) => present(i) && MAT[mat(i)].metal));
  for (let i = 0; i < SLOTS.length; i++) {
    if (!present(i)) continue;
    const sl = SLOTS[i];
    if (sl.row === 0 || sealed[sl.k] || beam[sl.row]) { st[i] = 'solid'; continue; }
    const ok = sl.sup.filter((j) => present(j) && st[j] && st[j] !== 'falls');
    if (!ok.length) st[i] = 'falls';
    else if (ok.length < sl.sup.length) st[i] = ok.some((j) => mat(j) === 'gold') ? 'solid' : 'cracked';
    else st[i] = ok.every((j) => st[j] === 'cracked') ? 'cracked' : 'solid';
  }
  return st;
}
const nowStatus = () => supportStatus((i) => blocks.has(i));
const fireStatus = () => supportStatus((i) => blocks.has(i) && !burns(i)); // the tower after the next fire

// Gold gives light to itself and its neighbours. Flies can't live in the light.
function litSet() {
  const lit = new Set();
  for (const [i, b] of blocks) if (b.mat === 'gold') { lit.add(i); SLOTS[i].nb.forEach((j) => lit.add(j)); }
  return lit;
}

// New bricks go in the lowest empty spot that has at least one hand to rest on.
function firstOpen() {
  for (let i = 0; i < SLOTS.length; i++) {
    if (blocks.has(i)) continue;
    const sl = SLOTS[i];
    if (sl.row === 0 || sl.sup.some((j) => blocks.has(j))) return i;
  }
  return -1;
}
function place(m, seam = false) {
  const i = firstOpen();
  if (i < 0) return -1;
  blocks.set(i, { mat: m, day, seam });
  return i;
}
// Every new precious brick also lifts one gold or gem out of the rubble and lays it again.
function addMaterial(m) {
  const placed = [];
  const i = place(m);
  if (i >= 0) placed.push(i);
  if (!MAT[m].burns && rubble.length) { const j = place(rubble.pop(), true); if (j >= 0) placed.push(j); }
  return placed;
}

// Each night hay rots a little more, and its flies spread to nearby gems that aren't in the light.
function night() {
  const lit = litSet();
  for (const [i, b] of blocks) {
    if (MAT[b.mat].burns || b.mat === 'gold') continue;
    const near = SLOTS[i].nb.some((j) => burns(j) && day - blocks.get(j).day >= 1);
    b.dull = near && !lit.has(i);
  }
}

// ---------- render ----------
const scene = document.getElementById('scene');
function render(newIdx = []) {
  const now = nowStatus();
  const after = fireStatus();
  const lit = litSet();
  let lights = '', bricks = '', marks = '', flies = '', doves = '', flyN = 0, doveN = 0;
  for (const [i, b] of blocks) {
    const sl = SLOTS[i], { x, y } = sl;
    const m = MAT[b.mat];
    if (b.mat === 'gold') lights += `<ellipse class="lightpulse" cx="${x + 15}" cy="${y + 11}" rx="44" ry="34" fill="url(#lightG)" style="animation-delay:${(i % 7) * .3}s"/>`;
    const rot = m.burns ? Math.min(3, day - b.day) : 0;
    const cls = ['brick', newIdx.includes(i) ? 'drop' : '', now[i] === 'cracked' ? 'cracked' : ''].join(' ');
    bricks += `<g class="${cls}" data-i="${i}" style="animation-delay:${(i % 5) * -.3}s"><use href="#m-${b.mat}" x="${x}" y="${y}"/>
      ${rot ? `<use href="#rot${rot}" x="${x}" y="${y}"/>` : ''}${b.dull ? `<use href="#dull" x="${x}" y="${y}"/>` : ''}
      ${b.seam ? `<use href="#seam" x="${x}" y="${y}"/>` : ''}${now[i] === 'cracked' ? `<use href="#crack" x="${x}" y="${y}"/>` : ''}</g>`;
    if (!m.burns && after[i] === 'falls') marks += `<use href="#doomMark" x="${x}" y="${y}" class="doom"/>`;
    const nFlies = m.burns ? rot : b.dull ? 1 : 0;
    for (let f = 0; f < nFlies && flyN < 60; f++, flyN++) {
      const r = 9 + ((i + f) % 4) * 3, dur = (1.4 + ((i + f) % 5) * 0.35).toFixed(2);
      flies += `<g transform="translate(${x + 15} ${y + 8})"><g><animateTransform attributeName="transform" type="rotate" from="${f * 120}" to="${f * 120 + ((i + f) % 2 ? 360 : -360)}" dur="${dur}s" repeatCount="indefinite"/><g transform="translate(${r} 0)"><use href="#fly"/></g></g></g>`;
    }
    // Doves rest on gold with open sky above and no flies nearby.
    if (b.mat === 'gold' && doveN < 3 && sl.row > 1 && !sl.above.some((j) => blocks.has(j)) && !sl.nb.some(burns)) {
      doveN++;
      doves += `<text x="${x + 8}" y="${y - 1}" font-size="16" class="dove">🕊</text>`;
    }
  }
  // A sealed level gets a gold band along its top.
  let trims = '';
  TIER_N.forEach((N, k) => {
    if (!tierSealed(k)) return;
    const topR = (k + 1) * ROWS_PER_TIER - 1;
    trims += `<rect x="${-(N - 1) * HALF - 4}" y="${-(topR + 1) * H - 3}" width="${(N - 1) * W + 8}" height="4" rx="2" fill="url(#gold)"/>`;
  });
  // Ghost outline of the next few bricks to build.
  let ghost = '', shown = 0;
  for (let i = 0; i < SLOTS.length && shown < 5; i++) {
    if (blocks.has(i)) continue;
    const sl = SLOTS[i];
    if (sl.row === 0 || sl.sup.some((j) => blocks.has(j))) { ghost += `<rect x="${sl.x + 1}" y="${sl.y + 1}" width="28" height="20" rx="3" fill="rgba(255,255,255,.15)" stroke="#fff" stroke-dasharray="4 3" class="ghost"/>`; shown++; }
  }
  scene.innerHTML = scenery() + foundation() + rubblePile() +
    `<g id="tower"><g>${lights}</g>${ghost}<g id="bricks">${bricks}</g>${trims}<g pointer-events="none">${marks}</g><g id="flies" pointer-events="none">${flies}</g><g pointer-events="none">${doves}</g></g><g id="fx"></g>`;
  setCamera();
  renderPanel(now, after, lit);
}

// ---------- camera ----------
const cam = { x: -300, y: -420, w: 600, h: 760, tx: -300, ty: -420, tw: 600, th: 760 };
function topRow() { let m = -1; for (const i of blocks.keys()) m = Math.max(m, SLOTS[i].row); return m; }
function setCamera() {
  const r = document.getElementById('area').getBoundingClientRect();
  const aspect = r.width / Math.max(1, r.height);
  const topY = -(Math.max(topRow() + 6, 14)) * H - 120;
  const bottomY = 320;
  let h = bottomY - topY, w = h * aspect;
  if (w < 640) { w = 640; h = w / aspect; }
  Object.assign(cam, { tx: -w / 2, ty: bottomY - h, tw: w, th: h });
}
(function frame() {
  cam.x += (cam.tx - cam.x) * 0.07; cam.y += (cam.ty - cam.y) * 0.07; cam.w += (cam.tw - cam.w) * 0.07; cam.h += (cam.th - cam.h) * 0.07;
  scene.setAttribute('viewBox', `${cam.x.toFixed(1)} ${cam.y.toFixed(1)} ${cam.w.toFixed(1)} ${cam.h.toFixed(1)}`);
  requestAnimationFrame(frame);
})();

// ---------- panel ----------
function renderPanel(now, after, lit) {
  const tiersDone = TIER_N.filter((_, k) => tierSealed(k)).length;
  document.getElementById('height').innerHTML = `🗼 ${blocks.size} bricks · row ${topRow() + 1} of ${ROWS}<small>${tiersDone} of ${TIER_N.length} levels sealed in gold (safe forever)</small>`;
  let burnN = 0, fallN = 0, crackN = 0, dullN = 0, litN = 0, goldN = 0;
  for (const [i, b] of blocks) {
    if (MAT[b.mat].burns) burnN++;
    else if (after[i] === 'falls') fallN++;
    else if (after[i] === 'cracked') crackN++;
    if (b.dull) dullN++;
    if (lit.has(i)) litN++;
    if (b.mat === 'gold') goldN++;
  }
  document.getElementById('forecast').innerHTML = `
    <div class="rowline orange"><b>${burnN}</b> rotten bricks burn away</div>
    <div class="rowline ${fallN ? 'red' : 'green'}"><b>${fallN}</b> good bricks fall with them ${fallN ? '😱' : '👍'}</div>
    <div class="rowline"><b>${crackN}</b> bricks left cracked</div>`;
  document.getElementById('lightrot').innerHTML = `
    <div class="rowline gold"><b>${goldN}</b> gold bricks lighting ${litN} bricks</div>
    <div class="rowline ${dullN ? 'red' : 'green'}"><b>${dullN}</b> gems dulled by flies</div>
    <div class="rowline"><b>${rubble.length}</b> gold &amp; gems in the rubble 🧺</div>
    <p class="note">Flies spread from rotting hay each night but can’t enter the light. Each new good brick also lifts one treasure out of the rubble.</p>`;
  const warn = document.getElementById('warn');
  warn.classList.toggle('show', fallN > 0);
  warn.innerHTML = fallN ? `⚠️ ${fallN} good brick${fallN === 1 ? '' : 's'} will fall at the next fire!<br><small style="font-weight:700">Make it right, or fill the gaps with gold</small>` : '';
  document.getElementById('subtitle').textContent = `Day ${day} · Week ${Math.floor(day / 7) + 1} · built on Jesus Christ`;
}

function renderLegend() {
  const rows = [['m-gold', 'Gold = prayer (light!)'], ['m-silver', 'Silver = kind words'], ['m-gem-carnelian', 'Gems = fruit of the Spirit'], ['m-pearl', 'Pearl = owned up'],
    ['m-stone', 'Stone = made it right'], ['m-wood', 'Wood = fighting'], ['m-hay', 'Hay = tantrum'], ['m-stubble', 'Stubble = rude words']];
  document.getElementById('legend').innerHTML = rows.map(([m, t]) => `<span><svg viewBox="-2 -7 34 33"><use href="#${m}"/></svg>${t}</span>`).join('');
}

// ---------- simulated days ----------
const pick = (a) => a[Math.floor(Math.random() * a.length)];
function dayItems(kind) {
  const good = () => pick(['gold', 'gold', 'silver', ...GEM_IDS]);
  if (kind === 'great') return ['gold', 'gold', 'silver', pick(GEM_IDS), pick(GEM_IDS), pick(GEM_IDS)];
  if (kind === 'mixed') return [good(), good(), good(), good(), pick(BURNS), pick(BURNS)];
  if (kind === 'hard') return [good(), pick(BURNS), pick(BURNS), pick(BURNS), pick(BURNS)];
  return [];
}
function addDay(kind, animate = true) {
  day++;
  const placed = [];
  for (const m of dayItems(kind)) placed.push(...addMaterial(m));
  night();
  if (animate) render(placed);
  return placed;
}

// Owning up and making it right: the newest rotten brick becomes stone, and a pearl is added.
function makeItRight(animate = true) {
  let newest = -1;
  for (const [i, b] of blocks) if (MAT[b.mat].burns && (newest < 0 || b.day >= blocks.get(newest).day)) newest = i;
  if (newest < 0) { if (animate) log('Nothing to make right. Your tower has no hay!'); return; }
  const was = MAT[mat(newest)].name;
  blocks.get(newest).mat = 'stone';
  const placed = [newest, ...addMaterial('pearl')];
  night();
  if (animate) { render(placed); log(`🫂 Made it right: ${was.toLowerCase()} turned to stone, and a pearl was added.`); }
}

// ---------- fire ----------
const area = document.getElementById('area');
const capEl = document.getElementById('caption');
function caption(html, ms, danger = false) {
  capEl.innerHTML = html;
  capEl.classList.toggle('danger', danger);
  capEl.classList.add('show');
  clearTimeout(caption.t);
  if (ms) caption.t = setTimeout(() => capEl.classList.remove('show'), ms);
}
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

// Burn the rotten bricks, then work out which bricks have no hands left (lowest rows first, so the chain climbs).
function fireCommit() {
  let burnt = 0;
  for (const [i, b] of [...blocks]) if (MAT[b.mat].burns) { blocks.delete(i); burnt++; }
  const st = nowStatus();
  const fallen = [...blocks.keys()].filter((i) => st[i] === 'falls').sort((a, b) => SLOTS[a].row - SLOTS[b].row);
  for (const b of blocks.values()) b.dull = false;
  return { burnt, fallen };
}
// Fallen gold, gems and pearls land in the rubble; silver and stone are lost.
function settle(fallen) {
  for (const i of fallen) { const m = mat(i); if (m === 'gold' || m === 'pearl' || MAT[m].gem) rubble.push(m); blocks.delete(i); }
}

async function fireTest() {
  if (busy || !blocks.size) return;
  busy = true; setButtons(false);
  area.classList.add('dusk');
  caption('🔥 The fire will test the quality of each one’s work.<em>1 Corinthians 3:13</em>');
  await wait(1400);
  const fw = document.getElementById('firewall');
  fw.classList.remove('go'); void fw.offsetWidth; fw.classList.add('go');
  const topY = -(topRow() + 1) * H;
  for (const g of scene.querySelectorAll('#bricks .brick')) {
    const i = Number(g.dataset.i);
    if (!burns(i)) continue;
    const { x, y } = SLOTS[i];
    setTimeout(() => {
      const f = document.createElementNS('http://www.w3.org/2000/svg', 'use');
      f.setAttribute('href', '#flame'); f.setAttribute('x', x); f.setAttribute('y', y - 10); f.setAttribute('class', 'flame');
      g.appendChild(f);
      setTimeout(() => { g.classList.remove('cracked'); g.classList.add('char'); sparks(x + 15, y); }, 450);
    }, 200 + 3000 * (y / Math.min(-1, topY)));
  }
  setTimeout(() => { const f = document.getElementById('flies'); if (f) f.innerHTML = ''; }, 1600);
  await wait(3800);
  document.getElementById('bricks').classList.add('refine');
  caption('✨ Gold, silver and precious stones: refined!');
  await wait(1300);
  area.classList.remove('dusk');
  const res = fireCommit();
  const fallenIds = res.fallen.slice();
  const fallenMat = new Map(fallenIds.map((i) => [i, mat(i)]));
  render();
  if (fallenIds.length) {
    caption('😱 Some bricks have lost both their hands…', 0, true);
    await wait(1300);
    const rows = [...new Set(fallenIds.map((i) => SLOTS[i].row))].sort((a, b) => a - b);
    for (const r of rows) {
      for (const i of fallenIds.filter((j) => SLOTS[j].row === r)) {
        const g = scene.querySelector(`#bricks .brick[data-i="${i}"]`);
        if (!g) continue;
        g.classList.remove('cracked');
        g.style.setProperty('--tx', `${(SLOTS[i].x > 0 ? 1 : -1) * (40 + Math.random() * 120)}px`);
        g.style.setProperty('--rot', `${(Math.random() * 300 - 150).toFixed(0)}deg`);
        g.style.animationDelay = '0s';
        g.classList.add('fall');
      }
      await wait(280); // the chain climbs row by row
    }
    await wait(1300);
    splash();
    settle(fallenIds);
    render();
    const treasure = fallenIds.filter((i) => { const m = fallenMat.get(i); return m === 'gold' || m === 'pearl' || MAT[m].gem; }).length;
    caption(`💥 ${fallenIds.length} brick${fallenIds.length === 1 ? '' : 's'} fell when the hay under them burnt away.<em>${treasure} gold and gem bricks landed in the rubble 🧺. Each new good brick lifts one back up. Jesus, the foundation, still stands.</em>`, 9000, true);
    log(`Fire: ${res.burnt} rotten bricks burnt, and ${fallenIds.length} bricks fell in a chain.`);
  } else {
    caption(res.burnt ? `🕊️ ${res.burnt} rotten brick${res.burnt === 1 ? '' : 's'} burnt away, and nothing fell. What you built with God remains.` : '🕊️ Nothing burnt! Everything you built with God remains.', 6000);
    log(res.burnt ? `Fire: ${res.burnt} burnt, nothing fell.` : 'Fire: nothing burnt!');
  }
  busy = false; setButtons(true);
}

function particle(tag, attrs, cls, ms, style = {}) {
  const fx = document.getElementById('fx');
  if (!fx) return;
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  e.setAttribute('class', cls);
  Object.assign(e.style, style);
  fx.appendChild(e);
  setTimeout(() => e.remove(), ms);
}
function sparks(x, y) { for (let k = 0; k < 2; k++) particle('circle', { cx: x + Math.random() * 16 - 8, cy: y + 8, r: 1.8, fill: k ? '#ffd166' : '#ff7a1a' }, 'spark-up', 1700); }
function splash() {
  for (const side of [-1, 1]) for (let k = 0; k < 14; k++) {
    particle('circle', { cx: side * 330 + Math.random() * 100 - 50, cy: 250, r: 3 + Math.random() * 5, fill: pick(['#e6f7ff', '#bfe9f7', '#8fd3ea']) }, 'splash', 1300,
      { '--sx': `${(Math.random() * 120 - 60).toFixed(0)}px`, '--sy': `${(-50 - Math.random() * 120).toFixed(0)}px` });
  }
}

// Gold and gems sparkle (dulled ones don't).
setInterval(() => {
  if (document.hidden || busy) return;
  const shiny = [...scene.querySelectorAll('#bricks .brick')].filter((g) => { const b = blocks.get(Number(g.dataset.i)); return b && !b.dull && (MAT[b.mat].gem || b.mat === 'gold' || b.mat === 'pearl'); });
  for (let k = 0; k < 2 && shiny.length; k++) {
    const g = pick(shiny), { x, y } = SLOTS[Number(g.dataset.i)];
    particle('use', { href: '#star', x: x + 6 + Math.random() * 18, y: y + 4 + Math.random() * 10 }, 'twinkle', 1200);
  }
}, 600);

// ---------- UI ----------
function log(t) { document.getElementById('log').textContent = t; }
function setButtons(on) { document.querySelectorAll('button[data-act]').forEach((b) => { b.disabled = !on; }); }

function fastForward(days) {
  const kinds = ['great', 'great', 'mixed', 'mixed', 'great', 'hard', 'great', 'mixed', 'great', 'right'];
  let burnt = 0, fell = 0;
  for (let d = 0; d < days; d++) {
    const k = pick(kinds);
    if (k === 'right') { day++; makeItRight(false); } else addDay(k, false);
    if (day % 7 === 0) { const r = fireCommit(); burnt += r.burnt; fell += r.fallen.length; settle(r.fallen); }
  }
  render();
  log(`${days} days built. Weekly fires burnt ${burnt} rotten bricks${fell ? ` and ${fell} bricks fell with them` : ', and nothing fell'}.`);
}

document.querySelector('.panel').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-act]');
  if (!b || busy) return;
  const a = b.dataset.act;
  if (a === 'fire') return fireTest();
  if (a === 'reset') { reset(); render(); return log('Fresh start on the one foundation: Jesus Christ.'); }
  if (a === 'week') return fastForward(7);
  if (a === 'month') return fastForward(28);
  if (a === 'right') return makeItRight();
  const placed = addDay(a);
  log(`Day ${day}: ${placed.map((i) => MAT[mat(i)].name).join(', ') || 'the tower is complete!'}`);
});

const tip = document.getElementById('tip');
scene.addEventListener('click', (e) => {
  const g = e.target.closest('.brick');
  if (!g) return;
  const i = Number(g.dataset.i), b = blocks.get(i);
  if (!b) return;
  const m = MAT[b.mat], now = nowStatus()[i], after = fireStatus()[i];
  const safety = m.burns ? `🔥 will burn (${ROT[Math.min(3, day - b.day)]})` : after === 'falls' ? '😱 will FALL at the next fire' : now === 'cracked' ? '⚠️ cracked: one hand missing' : '💪 solid';
  tip.textContent = `${m.name} · ${m.src} · day ${b.day} · ${safety}${b.dull ? ' · dulled by flies' : ''}`;
  tip.style.left = `${Math.min(e.clientX + 12, innerWidth - 430)}px`;
  tip.style.top = `${e.clientY - 46}px`;
  tip.classList.add('show');
  clearTimeout(tip.t);
  tip.t = setTimeout(() => tip.classList.remove('show'), 3200);
  g.classList.remove('click'); void g.getBoundingClientRect(); g.classList.add('click');
});
addEventListener('resize', setCamera);

reset();
renderLegend();
const params = new URLSearchParams(location.search);
const simDays = Number(params.get('sim')) || 0;
// ?seq=gghggg plays specific days with no fire: g great, m mixed, h hard, r make it right (for demos).
const seq = params.get('seq') || '';
for (const c of seq) { if (c === 'r') { day++; makeItRight(false); } else addDay({ g: 'great', m: 'mixed', h: 'hard' }[c], false); }
if (simDays) fastForward(simDays); else render();
Object.assign(cam, { x: cam.tx, y: cam.ty, w: cam.tw, h: cam.th });
</script>
</body>
