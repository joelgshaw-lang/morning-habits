<meta name="claude:viewport-fit-sides" content="cover">
<title>Build on the Rock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Layout: the page fills the screen and does not scroll. Thin day bar, then the 3D stage (it never jumps), a caption strip under it,
   the tray of pieces, and one panel that scrolls inside itself with its main button pinned at the bottom.
   Wide screens put tray + panel beside the stage. Small phones fall back to an ordinary scrolling page. Single dusk look by choice. */
:root{
  color-scheme:dark;
  --night:#15122e; --plum:#2a2050; --panel:#221b44; --panel2:#2c2356; --line:#463a78;
  --ink:#f3eefc; --soft:#b9afd8; --gold:#f2b93f; --gold-ink:#2b1a02; --ember:#ff9a4a; --pearl:#f8eef4; --straw:#6f6a3c;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
html,body{background:var(--night);height:100%}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;margin:0;overflow:hidden;
  padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
*{box-sizing:border-box}
[hidden]{display:none!important}
.app{height:calc(100vh - 16px);height:calc(100dvh - 16px);max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;letter-spacing:.2px}
h1{font-size:19px} h2{font-size:18px} h3{font-size:15px;color:var(--soft);font-weight:500}
p{margin:0}
button{font-family:var(--display);font-weight:500;font-size:16px;color:var(--ink);background:var(--panel2);
  border:1px solid var(--line);border-bottom-width:3px;border-radius:12px;padding:7px 12px;min-height:44px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:hover{border-color:var(--soft)}
button:active{transform:translateY(1px);border-bottom-width:2px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:#a8771a}
button:disabled{opacity:.45;cursor:default}
.big{display:block;width:100%;font-size:19px;font-weight:600;min-height:52px;background:var(--gold);color:var(--gold-ink);border-color:#a8771a}
.quiet{background:transparent;border-bottom-width:1px;color:var(--soft)}
.link{background:none;border:0;color:var(--soft);text-decoration:underline;min-height:44px;padding:4px 8px;font-family:var(--body);font-weight:700}

/* day bar */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:5px 8px;flex:none}
.bar .seg{display:flex;gap:4px}
.bar .seg button{padding:5px 10px}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-weight:700;font-size:14px;min-height:32px}
.candle{width:8px;height:20px;border-radius:2px;background:linear-gradient(to top,#f1e8dc var(--left,50%),rgba(255,255,255,.12) var(--left,50%));position:relative}
.candle::before{content:"";position:absolute;left:50%;bottom:calc(var(--left,50%) - 1px);width:7px;height:9px;margin-left:-3.5px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--ember);box-shadow:0 0 8px 2px rgba(255,154,74,.7)}
.chip.fire{background:#5a2414;border-color:var(--ember)}
.bar .sp{flex:1}
/* live mode (inside the family app): a clear way out, top left */
#close{background:#f3eefc;color:#15122e;border-color:#b9afd8;font-size:18px;font-weight:600;padding:6px 16px;min-height:48px}
#plan{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px 12px;font-size:15px;display:flex;gap:9px;align-items:center}
.dot{width:14px;height:14px;border-radius:4px;flex:none;border:1px solid rgba(255,255,255,.3)}
.dot.W{background:repeating-linear-gradient(90deg,#dec468 0 3px,#9c7c2c 3px 5px)}
/* (26 Nov 2026, round 1) the hay chip, the goal ladder and the morning touch */
body.touch #stars,body.touch #lvChip,body.touch #cityChip{display:none}
.touchbar{flex:none;height:8px;min-height:8px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}.touchbar i{display:block;height:100%;background:var(--gold);transform-origin:left;animation:touchrun 90s linear forwards}
@keyframes touchrun{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.chip.hay{background:#4a3a10;border-color:#e8c65a;color:#ffe9a8;cursor:pointer}.chip.hay.hot{background:#5a2414;border-color:var(--ember)}
.ladder{display:grid;gap:3px;margin:0 0 4px;padding:6px 10px;border-radius:12px;background:rgba(242,185,63,.1);border:1px solid rgba(242,185,63,.45);font-size:14px}
.ladder b{color:var(--gold)}.ladder .today{font-size:16px;font-weight:700}
.hayline{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:12px;background:#4a3a10;border:1px solid #e8c65a;font-weight:700}

/* stage */
.main{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.left{flex:none;display:flex;flex-direction:column;gap:6px;min-width:0}
#stage{position:relative;width:100%;aspect-ratio:4/3;max-height:52vh;max-height:52dvh;border-radius:18px;overflow:hidden;border:1px solid var(--line);
  background:linear-gradient(#120f33 0%,#2c1f5c 38%,#6f3d74 68%,#d98458 90%,#f0b06a 100%)}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,rgba(0,0,0,0) 55%,rgba(8,5,24,.55) 100%)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
#tag{position:absolute;z-index:2;left:10px;top:62px;font-size:13px;color:var(--ink);background:rgba(18,14,40,.6);border-radius:999px;padding:3px 10px;pointer-events:none}
#goal{position:absolute;z-index:2;left:10px;top:38px;min-height:32px;font-size:13px;padding:3px 10px;border-radius:999px;background:rgba(242,185,63,.92);color:var(--gold-ink);border-color:#a8771a;font-family:var(--body);font-weight:700}
.starchip{cursor:pointer;color:var(--gold);font-family:var(--body)}
#views{position:absolute;z-index:2;right:8px;top:8px;display:flex;gap:4px}
#views button{min-width:50px;padding:4px 7px;font-size:14px;background:rgba(34,27,68,.82)}
#toast{position:absolute;z-index:3;left:50%;top:42%;transform:translate(-50%,-50%);background:rgba(18,14,40,.92);border:1px solid var(--ember);border-radius:14px;padding:10px 16px;font-weight:700;text-align:center;pointer-events:none}
#fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
#cap{position:absolute;z-index:3;left:8px;right:8px;bottom:8px;display:flex;align-items:center;gap:10px;min-height:44px;background:rgba(24,19,52,.82);border:1px solid var(--line);border-radius:14px;padding:5px 10px;pointer-events:none}
#cap button{pointer-events:auto}
#cap{right:auto;max-width:calc(100% - 16px)}
#cap:has(#say:empty):has(#undo[hidden]):has(#undoBlock[hidden]){display:none}   /* nothing to say: the whole picture is the child's */
#say{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#say{flex:1;font-weight:700;font-size:clamp(15px,2vw,17px);line-height:1.3;text-wrap:balance}
#say:empty::before{content:"Drag the picture to turn it.";color:var(--soft);font-weight:600}
.side{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column;gap:8px}
@media (min-width:1000px) and (orientation:landscape){
  .main{flex-direction:row}
  .left{flex:1.5;min-height:0}
  #stage{flex:1 1 0;min-height:220px;max-height:none;aspect-ratio:auto}
  .side{flex:1;min-width:330px}
}
/* full screen (the button on the picture): the side panel goes away while building, and comes back over the picture when it is needed */
body.full .side{position:fixed;z-index:20;right:14px;top:64px;bottom:14px;width:252px;min-width:0;pointer-events:none}
body.full .side>*{pointer-events:auto;box-shadow:0 8px 30px rgba(0,0,0,.45)}
body.full #panel{display:none}
body.full #tray{background:rgba(32,25,66,.9);max-height:100%}
body.full .tiles.stack{max-height:calc(100vh - 190px);max-height:calc(100dvh - 190px)}
body.full .tiles.stack .tile{width:94px}
body.full .tiles.stack{gap:6px}
body.full #views{right:auto;left:8px;top:36px;flex-wrap:wrap;max-width:calc(100% - 290px)}   /* the view buttons move left, clear of the pieces */
body.full.need .side{width:min(400px,calc(100vw - 28px))}
body.full.need #panel{display:flex}
body.full.need .tiles.stack{max-height:24vh;max-height:24dvh}
body.full .left{flex:1;min-height:0}
body.full #stage{flex:1 1 0;min-height:220px;max-height:none;aspect-ratio:auto}
#tray .row h2{font-size:17px}
#fullBtn{min-width:50px;padding:4px 7px;font-size:14px;background:rgba(34,27,68,.82)}
body.full #fullBtn{background:var(--gold);color:var(--gold-ink)}
/* small phones: an ordinary scrolling page */
@media (max-width:560px),(max-height:620px){
  body{overflow:auto;height:auto} html{height:auto}
  .app{height:auto} .main{display:flex;flex-direction:column} #stage{aspect-ratio:1/1;max-height:none} #panel{min-height:300px}
  #views{flex-wrap:wrap;justify-content:flex-end;max-width:60%} #views button{min-width:44px;padding:4px 5px;font-size:13px} .tile{width:112px} .grid.three{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){h1{display:none}}

/* tray and panel */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px 12px;display:flex;flex-direction:column;gap:6px}
#tray{flex:none}
body.notray #tray{display:none}
@media (orientation:landscape){body:not(.full) .side #tray{max-height:46%;overflow-y:auto}}   /* the pieces never squeeze the panel below to nothing */
#panel{flex:1;min-height:0;padding:0;gap:0;overflow:hidden}
#pbody{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
#pfoot{flex:none;padding:8px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
#pfoot:empty{display:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row .sp{flex:1}
.note{color:var(--soft);font-size:14px}
.tiles{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.tiles.stack{flex-wrap:wrap;overflow-x:hidden;overflow-y:auto;max-height:34vh;max-height:34dvh;scroll-snap-type:none;overscroll-behavior:contain}
.tiles.stack .tile{width:98px;min-height:50px;padding:6px;font-size:12.5px;gap:3px}
.tiles.stack .tile .sw{height:11px}
/* big turn buttons on both sides of the picture: one tap turns the house an eighth of the way round */
.spin{position:absolute;z-index:2;top:50%;margin-top:-28px;width:56px;height:56px;border-radius:50%;font-size:30px;line-height:1;padding:0;background:rgba(24,19,52,.55);border:1px solid var(--line);color:#fff}
#spinL{left:8px}#spinR{right:8px}
body.full #spinR{right:268px}
/* what just happened, big, over the picture */
#news{position:absolute;z-index:5;left:50%;top:22%;transform:translateX(-50%);max-width:min(92%,520px);text-align:center;background:rgba(24,19,52,.92);border:2px solid var(--gold);border-radius:18px;padding:14px 20px;display:flex;flex-direction:column;gap:6px;pointer-events:auto;animation:newsIn .35s ease-out}
#news[hidden]{display:none}
#news b{font-size:26px;line-height:1.15}#news span{font-size:16px;opacity:.92}
#news.bad{border-color:#ff5a3c;background:rgba(70,14,10,.93)}#news.good{border-color:#6be38a;background:rgba(10,52,30,.93)}
@keyframes newsIn{from{transform:translateX(-50%) scale(.8);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
#lvChip{cursor:pointer;background:rgba(232,183,48,.18);border:1px solid #e8b730;color:#ffe08a;font-weight:800}
.lvhead{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border:1px solid #e8b730;border-radius:14px;background:rgba(232,183,48,.1)}.lvhead b{font-size:18px}.lvhead span{font-size:14px;opacity:.9}
.lvbar{height:10px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}.lvbar i{display:block;height:100%;background:linear-gradient(90deg,#e8b730,#ffe08a)}
h4.rb{margin:14px 0 6px;font-size:15px}.lockgrid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
.lock{border:1px dashed var(--line);border-radius:14px;padding:12px;min-height:84px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:4px;background:rgba(255,255,255,.03);opacity:.75}
.lock b{font-size:26px}.lock.open{opacity:1;border-style:solid;border-color:#e8b730}.lock.open b{font-size:16px}.lock small{font-size:13px}
.card.shut{opacity:.6}
.lock.flip{animation:flipIn .9s ease-out}@keyframes flipIn{0%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
#aimDot{position:fixed;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--gold);box-shadow:0 0 0 3px rgba(0,0,0,.35);pointer-events:none;z-index:40}
html{overscroll-behavior:none}
.app,#toolsWrap,#modal{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
#pbody,.tiles{overscroll-behavior:contain}
.chip.starchip,#goal{min-height:44px}
.stepper{display:flex;gap:6px;flex-wrap:wrap}.stepper span{border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;background:#2f2a52;color:var(--soft)}.stepper span.on{background:var(--gold);color:var(--gold-ink)}.stepper span.done{background:#2e6b3a;color:#fff}
.way{font-weight:800;margin:8px 0 2px}ul.tally{list-style:none;padding:0;margin:8px 0;display:grid;gap:6px}ul.tally li{padding:8px 10px;border-radius:10px;font-weight:800;font-size:16px}ul.tally li.ok{background:rgba(63,174,95,.2);border:1px solid #3fae5f}ul.tally li.warn{background:rgba(242,169,63,.18);border:1px solid #f2a93f;font-weight:700}ul.tally li.bad{background:rgba(229,72,47,.2);border:1px solid #e5482f}.card.danger h4{margin:10px 0 2px;font-size:15px;color:#ffd0b8}.card.danger .way{margin:8px 0 2px;font-weight:800}.propbox button.prop{display:block;width:100%;margin-top:6px;background:#e8b730;color:#2b1a02;font-weight:800;min-height:48px;font-size:16px}
.card.danger{border:2px solid #ff6a3d;background:linear-gradient(#3a1622,#2a1430);gap:6px}
.card.danger.now{animation:dangerPulse 1.4s ease-in-out infinite}
@keyframes dangerPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,90,40,.0)}50%{box-shadow:0 0 18px 3px rgba(255,90,40,.55)}}
.card.danger h3{color:#ffb08a;font-size:18px}
.card.danger .walls{display:flex;flex-wrap:wrap;gap:6px}
.wchip{border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;background:#2f2a52}
.wchip.w2{background:#c2361f;color:#fff}.wchip.w1{background:#8a5a12;color:#fff}
.steps{margin:2px 0 2px 20px;padding:0;font-size:14.5px;line-height:1.35}
.card.rebuild{border:2px solid var(--gold)}
.craftpic{width:104px;height:104px;flex:none;border-radius:12px;background:radial-gradient(circle at 50% 40%,#3a2d6e,#1a1438);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:38px;overflow:hidden}
.craftpic img{width:100%;height:100%;display:block}
.tile{flex:none;width:128px;min-height:62px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;font-family:var(--body);font-weight:700;font-size:13px;line-height:1.15;padding:7px;scroll-snap-align:start}
.tile .sw{width:100%;height:14px;border-radius:5px;border:1px solid rgba(255,255,255,.3)}
.tile.off{opacity:.38;filter:grayscale(.85);cursor:default}
.tile[aria-pressed="true"]{outline:3px solid var(--gold);outline-offset:1px;background:var(--panel2);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.cat .pc{min-height:64px;justify-content:center}.cat .pc .t{font-size:19px}.cat .gem{border-color:#28bea0}.cat .burn{border-color:#c8702f}
.pile{display:block;width:100%;margin:8px 0;font-weight:700;font-size:16px;text-align:center}
.grid button{text-align:left;display:flex;gap:8px;align-items:center;line-height:1.2}
.grid button small{display:block;font-family:var(--body);font-weight:600;font-size:12.5px;opacity:.85}
.say{font-size:17px;font-weight:700;line-height:1.35}
.pray{background:var(--panel2);border-left:4px solid var(--pearl);border-radius:8px;padding:8px 12px;font-size:17px;font-weight:600}
.mortar{background:var(--panel2);border-left:4px solid #e8e2d0;border-radius:8px;padding:6px 12px;font-size:15px}
.step{display:flex;flex-direction:column;gap:6px}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
input[type=text],input[type=password]{font:inherit;font-size:18px;color:var(--ink);background:var(--night);border:1px solid var(--line);border-radius:10px;min-height:48px;padding:0 12px;width:100%}

/* grown-up tools: a separate sheet behind a PIN */
#toolsWrap{position:fixed;inset:0;z-index:15;background:var(--night);overflow-y:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 30px max(16px,env(safe-area-inset-left,0px))}
#toolsWrap .head{display:flex;align-items:center;gap:10px;max-width:1240px;margin:0 auto 12px}
.tools{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));max-width:1240px;margin:0 auto}
select{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:0 10px}
.wc{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;font-size:14px}
.wc .nums{display:flex;gap:4px}
.wc .nums button{min-width:44px;padding:4px}
.tag3{font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;margin-left:6px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
#out{white-space:pre-wrap;font-size:14px;color:var(--ink);background:var(--night);border-radius:10px;padding:8px 10px;min-height:2.6em}
label.tog{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
label.tog input{width:22px;height:22px;accent-color:var(--gold)}

/* in-page confirm */
#modal{position:fixed;inset:0;z-index:20;background:rgba(8,5,24,.72);display:flex;align-items:center;justify-content:center;padding:20px}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ===== v5: picture cards, this week's three, palette, gallery, review ===== */
.pc{display:flex;flex-direction:column;align-items:stretch;gap:4px;background:var(--panel2);border:1px solid var(--line);border-bottom-width:3px;border-radius:14px;padding:6px;text-align:center;font-family:var(--body);font-weight:700;font-size:14px;line-height:1.2;color:var(--ink);min-width:0}
.pc .art{background:#fff7ec;border-radius:10px;padding:3px;display:block}
.pc .art svg{display:block;width:100%;height:auto;max-height:118px}
.pc .t{font-family:var(--display);font-weight:600;font-size:16px}
.pc small{font-weight:600;color:var(--soft);font-size:12.5px;display:block}
.pc .ex{font-size:14px;color:var(--gold);font-weight:700}
.pc.focus{border-color:var(--gold);border-width:2px;border-bottom-width:4px;background:#3a2f68}
.pc .fbadge{font-size:11px;font-weight:800;color:var(--gold-ink);background:var(--gold);border-radius:999px;padding:1px 8px;align-self:center}
.pc.focus .t{font-size:18px}
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cards4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cards4 .lamp{font-size:44px;line-height:1.6;background:#2b2450;color:#ffd58a}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pic{display:flex;flex-direction:column;gap:5px;padding:6px;border-width:3px;border-radius:14px;background:var(--panel2);font-family:var(--body);font-weight:700;font-size:15px;line-height:1.2;text-align:center}
.pic .art{background:#fff7ec;border-radius:10px;padding:3px;display:block}
.pic .art svg{display:block;width:100%;height:auto;max-height:150px}
.pic.yes{border-color:#3fae5a}.pic.no{border-color:#c98a8a}
.pic.no .art svg{filter:saturate(.8)}

<script>
(function(){
'use strict';
/* ================= 1. small helpers ================= */
const R=window.RockRules,RC=window.RockContent||{};
const $=function(id){return document.getElementById(id)};
if(!R){$('fallback').hidden=false;$('fallback').textContent='The game rules (rules.js) did not load.';return}
function h(tag,attrs,kids){const e=document.createElement(tag);
  if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;
    if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else if(k==='style')e.style.cssText=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?'':v)}
  (kids||[]).forEach(function(c){if(c!=null)e.appendChild(typeof c==='string'?document.createTextNode(c):c)});return e}
function btn(label,fn,cls,extra){const a={type:'button',class:cls||null,onclick:fn};if(extra)for(const k in extra)a[k]=extra[k];return h('button',a,typeof label==='string'?[label]:label)}
function rnd(a,b){return a+Math.random()*(b-a)}
function rint(n){return Math.floor(Math.random()*n)}
function cap1(s){s=String(s||'');return s.charAt(0).toUpperCase()+s.slice(1)}
const WEEK=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const AGES=[6,8,12],WALLS=R.CONFIG.wallOrder;

function get(){for(let i=0;i<arguments.length;i++){let o=RC;const p=arguments[i].split('.');for(let j=0;j<p.length&&o!=null;j++)o=o[p[j]];if(o!=null)return o}return null}
function forAge(v,age){if(v&&typeof v==='object'&&!Array.isArray(v)){const k=String(age);if(v[k]!=null)return v[k]}return v}
function txt(v,age,vars){v=forAge(v,age);if(Array.isArray(v))v=v.length?v[rint(v.length)]:'';
  if(v&&typeof v==='object')v=v.say||v.line||v.text||v.label||v.tip||'';
  v=String(v==null?'':v);return fill(v,vars)}
function fill(t,vars){const base={name:'',sibling:'your brother or sister',friend:'them'};for(const k in (vars||{}))if(vars[k]!=null&&vars[k]!=='')base[k]=vars[k];
  t=String(t).replace(/\{name\},\s*(\w)/g,function(m,c){return base.name?base.name+', '+c:c.toUpperCase()});
  return t.replace(/\{(\w+)\}/g,function(m,k){return base[k]!=null?String(base[k]):m})}
function byId(list,id){for(let i=0;i<(list||[]).length;i++)if(list[i]&&list[i].id===id)return list[i];return null}
/* ONE LOOKUP TABLE: fruit name -> gem. content.js and rules.js use different letter codes, so nothing is ever matched by code.
   Nine colours chosen to stand apart from each other and from gold (amber) and straw (dull thatch). */
const GEMRGB={love:[215,35,55],joy:[245,125,30],peace:[40,100,230],patience:[20,180,165],kindness:[40,170,80],goodness:[205,228,60],faithfulness:[125,85,225],gentleness:[250,150,195],'self-control':[120,38,120]};
const NAME2CODE={};Object.keys(R.CONFIG.gems).forEach(function(k){NAME2CODE[R.CONFIG.gems[k]]=k});

  const out=list.map(function(f){const name=f.fruit||f.name||'';return{code:NAME2CODE[name.toLowerCase()],ccode:f.code||f.id,name:name,raw:f}}).filter(function(f){return f.code});
  if(!out.length)Object.keys(R.CONFIG.gems).forEach(function(k){out.push({code:k,ccode:k,name:cap1(R.CONFIG.gems[k]),raw:{}})});return out})();
const FRUIT={},CFRUIT={};FRUITS.forEach(function(f){FRUIT[f.code]=f;CFRUIT[f.ccode]=f});
function isGem(t){return !!R.CONFIG.gems[t]}

function strawLook(p){const m=p&&p.m&&p.m.material;return m==='wood'||m==='stubble'?m:'hay'}

/* ================= 5. the 3D picture (look copied from the approved rock-mockup.html) =================

   the scenery, the frame of the house, each wall's stones, the rubble pile and the whole City. A stone only becomes its own
   mesh ("loose") for the moment it moves: dropping in, being pulled, burning, tumbling. Taps are tested against invisible boxes. */
function make3D(){

const Y0=1.6;let shadowTicks=20,camSnap=true,cityView=false,maxCalls=0;
/* the shape of the blueprint being built (from the rules: walls of any width and height, the door anywhere along the front) */
const BLK=0.8;   /* blocks are drawn at 80% of the old 2-unit stone: twice the blocks make a wider, taller, grander house */

/* the top of each design, as boxes [w, h, d, material, y above the walls, x, z from the middle]. The first one is the trim. */
function roofParts(){const W=G.Wf,D=G.D,st=G.style,out=[[W+4.6,0.3,D+4,'trim',0.05,0,0]];let y=0.5;
  if(st==='castle'){out[0]=[W+1.6,0.5,D+1.6,'stone',0.2,0,0];const z0=D/2+0.3,x0=W/2+0.3,nx=Math.max(2,Math.round(2*x0/1.8)),nz=Math.max(1,Math.round(2*z0/1.8));   /* battlements */
    for(let i=0;i<=nx;i++){const xx=-x0+i*2*x0/nx;out.push([0.9,1,0.9,'stone',0.95,xx,z0],[0.9,1,0.9,'stone',0.95,xx,-z0])}
    for(let i=1;i<nz;i++){const zz=-z0+i*2*z0/nz;out.push([0.9,1,0.9,'stone',0.95,-x0,zz],[0.9,1,0.9,'stone',0.95,x0,zz])}
    out.push([0.15,2.4,0.15,'trim',1.6,0,0],[1.3,0.75,0.08,'roof',2.4,0.7,0]);return out}

function todayGoal(s){const sm=R.summary(s),full=WALLS.filter(function(w){const t=R.tally(s,w);return t.total>0&&t.filled===t.total});
  let best=null,left=1e9;WALLS.forEach(function(w){const t=R.tally(s,w),l=t.total-t.filled;if(l>0&&l<left){left=l;best=w}});
  if(best){const prize=!full.length?'an animal can move in':full.length===WALLS.length-1?'all walls up: another animal moves in':'one more wall done';
    return{n:left,text:left+(left===1?' more block finishes the ':' more blocks finish the ')+WALLNAME[best]+' \u2192 '+prize}}
  const fl=sm.free.total-sm.free.filled;if(fl>0)return{n:fl,text:fl+' more '+(fl===1?'block':'blocks')+' around the house \u2192 then it can be finished'};
  const hay=strawSpots(s).length;return{n:0,text:hay?'Every space is filled! Put right your '+hay+' hay \u2192 then the fire finishes it \u2605':'Every space is filled! No hay at the fire \u2192 it is finished and safe \u2605'}}
function goalLadder(b,todayOnly){const s=st();if(R.isEmptyBuilding(s)&&!trayTiles(s).length)return;const sm=R.summary(s),tg=todayGoal(s),hay=strawSpots(s).length,box=h('div',{class:'ladder'});
  box.appendChild(h('div',{class:'today'},[h('b',{text:'Today: '}),tg.text]));
  if(!todayOnly){const n=nightsToFire(),day=n===0?(s.today.fired?'':'tonight'):n===1?'tomorrow night':'on '+WEEK[(s.weekday+n)%7],left=sm.slots.total+sm.free.total-sm.slots.filled-sm.free.filled;
    box.appendChild(h('div',null,[h('b',{text:'This week: '}),left>0&&left<=trayTiles(s).length?'You have enough pieces to finish this building!':!day?'The fire is over. Build up for the next one.':hay?'Put right your '+hay+' hay before the fire '+day+'.':'Fire '+day+': no hay means nothing burns.']));
    box.appendChild(h('div',null,[h('b',{text:'This building: '}),designName(s.bp)+', '+(sm.slots.filled-hay+sm.free.filled)+' of '+(sm.slots.total+sm.free.total)+' good. Finished and safe = \u2605 stars and a place in your City.']));
    const ds=R.designs(s),nd=ds.filter(function(d){return !d.named&&!d.open}).sort(function(a,z){return a.sealsToOpen-z.sealsToOpen})[0],
      nb=ds.filter(function(d){return d.named&&!d.open&&d.daysToOpen!=null}).sort(function(a,z){return a.daysToOpen-z.daysToOpen})[0],bits=[];
    if(nd)bits.push((R.CONFIG.designs.names[nd.style]||nd.id)+' after '+nd.sealsToOpen+' more '+(nd.sealsToOpen===1?'building':'buildings'));
    if(nb){const bp=byId(get('blueprints')||[],nb.id);bits.push('\ud83d\udcdc '+(bp?bp.name:'A new blueprint')+' in '+nb.daysToOpen+(nb.daysToOpen===1?' day':' days'))}
    if(bits.length)box.appendChild(h('div',null,[h('b',{text:'Next: '}),bits.join(' \u00b7 ')]))}
  b.appendChild(box)}
/* the live panel: today's pieces, the page's own prayer and gospel buttons, and the fire when it is time */
function drawLive(b,f){const k=K(),s=k.s,sm=R.summary(s),tiles=trayTiles(s),nm=s.profile.name;
  title(b,nm?LW('title',{name:nm}):LW('titleNoName'));goalLadder(b,false);
  if(s.rubble.length>16){rebuildCard(b);dangerCard(b)}else{dangerCard(b);rebuildCard(b)}   /* (26 Nov 2026, round 1) a big pile: Build it back comes first */
  if(sm.mortar)b.appendChild(h('p',{class:'mortar',text:mortarLine(sm)}));
  if(R.isEmptyBuilding(s))b.appendChild(h('div',{class:'row'},[h('span',{class:'note',text:'A new building: '+designName(s.bp)+'.'}),btn(V('designs.title')||'Choose your design',function(){openSheet({kind:'design'})},'link')]));
  if(reviewDue(k))b.appendChild(btn('★ '+(V('review.title')||'This week with Jesus'),function(){openSheet({kind:'review',step:'fruit',i:0})},'link'));
  const todays=(k.p.arrivals||[]).filter(function(a){return a.day===s.day});
  b.appendChild(h('h3',{text:LW('todayHead')}));
  if(!todays.length)b.appendChild(h('p',{class:'note',text:LW('none')}));
  else b.appendChild(h('div',{class:'chips'},todays.map(function(a){return h('span',null,[h('span',{class:'dot'+(a.t==='W'?' W':''),style:a.t==='W'?null:'background:'+css(a.t)}),' '+(a.t==='W'?hayWords({m:{label:a.label,material:a.material}}):a.label)])})));
  if(tiles.length)b.appendChild(h('p',{class:'note',text:LW('place')}));
  const list=[['Stop & Pray','Lights the lamp',function(){openSheet({kind:'pray'})},'#ffd58a'],
    [get('gospel.labels.told','gospel.actCard.label')||'I told someone about Jesus','A seed is planted',function(){openSheet({kind:'tell'})},'#bfffb0'],
    [get('gospel.labels.friendFollows')||'A friend says they want to follow Jesus',get('gospel.labels.friendFollowsNote')||'Grown-ups only',friendCame,'#ff9a4a'],
    [get('gospel.labels.prayForNoName')||'Pray for them','Praying is watering',function(){openSheet({kind:'prayFor'})},'#f8eef4']];
  b.appendChild(h('div',{class:'grid'},list.map(function(q){return btn([h('span',{class:'dot',style:'background:'+q[3]}),h('span',null,[q[0],h('small',{text:q[1]})])],q[2])})));
  b.appendChild(candles(sm.prayers));
  animalButton(b);
  if(fireReady(s))f.appendChild(btn(LW('fireButton'),toLastLook,'big'));
  else if(R.isFireNight(s)&&!s.today.fired)b.appendChild(h('p',{class:'note',text:LW('fireLater')}));
  else if(s.today.fired)b.appendChild(h('p',{class:'note',text:k.x.fireWords||LW('fireDone')}));
  if(sm.canCallFire&&!R.isFireNight(s))f.appendChild(btn('It is finished. Ask for the fire tonight',function(){const r=R.callFire(s);if(!r.ok){refuse(r.reason);return}toLastLook()},'big'))}
/* (26 Nov 2026, round 1) THE MORNING TOUCH (about a minute, before school): hello, today's new pieces, one goal line,
   "Lay them for me" or by hand, and one hay line with "Show me". No fire, shop or gospel. It saves and closes itself after 90 seconds. */
const TOUCH_MS=90000;let touchEnd=TOUCH?Date.now()+TOUCH_MS:0;
function touchClose(){if(!TOUCH)return;save();if(inFrame)tellParent('rock-close');else{const b=$('pbody');b.textContent='';b.appendChild(h('p',{class:'say',text:'Time for shoes! See you tonight.'}));$('pfoot').textContent=''}}
function touchTick(){if(!TOUCH||!touchEnd)return;if(Date.now()<touchEnd)return;if(ui.busy||(ui.sheet&&ui.sheet.armed)){touchEnd=Date.now()+15000;return}touchEnd=0;touchClose()}   /* never cut off a pull half way */
function drawTouch(b,f){const k=K(),s=k.s,nm=s.profile.name,tiles=trayTiles(s),hw=hayWalls(s);
  title(b,nm?'Good morning, '+nm+'!':'Good morning!');
  b.appendChild(h('div',{class:'touchbar','aria-hidden':'true'},[h('i',{style:'animation-delay:-'+Math.max(0,Math.round((TOUCH_MS-(touchEnd-Date.now()))/1000))+'s'})]));
  if(R.isEmptyBuilding(s)&&!tiles.length){b.appendChild(h('p',{class:'say',text:LW('none')}));f.appendChild(btn('Done',touchClose,'big'));return}
  const todays=(k.p.arrivals||[]).filter(function(a){return a.day>=s.day-1&&a.t!=='W'}),c={};todays.forEach(function(a){const key=a.t==='G'?'gold':a.t==='S'?'silver':'gem';c[key]=(c[key]||0)+1});
  const bits=Object.keys(c).map(function(key){return c[key]+' '+(key==='gem'&&c[key]>1?'gems':key)});
  b.appendChild(h('p',{class:'say',text:tiles.length?(bits.length?'New: '+bits.join(', ')+'. ':'')+tiles.length+(tiles.length===1?' piece is':' pieces are')+' waiting to be laid.':'All your pieces are laid. Lovely!'}));
  goalLadder(b,true);
  if(hw.length){const n=strawSpots(s,hw[0]).length;b.appendChild(h('div',{class:'hayline'},[h('span',{style:'flex:1',text:'\ud83c\udf3e '+n+' hay in your '+WALLNAME[hw[0]]+': put it right today'}),btn('Show me',showMeHay,'quiet')]))}
  if(tiles.length){b.appendChild(h('p',{class:'note',text:'Tap a piece, then a glowing space. Or let your builders lay them.'}));f.appendChild(btn('Lay them for me',layRest,'big'))}
  f.appendChild(btn('Done',touchClose,tiles.length?'quiet':'big'))}
/* grown-up tools in live mode: only settings (read aloud, pull for me) and the design */
function undoSetting(b){b.appendChild(h('div',{class:'card'},[h('h2',{text:'Undo block'}),h('p',{class:'note',text:'How many blocks a child can take back each time the game is opened. Now: '+(undoMax()===0?'off':undoMax())+'.'}),
    h('div',{class:'grid'},[0,3,5,10,20].map(function(n){return btn(n===0?'Off':String(n),function(){DB.undoMax=n;save();drawUndoBlock();drawTools()},null,{'aria-pressed':String(undoMax()===n)})}))]))}
function drawLiveTools(b,tips){undoSetting(b);const tog=h('input',{type:'checkbox',checked:DB.speak||null,onchange:function(e){DB.speak=e.target.checked;save();if(DB.speak)speak($('say').textContent);else try{window.speechSynthesis.cancel()}catch(_){}}});
  const ap=h('input',{type:'checkbox',checked:DB.autoPull||null,onchange:function(e){DB.autoPull=e.target.checked;save();drawPanel()}});
  b.appendChild(h('div',{class:'card'},[h('h2',{text:'Settings and a tip'}),h('label',{class:'tog'},[tog,'Read the words aloud']),h('label',{class:'tog'},[ap,'Show "Pull it out for me" (for a child who cannot drag)']),
    h('p',{class:'pray',text:tips.length?txt(tips[DB.tip%tips.length]):''}),btn('Another tip',function(){DB.tip++;save();drawTools()},'quiet'),
    h('div',{class:'row'},[btn('Choose the design',function(){hideTools();openSheet({kind:'design'})},'quiet'),btn('Change the PIN',function(){DB.pin=null;save();hideTools();openTools()},'quiet')])]))}
const inFrame=(function(){try{return window.parent&&window.parent!==window}catch(e){return true}})();
function tellParent(type){if(!inFrame)return;try{window.parent.postMessage({type:type},location.origin)}catch(e){}}
function liveStart(){
  $('close').hidden=false;$('kids').hidden=true;
  $('close').addEventListener('click',function(){save();if(inFrame)tellParent('rock-close');else history.back()});
  /* keep the app awake while the child plays: at most one message every 2 seconds */
  let lastAct=0;document.addEventListener('pointerdown',function(){const n=Date.now();if(n-lastAct<2000)return;lastAct=n;tellParent('rock-activity')},true);
  window.addEventListener('focus',liveSync);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)liveSync()});
  window.addEventListener('storage',function(e){if(e.key===LINBOX&&e.newValue)liveSync()});
  setInterval(function(){if(!document.hidden)liveSync()},5000);
  if(TOUCH){document.body.classList.add('touch');setInterval(touchTick,1000);const x=X();if(x&&x.phase==='night'){x.phase='day';x.night='account';applyFull()}}   /* (26 Nov 2026, round 1) */
  const isNew=DB.isNew;DB.isNew=false;
  liveSync();
  if(isNew&&R.isEmptyBuilding(st())){openSheet({kind:'design'});say(LW('hello',{name:st().profile.name}))}
  save()}

/* ================= 9. start ================= */
$('mute').addEventListener('click',function(){DB.mute=!DB.mute;drawBar();save();sfx('tap')});
$('grown').addEventListener('click',openTools);
/* try-out only (hidden in the family app): a pile of test blocks, and a jump straight to the Last look before the fire */
if(LIVE){$('testBlocks').hidden=true;$('fireNow').hidden=!SANDBOX||TOUCH;$('startOver').hidden=!SANDBOX||TOUCH}   /* (26 Nov 2026, round 1) never a fire in the morning touch */
$('startOver').addEventListener('click',function(){if(!SANDBOX||busy())return;
  confirmBox('Start the test space again? This building is cleared. The children\'s buildings are not touched.','Yes, start again',function(){try{localStorage.removeItem(KEY)}catch(e){}DB=null;loadLive();DB.isNew=false;save();location.reload()})});
$('testBlocks').addEventListener('click',function(){if(LIVE)return;const s=st();if(!s)return;
  const add=function(t,n){for(let i=0;i<n;i++){const p={id:s.nextId++,t:t};if(R.CONFIG.gems[t])p.f=R.CONFIG.gems[t];p.m={test:1};s.tray.push(p)}};
  add('G',20);add('S',20);Object.keys(R.CONFIG.gems).forEach(function(g){add(g,4)});
  ['wood','hay','stubble'].forEach(function(mat){for(let i=0;i<4;i++)s.tray.push({id:s.nextId++,t:'W',m:{test:1,material:mat}})});
  save();redraw();sfx('gem');toast('88 test blocks added (with 4 wood, 4 hay and 4 stubble straw). Tap a piece, then a glowing space.')});
$('fireNow').addEventListener('click',function(){if((LIVE&&!SANDBOX)||busy())return;const x=X();clearUndo();clearBlockUndo();ui.sel=null;ui.sheet=null;S.hideGhosts();
  x.lookFrom={phase:x.phase,night:x.night};x.phase='night';x.night='lastlook';save();redraw();sfx('tap');say('Last look before the fire. Tap a straw bale to put it right, or light the fire.',true)});
$('stars').addEventListener('click',function(){openSheet({kind:'decorate'})});
$('hayChip').addEventListener('click',function(){if(busy())return;showMeHay()});   /* (26 Nov 2026, round 1) */
$('lvChip').addEventListener('click',function(){sfx('tap');openSheet({kind:'craft'})});
$('goal').addEventListener('click',function(){openSheet({kind:'goal'})});
$('designBtn').addEventListener('click',function(){openSheet({kind:'design'})});
$('toolsClose').addEventListener('click',hideTools);
['spinL','spinR'].forEach(function(id){$(id).addEventListener('click',function(){sfx('tap');S.turnTo($(id).getAttribute('data-view'))})});
Array.prototype.forEach.call($('views').children,function(v){if(!v.getAttribute('data-view'))return;v.addEventListener('click',function(){sfx('tap');S.turnTo(v.getAttribute('data-view'))})});
$('fullBtn').addEventListener('click',function(){sfx('tap');DB.full=!DB.full;save();applyFull();say(DB.full?'Big picture. Tap \u26f6 again to bring the side back.':'',true)});
['gesturestart','gesturechange'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()},{passive:false})});   /* never zoom the whole page */
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('modal').hidden)$('modal').hidden=true});
/* a leaning wall creaks now and then */
setInterval(function(){if(ui.busy||document.hidden||!K())return;const w=R.wobble(st());if(WALLS.some(function(q){return w[q]>=2}))sfx('creak')},5200);
DB.tip=(DB.tip||0)+1;
window.RockPlay={sel:function(){return ui.sel},busy:function(){return ui.busy},state:st,extra:X,kid:K,scene:S,redraw:redraw,db:function(){return DB},hints:windowHints,art:function(){return artState},simDay:function(t){return simDay(K(),t||'typical')}};   /* handy for checking by hand in the console */
redraw();
if(LIVE)liveStart();
/* the pictures come after the first paint, so the page is never held up by them */
requestAnimationFrame(function(){setTimeout(loadArt,30)});setTimeout(loadArt,700);   /* the timer also covers a page opened in the background, where frames wait */
})();
</script>
