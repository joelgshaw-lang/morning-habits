<meta name="claude:viewport-fit-sides" content="cover">
<title>Build on the Rock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Layout: the page fills the screen and does not scroll. Thin day bar, then the 3D stage (it never jumps), a caption strip under it,
   the tray of pieces, and one panel that scrolls inside itself with its main button pinned at the bottom.
   Wide screens put tray + panel beside the stage. Small phones fall back to an ordinary scrolling page. Single dusk look by choice. */
:root{
  color-scheme:dark;
  --night:#15122e; --plum:#2a2050; --panel:#221b44; --panel2:#2c2356; --line:#463a78;
  --ink:#f3eefc; --soft:#b9afd8; --gold:#f2b93f; --gold-ink:#2b1a02; --ember:#ff9a4a; --pearl:#f8eef4; --straw:#6f6a3c;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
html,body{background:var(--night);height:100%}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;margin:0;overflow:hidden;
  padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
*{box-sizing:border-box}
[hidden]{display:none!important}
.app{height:calc(100vh - 16px);height:calc(100dvh - 16px);max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;letter-spacing:.2px}
h1{font-size:19px} h2{font-size:18px} h3{font-size:15px;color:var(--soft);font-weight:500}
p{margin:0}
button{font-family:var(--display);font-weight:500;font-size:16px;color:var(--ink);background:var(--panel2);
  border:1px solid var(--line);border-bottom-width:3px;border-radius:12px;padding:7px 12px;min-height:44px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:hover{border-color:var(--soft)}
button:active{transform:translateY(1px);border-bottom-width:2px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:#a8771a}
button:disabled{opacity:.45;cursor:default}
.big{display:block;width:100%;font-size:19px;font-weight:600;min-height:52px;background:var(--gold);color:var(--gold-ink);border-color:#a8771a}
.quiet{background:transparent;border-bottom-width:1px;color:var(--soft)}
.link{background:none;border:0;color:var(--soft);text-decoration:underline;min-height:44px;padding:4px 8px;font-family:var(--body);font-weight:700}

/* day bar */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:5px 8px;flex:none}
.bar .seg{display:flex;gap:4px}
.bar .seg button{padding:5px 10px}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-weight:700;font-size:14px;min-height:32px}
.candle{width:8px;height:20px;border-radius:2px;background:linear-gradient(to top,#f1e8dc var(--left,50%),rgba(255,255,255,.12) var(--left,50%));position:relative}
.candle::before{content:"";position:absolute;left:50%;bottom:calc(var(--left,50%) - 1px);width:7px;height:9px;margin-left:-3.5px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--ember);box-shadow:0 0 8px 2px rgba(255,154,74,.7)}
.chip.fire{background:#5a2414;border-color:var(--ember)}
.bar .sp{flex:1}
/* live mode (inside the family app): a clear way out, top left */
#close{background:#f3eefc;color:#15122e;border-color:#b9afd8;font-size:18px;font-weight:600;padding:6px 16px;min-height:48px}
#plan{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px 12px;font-size:15px;display:flex;gap:9px;align-items:center}
.dot{width:14px;height:14px;border-radius:4px;flex:none;border:1px solid rgba(255,255,255,.3)}
.dot.W{background:repeating-linear-gradient(0deg,#6f6a3c 0 3px,#4d4a2a 3px 5px)}

/* stage */
.main{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.left{flex:none;display:flex;flex-direction:column;gap:6px;min-width:0}
#stage{position:relative;width:100%;aspect-ratio:4/3;max-height:43vh;max-height:43dvh;border-radius:18px;overflow:hidden;border:1px solid var(--line);
  background:linear-gradient(#120f33 0%,#2c1f5c 38%,#6f3d74 68%,#d98458 90%,#f0b06a 100%)}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,rgba(0,0,0,0) 55%,rgba(8,5,24,.55) 100%)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
#tag{position:absolute;z-index:2;left:10px;top:10px;font-size:13px;color:var(--ink);background:rgba(18,14,40,.6);border-radius:999px;padding:3px 10px;pointer-events:none}
#goal{position:absolute;z-index:2;left:10px;top:38px;min-height:32px;font-size:13px;padding:3px 10px;border-radius:999px;background:rgba(242,185,63,.92);color:var(--gold-ink);border-color:#a8771a;font-family:var(--body);font-weight:700}
.starchip{cursor:pointer;color:var(--gold);font-family:var(--body)}
#views{position:absolute;z-index:2;right:8px;top:8px;display:flex;gap:4px}
#views button{min-width:50px;padding:4px 7px;font-size:14px;background:rgba(34,27,68,.82)}
#toast{position:absolute;z-index:3;left:50%;top:42%;transform:translate(-50%,-50%);background:rgba(18,14,40,.92);border:1px solid var(--ember);border-radius:14px;padding:10px 16px;font-weight:700;text-align:center;pointer-events:none}
#fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
#cap{flex:none;display:flex;align-items:center;gap:10px;min-height:50px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 12px}
#say{flex:1;font-weight:700;font-size:clamp(15px,2vw,17px);line-height:1.3;text-wrap:balance}
#say:empty::before{content:"Drag the picture to turn it.";color:var(--soft);font-weight:600}
.side{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column;gap:8px}
@media (min-width:1000px) and (orientation:landscape){
  .main{flex-direction:row}
  .left{flex:1.5}
  #stage{max-height:calc(100vh - 300px);max-height:calc(100dvh - 300px)}
  .side{flex:1;min-width:330px}
}
/* small phones: an ordinary scrolling page */
@media (max-width:560px),(max-height:620px){
  body{overflow:auto;height:auto} html{height:auto}
  .app{height:auto} .main{display:flex;flex-direction:column} #stage{aspect-ratio:1/1;max-height:none} #panel{min-height:300px}
  #views{flex-wrap:wrap;justify-content:flex-end;max-width:60%} #views button{min-width:44px;padding:4px 5px;font-size:13px} .tile{width:112px} .grid.three{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){h1{display:none}}

/* tray and panel */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px 12px;display:flex;flex-direction:column;gap:6px}
#tray{flex:none}
#panel{flex:1;min-height:0;padding:0;gap:0;overflow:hidden}
#pbody{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
#pfoot{flex:none;padding:8px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
#pfoot:empty{display:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row .sp{flex:1}
.note{color:var(--soft);font-size:14px}
.tiles{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.tile{flex:none;width:128px;min-height:62px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;font-family:var(--body);font-weight:700;font-size:13px;line-height:1.15;padding:7px;scroll-snap-align:start}
.tile .sw{width:100%;height:14px;border-radius:5px;border:1px solid rgba(255,255,255,.3)}
.tile.off{opacity:.38;filter:grayscale(.85);cursor:default}
.tile[aria-pressed="true"]{outline:3px solid var(--gold);outline-offset:1px;background:var(--panel2);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.cat .pc{min-height:64px;justify-content:center}.cat .pc .t{font-size:19px}.cat .gem{border-color:#28bea0}.cat .burn{border-color:#c8702f}
.pile{display:block;width:100%;margin:8px 0;font-weight:700;font-size:16px;text-align:center}
.grid button{text-align:left;display:flex;gap:8px;align-items:center;line-height:1.2}
.grid button small{display:block;font-family:var(--body);font-weight:600;font-size:12.5px;opacity:.85}
.say{font-size:17px;font-weight:700;line-height:1.35}
.pray{background:var(--panel2);border-left:4px solid var(--pearl);border-radius:8px;padding:8px 12px;font-size:17px;font-weight:600}
.mortar{background:var(--panel2);border-left:4px solid #e8e2d0;border-radius:8px;padding:6px 12px;font-size:15px}
.step{display:flex;flex-direction:column;gap:6px}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
input[type=text],input[type=password]{font:inherit;font-size:18px;color:var(--ink);background:var(--night);border:1px solid var(--line);border-radius:10px;min-height:48px;padding:0 12px;width:100%}

/* grown-up tools: a separate sheet behind a PIN */
#toolsWrap{position:fixed;inset:0;z-index:15;background:var(--night);overflow-y:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 30px max(16px,env(safe-area-inset-left,0px))}
#toolsWrap .head{display:flex;align-items:center;gap:10px;max-width:1240px;margin:0 auto 12px}
.tools{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));max-width:1240px;margin:0 auto}
select{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:0 10px}
.wc{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;font-size:14px}
.wc .nums{display:flex;gap:4px}
.wc .nums button{min-width:44px;padding:4px}
.tag3{font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;margin-left:6px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
#out{white-space:pre-wrap;font-size:14px;color:var(--ink);background:var(--night);border-radius:10px;padding:8px 10px;min-height:2.6em}
label.tog{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
label.tog input{width:22px;height:22px;accent-color:var(--gold)}

/* in-page confirm */
#modal{position:fixed;inset:0;z-index:20;background:rgba(8,5,24,.72);display:flex;align-items:center;justify-content:center;padding:20px}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ===== v5: picture cards, this week's three, palette, gallery, review ===== */
.pc{display:flex;flex-direction:column;align-items:stretch;gap:4px;background:var(--panel2);border:1px solid var(--line);border-bottom-width:3px;border-radius:14px;padding:6px;text-align:center;font-family:var(--body);font-weight:700;font-size:14px;line-height:1.2;color:var(--ink);min-width:0}
.pc .art{background:#fff7ec;border-radius:10px;padding:3px;display:block}
.pc .art svg{display:block;width:100%;height:auto;max-height:118px}
.pc .t{font-family:var(--display);font-weight:600;font-size:16px}
.pc small{font-weight:600;color:var(--soft);font-size:12.5px;display:block}
.pc .ex{font-size:14px;color:var(--gold);font-weight:700}
.pc.focus{border-color:var(--gold);border-width:2px;border-bottom-width:4px;background:#3a2f68}
.pc .fbadge{font-size:11px;font-weight:800;color:var(--gold-ink);background:var(--gold);border-radius:999px;padding:1px 8px;align-self:center}
.pc.focus .t{font-size:18px}
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cards4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cards4 .lamp{font-size:44px;line-height:1.6;background:#2b2450;color:#ffd58a}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pic{display:flex;flex-direction:column;gap:5px;padding:6px;border-width:3px;border-radius:14px;background:var(--panel2);font-family:var(--body);font-weight:700;font-size:15px;line-height:1.2;text-align:center}
.pic .art{background:#fff7ec;border-radius:10px;padding:3px;display:block}
.pic .art svg{display:block;width:100%;height:auto;max-height:150px}
.pic.yes{border-color:#3fae5a}.pic.no{border-color:#c98a8a}
.pic.no .art svg{filter:saturate(.8)}
button.both{width:100%;min-height:52px;font-size:17px}
.wordsOnly{font-size:15px}
.candles{display:inline-flex;gap:4px;align-items:flex-end;height:26px}
.candles i{display:block;width:7px;height:16px;border-radius:2px;background:#4a3f6e;position:relative}
.candles i.lit{background:#f1e8dc}
.candles i.lit::after{content:"";position:absolute;left:50%;top:-8px;width:6px;height:8px;margin-left:-3px;border-radius:50%;background:var(--ember);box-shadow:0 0 6px 2px rgba(255,154,74,.6)}
.palette{display:flex;flex-wrap:wrap;gap:6px}
.palette button{width:44px;height:44px;min-height:44px;border-radius:10px;padding:0;border:2px solid rgba(255,255,255,.35)}
.palette button[aria-pressed="true"]{outline:3px solid #fff;outline-offset:2px}
.tile .count{font-family:var(--display);font-size:18px;font-weight:600;color:var(--gold)}
.tile .badge{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--soft);font-weight:700}
.tile .badge .art{width:22px;height:22px;display:inline-block;flex:none}
.tile .badge .art svg{width:22px;height:22px}
.tile .badge .art *{animation:none!important}
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.gal button{flex-direction:column;align-items:center;text-align:center;display:flex;gap:2px;padding:6px}
.gal button small{font-family:var(--body);font-weight:600;font-size:12px;color:var(--soft)}
.gal button[aria-pressed="true"]{outline:3px solid var(--gold);background:#3a2f68;color:var(--ink)}
.rstars{display:flex;justify-content:center;gap:8px}
.rstar{background:none;border:0;padding:2px;width:64px;min-height:44px;display:flex;flex-direction:column;align-items:center;font-family:var(--body)}
.rstars.faces .rstar{width:96px}
.rstar svg{width:100%;height:auto;display:block}
.rstar small{font-size:15px;font-weight:800;color:var(--soft)}
.rstar[aria-pressed="true"]{background:none;color:var(--ink)}
.strip{display:flex;gap:6px;align-items:flex-end}
.strip .d{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--soft);font-weight:700;min-width:28px}
.strip .bar{width:16px;border-radius:4px 4px 0 0;background:var(--gold)}
.strip .bar.w{background:repeating-linear-gradient(0deg,#6f6a3c 0 3px,#4d4a2a 3px 5px)}
.sums{display:inline-flex;gap:8px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:13px;font-weight:700;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.friend{width:84px;flex:none;background:#fff7ec;border-radius:12px;padding:2px}
#designBtn{position:absolute;z-index:2;left:10px;bottom:10px;min-height:40px;font-size:14px;padding:4px 12px;background:rgba(242,185,63,.92);color:var(--gold-ink);border-color:#a8771a}
@media (orientation:portrait) and (max-width:900px){.pc .art svg{max-height:84px}.pic .art svg{max-height:110px}.pc small{font-size:12px}}
@media (max-width:560px){.cards4{grid-template-columns:repeat(2,minmax(0,1fr))}.gal{grid-template-columns:repeat(2,minmax(0,1fr))}.pc .art svg{max-height:90px}}

/* Fruit Friends art: copied from fruit.css (lines 164-271), not linked, so this page only carries what it uses */
/* ----- Fruit Friends art (made from the try-out page; nc- = characters, fs- = pictures) ----- */
.nc-svg { display: block; width: 100%; height: auto; margin: 0 auto; overflow: visible; }
/* Sticker layers: shadow, white edge, then the coloured shapes with a dark outline */
.nc-shd { transform: translate(0, 2.5px); opacity: .2; }
.nc-shd > *, .nc-edge > * { fill: #000; stroke: #000; stroke-width: 12px; stroke-linejoin: round; }
.nc-edge > * { fill: #fff; stroke: #fff; }
.nc-shd > .nc-ln, .nc-shd > .nc-lnk, .nc-edge > .nc-ln, .nc-edge > .nc-lnk { fill: none; stroke-width: calc(var(--w) + 12px); stroke-linecap: round; }
.nc-body > * { stroke: var(--nc-ink); stroke-width: 3.2px; stroke-linejoin: round; }
.nc-body > .nc-lnk { fill: none; stroke: var(--nc-ink); stroke-width: calc(var(--w) + 6.4px); stroke-linecap: round; }
.nc-body > .nc-ln { fill: none; stroke: var(--c); stroke-width: var(--w); stroke-linecap: round; }

/* Life: idle moves, blinking, and tap reactions */
.nc-char, .nc-react { transform-box: fill-box; transform-origin: 50% 100%; }
.nc-eye { transform-box: fill-box; transform-origin: center; animation: nc-blink 5s infinite; }
.nc-idle-bob { animation: nc-bob 2.8s ease-in-out infinite; }
.nc-idle-sway { animation: nc-sway 4s ease-in-out infinite; }
.nc-idle-breathe { animation: nc-breathe 3.6s ease-in-out infinite; }
.nc-idle-float { animation: nc-float 3.4s ease-in-out infinite; }
.nc-idle-glide { animation: nc-glide 4.4s ease-in-out infinite; transform-origin: 50% 50%; }
.nc-do-hop { animation: nc-hop .6s ease; }
.nc-do-wiggle { animation: nc-wiggle .7s ease; }
.nc-do-launch { animation: nc-launch 1.1s ease-in-out; }
.nc-do-puff { animation: nc-puff .9s ease; transform-origin: 50% 50%; }
.nc-do-spin { animation: nc-spin .9s ease-in-out; transform-origin: 50% 50%; }
.nc-do-curl { animation: nc-curl .9s ease; }
@keyframes nc-blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@keyframes nc-bob { 0%, 100% { transform: translateY(0) scale(1, 1); } 50% { transform: translateY(-2px) scale(1.02, .98); } }
@keyframes nc-sway { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
@keyframes nc-breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.03, .975); } }
@keyframes nc-float { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-5px) rotate(1deg); } }
@keyframes nc-glide { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-4px) rotate(4deg); } }
@keyframes nc-hop { 0% { transform: translateY(0) scale(1.08, .9); } 40% { transform: translateY(-18px) scale(.95, 1.07) rotate(-4deg); } 75% { transform: translateY(0) scale(1.07, .93); } 100% { transform: none; } }
@keyframes nc-wiggle { 0%, 100% { transform: rotate(0); } 15% { transform: rotate(-9deg); } 30% { transform: rotate(8deg); } 45% { transform: rotate(-7deg); } 60% { transform: rotate(6deg); } 80% { transform: rotate(-3deg); } }
@keyframes nc-launch { 0% { transform: translateY(0) scale(1.1, .85); } 12% { transform: translateY(4px) scale(1.12, .82); } 45% { transform: translateY(-90px) scale(.9, 1.15); opacity: 1; } 50% { transform: translateY(-110px); opacity: 0; } 51% { transform: translateY(30px); opacity: 0; } 70% { transform: translateY(-6px); opacity: 1; } 100% { transform: none; } }
@keyframes nc-puff { 0% { transform: scale(1); } 20% { transform: scale(1.38); } 65% { transform: scale(1.32); } 85% { transform: scale(.94); } 100% { transform: scale(1); } }
@keyframes nc-spin { 0% { transform: rotate(0) scale(1); } 50% { transform: rotate(180deg) scale(.85); } 100% { transform: rotate(360deg) scale(1); } }
@keyframes nc-curl { 0% { transform: none; } 25% { transform: scale(.78, .7) rotate(-18deg); } 70% { transform: scale(.8, .72) rotate(-14deg); } 100% { transform: none; } }

.fs-scene { display: block; width: 100%; height: auto; overflow: visible; }
.fs-scene .fs-shd { transform: translate(0, 2px); opacity: .18; }
.fs-scene .fs-shd *, .fs-scene .fs-edge * { fill: #000; stroke: #000; stroke-width: 7px; stroke-linejoin: round; }
.fs-scene .fs-edge * { fill: #fff; stroke: #fff; }
.fs-scene .fs-shd .fs-ln, .fs-scene .fs-shd .fs-lnk, .fs-scene .fs-edge .fs-ln, .fs-scene .fs-edge .fs-lnk { fill: none; stroke-width: calc(var(--w) + 7px); stroke-linecap: round; }
.fs-scene .fs-body * { stroke: #2d1f17; stroke-width: 2.4px; stroke-linejoin: round; }

/* ================= 10. live mode: one real child inside the family app =================
   The app writes what happened in real life to localStorage 'rock.inbox.<kid>' (a JSON array, the app only appends):
     { t: ISO time, kind: 'gold'|'silver'|'gem'|'straw', fruit?: gem code, material?: 'wood'|'hay'|'stubble', label: short words }
   This page takes every item, empties the inbox and turns each one into pieces through the rules (daily caps apply).
   Good pieces go to the tray for the child to lay; straw lands by itself (the rules' own straw 'W', its material kept in the meta).

   REAL DAYS. The day follows the calendar (local date, new day at 3am). When the page opens on a later real day, each missed day
   is closed and opened the same way the pretend "Next morning" does (nextDay: endDay then startDay), with the inbox items stamped
   on that day fed in first, so each day's caps stay that day's. Fires are NEVER run during catch-up. The rules already carry a
   missed fire night as ONE owed fire (state.fireOwed is a yes/no, not a count), so however long the child was away there is at most
   one fire waiting, and the child gets their Last look (a chance to put straw right) before they light it. Nothing is laid for
   them overnight (autoLayAtNight is off in live mode), so pieces they never saw wait in the tray. */
const LINBOX='rock.inbox.'+LKID,FIRE_HOUR=17,MAXCATCH=400;
const LIVEW={title:'{name}\'s building',titleNoName:'My building',hello:'Hello {name}! Choose your design.',none:'Your pieces come from real life. They show up here.',todayHead:'Today\'s pieces',
  place:'Tap a piece, then tap a glowing space.',arrived:'New pieces: {list}.',strawLanded:'Straw landed: {list}. Tap a bale to put it right.',strawHint:'There is straw in your walls. Tap a bale to put it right before the fire.',
  newDay:'A new day!',fireOwed:'Last night was fire night. Have a last look, then light the fire.',fireLater:'Fire tonight. You can light it after 5 o\'clock.',fireButton:'Last look before the fire',fireDone:'The fire is over for today.'};
function LW(key,vars){const v=get('live.'+key);return fill(typeof v==='string'?v:(LIVEW[key]||''),vars)}
function takeInbox(){let a=null;try{const raw=localStorage.getItem(LINBOX);if(raw==null)return [];localStorage.removeItem(LINBOX);a=JSON.parse(raw)}catch(e){a=null}
  return Array.isArray(a)?a.filter(function(o){return o&&typeof o==='object'}):[]}
const DEFLABEL={gold:'Time with God',silver:'Jobs done well',gem:'A good moment',straw:'Straw'};
/* one inbox item -> rules pieces. Returns null for an item this page does not understand (it is dropped). */
function feedOne(s,it){const kind=it.kind,meta={label:String(it.label||DEFLABEL[kind]||'').slice(0,48),at:String(it.t||''),app:kind};let type;
  if(kind==='gold')type='G';else if(kind==='silver')type='S';
  else if(kind==='gem')type=isGem(it.fruit)?it.fruit:'l';
  else if(kind==='straw'){type='W';meta.material=it.material==='wood'||it.material==='stubble'?it.material:'hay'}
  else return null;
  return{type:type,kind:kind,label:meta.label,material:meta.material||null,r:R.addPiece(s,type,meta)}}
function strawOnWalls(s){let n=0;WALLS.forEach(function(w){s.walls[w].forEach(function(col){col.forEach(function(p){if(p&&p.t==='W')n++})})});return n}
function canSync(){return LIVE&&!ui.busy&&$('modal').hidden&&!(ui.sheet&&ui.sheet.kind==='fix'&&ui.sheet.armed)}
function liveSync(){if(!canSync())return;
  const k=K(),today=rockDate(),items=takeInbox(),done=items.map(function(){return false}),got=[],straw=[];let moved=0;
  function itemDay(it){const d=new Date(it.t);return isNaN(d.getTime())?today:rockDate(d)}
  function feed(upTo){items.forEach(function(it,i){if(done[i]||(upTo!=null&&dayNum(itemDay(it))>upTo))return;done[i]=true;
    let o=null;try{o=feedOne(k.s,it)}catch(e){o=null}if(!o||!o.r.ok)return;   /* over the daily cap: the rules say no, the piece is not given */
    (k.p.arrivals||(k.p.arrivals=[])).push({day:k.s.day,kind:o.kind,t:o.type,label:o.label,material:o.material});
    if(o.type==='W')o.r.events.forEach(function(e){if(e.kind==='strawLand')straw.push(e)});else got.push(o)})}
  if(dayNum(DB.lastDate)<dayNum(today)){
    let d=dayNum(DB.lastDate);const end=dayNum(today);
    while(d<end&&moved<MAXCATCH){feed(d);nextDay(k);d++;moved++}   /* a day the page never saw is still closed, quietly: no fire */
    k.s.weekday=realWeekday();DB.lastDate=today;ui.sheet=null;ui.sel=null;S.hideGhosts()}
  feed(null);   /* today's items (and any stamped later by a clock that is ahead) */
  if(k.p.arrivals&&k.p.arrivals.length>40)k.p.arrivals=k.p.arrivals.slice(-40);
  if(!got.length&&!straw.length&&!moved)return;
  const keys=straw.filter(function(e){const q=R.at(k.s,e.wall,e.col,e.row);return q&&q.id===e.piece.id}).map(function(e){return K3(e.wall,e.col,e.row)});
  redraw({loose:keys});
  if(keys.length){S.faceWall(straw[straw.length-1].wall);straw.forEach(function(e,i){if(keys.indexOf(K3(e.wall,e.col,e.row))<0)return;S.dropIn(e.wall,e.col,e.row,i*450).then(function(){sfx('straw');if(e.wobble===2)setTimeout(function(){sfx('creak')},350)})})}
  else if(got.length)sfx('gem');
  const uniq=function(list){const out=[];list.forEach(function(q){if(q&&out.indexOf(q)<0)out.push(q)});return out.join(', ')},words=[];
  if(moved)words.push(LW('newDay'));
  if(got.length)words.push(LW('arrived',{list:uniq(got.map(function(o){return o.label}))}));
  if(straw.length)words.push(LW('strawLanded',{list:uniq(straw.map(function(e){return e.piece.m&&e.piece.m.label}))}));
  if(moved&&k.s.fireOwed&&!k.s.today.fired)words.push(LW('fireOwed'));
  say(words.join(' '))}
function fireReady(s){return R.isFireNight(s)&&!s.today.fired&&(!!s.fireOwed||!!s.today.called||new Date().getHours()>=FIRE_HOUR)}
function toLastLook(){if(busy())return;const x=X();x.phase='night';x.night='lastlook';ui.sheet=null;say(get('fireWords.lastLook')||'');drawAll()}
/* the live panel: today's pieces, the page's own prayer and gospel buttons, and the fire when it is time */
function drawLive(b,f){const k=K(),s=k.s,sm=R.summary(s),tiles=trayTiles(s),nm=s.profile.name;
  title(b,nm?LW('title',{name:nm}):LW('titleNoName'));
  if(sm.mortar)b.appendChild(h('p',{class:'mortar',text:mortarLine(sm)}));
  if(R.isEmptyBuilding(s))b.appendChild(h('div',{class:'row'},[h('span',{class:'note',text:'A new building: '+designName(s.bp)+'.'}),btn(V('designs.title')||'Choose your design',function(){openSheet({kind:'design'})},'link')]));
  if(reviewDue(k))b.appendChild(btn('★ '+(V('review.title')||'This week with Jesus'),function(){openSheet({kind:'review',step:'fruit',i:0})},'link'));
  const todays=(k.p.arrivals||[]).filter(function(a){return a.day===s.day});
  b.appendChild(h('h3',{text:LW('todayHead')}));
  if(!todays.length)b.appendChild(h('p',{class:'note',text:LW('none')}));
  else b.appendChild(h('div',{class:'chips'},todays.map(function(a){return h('span',null,[h('span',{class:'dot'+(a.t==='W'?' W':''),style:a.t==='W'?null:'background:'+css(a.t)}),' '+a.label+(a.t==='W'&&a.material&&a.material!=='hay'?' ('+((get('live.materials')||{})[a.material]||a.material)+')':'')])})));
  if(tiles.length)b.appendChild(h('p',{class:'note',text:LW('place')}));
  if(strawOnWalls(s))b.appendChild(h('p',{class:'note',text:LW('strawHint')}));
  const list=[['Stop & Pray','Lights the lamp',function(){openSheet({kind:'pray'})},'#ffd58a'],
    [get('gospel.labels.told','gospel.actCard.label')||'I told someone about Jesus','A seed is planted',function(){openSheet({kind:'tell'})},'#bfffb0'],
    [get('gospel.labels.friendFollows')||'A friend says they want to follow Jesus',get('gospel.labels.friendFollowsNote')||'Grown-ups only',friendCame,'#ff9a4a'],
    [get('gospel.labels.prayForNoName')||'Pray for them','Praying is watering',function(){openSheet({kind:'prayFor'})},'#f8eef4']];
  b.appendChild(h('div',{class:'grid'},list.map(function(q){return btn([h('span',{class:'dot',style:'background:'+q[3]}),h('span',null,[q[0],h('small',{text:q[1]})])],q[2])})));
  b.appendChild(candles(sm.prayers));
  animalButton(b);
  if(fireReady(s))f.appendChild(btn(LW('fireButton'),toLastLook,'big'));
  else if(R.isFireNight(s)&&!s.today.fired)b.appendChild(h('p',{class:'note',text:LW('fireLater')}));
  else if(s.today.fired)b.appendChild(h('p',{class:'note',text:k.x.fireWords||LW('fireDone')}));
  if(sm.canCallFire&&!R.isFireNight(s))f.appendChild(btn('It is finished. Ask for the fire tonight',function(){const r=R.callFire(s);if(!r.ok){refuse(r.reason);return}toLastLook()},'big'))}
/* grown-up tools in live mode: only settings (read aloud, pull for me) and the design */
function drawLiveTools(b,tips){const tog=h('input',{type:'checkbox',checked:DB.speak||null,onchange:function(e){DB.speak=e.target.checked;save();if(DB.speak)speak($('say').textContent);else try{window.speechSynthesis.cancel()}catch(_){}}});
  const ap=h('input',{type:'checkbox',checked:DB.autoPull||null,onchange:function(e){DB.autoPull=e.target.checked;save();drawPanel()}});
  b.appendChild(h('div',{class:'card'},[h('h2',{text:'Settings and a tip'}),h('label',{class:'tog'},[tog,'Read the words aloud']),h('label',{class:'tog'},[ap,'Show "Pull it out for me" (for a child who cannot drag)']),
    h('p',{class:'pray',text:tips.length?txt(tips[DB.tip%tips.length]):''}),btn('Another tip',function(){DB.tip++;save();drawTools()},'quiet'),
    h('div',{class:'row'},[btn('Choose the design',function(){hideTools();openSheet({kind:'design'})},'quiet'),btn('Change the PIN',function(){DB.pin=null;save();hideTools();openTools()},'quiet')])]))}
const inFrame=(function(){try{return window.parent&&window.parent!==window}catch(e){return true}})();
function tellParent(type){if(!inFrame)return;try{window.parent.postMessage({type:type},location.origin)}catch(e){}}
function liveStart(){
  $('close').hidden=false;$('kids').hidden=true;
  $('close').addEventListener('click',function(){save();if(inFrame)tellParent('rock-close');else history.back()});
  /* keep the app awake while the child plays: at most one message every 2 seconds */
  let lastAct=0;document.addEventListener('pointerdown',function(){const n=Date.now();if(n-lastAct<2000)return;lastAct=n;tellParent('rock-activity')},true);
  window.addEventListener('focus',liveSync);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)liveSync()});
  window.addEventListener('storage',function(e){if(e.key===LINBOX&&e.newValue)liveSync()});
  setInterval(function(){if(!document.hidden)liveSync()},5000);
  const isNew=DB.isNew;DB.isNew=false;
  liveSync();
  if(isNew&&R.isEmptyBuilding(st())){openSheet({kind:'design'});say(LW('hello',{name:st().profile.name}))}
  save()}

/* ================= 9. start ================= */
$('mute').addEventListener('click',function(){DB.mute=!DB.mute;drawBar();save();sfx('tap')});
$('grown').addEventListener('click',openTools);
$('stars').addEventListener('click',function(){openSheet({kind:'decorate'})});
$('goal').addEventListener('click',function(){openSheet({kind:'goal'})});
$('designBtn').addEventListener('click',function(){openSheet({kind:'design'})});
$('toolsClose').addEventListener('click',hideTools);
Array.prototype.forEach.call($('views').children,function(v){v.addEventListener('click',function(){sfx('tap');S.turnTo(v.getAttribute('data-view'))})});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('modal').hidden)$('modal').hidden=true});
/* a leaning wall creaks now and then */
setInterval(function(){if(ui.busy||document.hidden||!K())return;const w=R.wobble(st());if(WALLS.some(function(q){return w[q]>=2}))sfx('creak')},5200);
DB.tip=(DB.tip||0)+1;
window.RockPlay={state:st,extra:X,kid:K,scene:S,redraw:redraw,db:function(){return DB},hints:windowHints,art:function(){return artState},simDay:function(t){return simDay(K(),t||'typical')}};   /* handy for checking by hand in the console */
redraw();
if(LIVE)liveStart();
/* the pictures come after the first paint, so the page is never held up by them */
requestAnimationFrame(function(){setTimeout(loadArt,30)});setTimeout(loadArt,700);   /* the timer also covers a page opened in the background, where frames wait */
})();
</script>
