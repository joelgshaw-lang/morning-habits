<meta name="claude:viewport-fit-sides" content="cover">
<title>Build on the Rock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Layout: the page fills the screen and does not scroll. Thin day bar, then the 3D stage (it never jumps), a caption strip under it,
   the tray of pieces, and one panel that scrolls inside itself with its main button pinned at the bottom.
   Wide screens put tray + panel beside the stage. Small phones fall back to an ordinary scrolling page. Single dusk look by choice. */
:root{
  color-scheme:dark;
  --night:#15122e; --plum:#2a2050; --panel:#221b44; --panel2:#2c2356; --line:#463a78;
  --ink:#f3eefc; --soft:#b9afd8; --gold:#f2b93f; --gold-ink:#2b1a02; --ember:#ff9a4a; --pearl:#f8eef4; --straw:#6f6a3c;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
html,body{background:var(--night);height:100%}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;margin:0;overflow:hidden;
  padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
*{box-sizing:border-box}
[hidden]{display:none!important}
.app{height:calc(100vh - 16px);height:calc(100dvh - 16px);max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;letter-spacing:.2px}
h1{font-size:19px} h2{font-size:18px} h3{font-size:15px;color:var(--soft);font-weight:500}
p{margin:0}
button{font-family:var(--display);font-weight:500;font-size:16px;color:var(--ink);background:var(--panel2);
  border:1px solid var(--line);border-bottom-width:3px;border-radius:12px;padding:7px 12px;min-height:44px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:hover{border-color:var(--soft)}
button:active{transform:translateY(1px);border-bottom-width:2px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:#a8771a}
button:disabled{opacity:.45;cursor:default}
.big{display:block;width:100%;font-size:19px;font-weight:600;min-height:52px;background:var(--gold);color:var(--gold-ink);border-color:#a8771a}
.quiet{background:transparent;border-bottom-width:1px;color:var(--soft)}
.link{background:none;border:0;color:var(--soft);text-decoration:underline;min-height:44px;padding:4px 8px;font-family:var(--body);font-weight:700}

/* day bar */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:5px 8px;flex:none}
.bar .seg{display:flex;gap:4px}
.bar .seg button{padding:5px 10px}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-weight:700;font-size:14px;min-height:32px}
.candle{width:8px;height:20px;border-radius:2px;background:linear-gradient(to top,#f1e8dc var(--left,50%),rgba(255,255,255,.12) var(--left,50%));position:relative}
.candle::before{content:"";position:absolute;left:50%;bottom:calc(var(--left,50%) - 1px);width:7px;height:9px;margin-left:-3.5px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--ember);box-shadow:0 0 8px 2px rgba(255,154,74,.7)}
.chip.fire{background:#5a2414;border-color:var(--ember)}
.bar .sp{flex:1}
#plan{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px 12px;font-size:15px;display:flex;gap:9px;align-items:center}
.dot{width:14px;height:14px;border-radius:4px;flex:none;border:1px solid rgba(255,255,255,.3)}
.dot.W{background:repeating-linear-gradient(0deg,#6f6a3c 0 3px,#4d4a2a 3px 5px)}

/* stage */
.main{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.left{flex:none;display:flex;flex-direction:column;gap:6px;min-width:0}
#stage{position:relative;width:100%;aspect-ratio:4/3;max-height:43vh;max-height:43dvh;border-radius:18px;overflow:hidden;border:1px solid var(--line);
  background:linear-gradient(#120f33 0%,#2c1f5c 38%,#6f3d74 68%,#d98458 90%,#f0b06a 100%)}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,rgba(0,0,0,0) 55%,rgba(8,5,24,.55) 100%)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab}
#c:active{cursor:grabbing}
#tag{position:absolute;z-index:2;left:10px;top:10px;font-size:13px;color:var(--ink);background:rgba(18,14,40,.6);border-radius:999px;padding:3px 10px;pointer-events:none}
#goal{position:absolute;z-index:2;left:10px;top:38px;min-height:32px;font-size:13px;padding:3px 10px;border-radius:999px;background:rgba(242,185,63,.92);color:var(--gold-ink);border-color:#a8771a;font-family:var(--body);font-weight:700}
.starchip{cursor:pointer;color:var(--gold);font-family:var(--body)}
#views{position:absolute;z-index:2;right:8px;top:8px;display:flex;gap:4px}
#views button{min-width:50px;padding:4px 7px;font-size:14px;background:rgba(34,27,68,.82)}
#toast{position:absolute;z-index:3;left:50%;top:42%;transform:translate(-50%,-50%);background:rgba(18,14,40,.92);border:1px solid var(--ember);border-radius:14px;padding:10px 16px;font-weight:700;text-align:center;pointer-events:none}
#fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
#cap{flex:none;display:flex;align-items:center;gap:10px;min-height:50px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 12px}
#say{flex:1;font-weight:700;font-size:clamp(15px,2vw,17px);line-height:1.3;text-wrap:balance}
#say:empty::before{content:"Drag the picture to turn it.";color:var(--soft);font-weight:600}
.side{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column;gap:8px}
@media (min-width:1000px) and (orientation:landscape){
  .main{flex-direction:row}
  .left{flex:1.5}
  #stage{max-height:calc(100vh - 190px);max-height:calc(100dvh - 190px)}
  .side{flex:1;min-width:330px}
}
/* small phones: an ordinary scrolling page */
@media (max-width:560px),(max-height:620px){
  body{overflow:auto;height:auto} html{height:auto}
  .app{height:auto} .main{display:flex;flex-direction:column} #stage{aspect-ratio:1/1;max-height:none} #panel{min-height:300px}
  #views{flex-wrap:wrap;justify-content:flex-end;max-width:60%} #views button{min-width:44px;padding:4px 5px;font-size:13px} .tile{width:112px} .grid.three{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){h1{display:none}}

/* tray and panel */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px 12px;display:flex;flex-direction:column;gap:6px}
#tray{flex:none}
#panel{flex:1;min-height:0;padding:0;gap:0;overflow:hidden}
#pbody{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
#pfoot{flex:none;padding:8px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
#pfoot:empty{display:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row .sp{flex:1}
.note{color:var(--soft);font-size:14px}
.tiles{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.tile{flex:none;width:128px;min-height:62px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;font-family:var(--body);font-weight:700;font-size:13px;line-height:1.15;padding:7px;scroll-snap-align:start}
.tile .sw{width:100%;height:14px;border-radius:5px;border:1px solid rgba(255,255,255,.3)}
.tile[aria-pressed="true"]{outline:3px solid var(--gold);outline-offset:1px;background:var(--panel2);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid button{text-align:left;display:flex;gap:8px;align-items:center;line-height:1.2}
.grid button small{display:block;font-family:var(--body);font-weight:600;font-size:12.5px;opacity:.85}
.say{font-size:17px;font-weight:700;line-height:1.35}
.pray{background:var(--panel2);border-left:4px solid var(--pearl);border-radius:8px;padding:8px 12px;font-size:17px;font-weight:600}
.mortar{background:var(--panel2);border-left:4px solid #e8e2d0;border-radius:8px;padding:6px 12px;font-size:15px}
.step{display:flex;flex-direction:column;gap:6px}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
input[type=text],input[type=password]{font:inherit;font-size:18px;color:var(--ink);background:var(--night);border:1px solid var(--line);border-radius:10px;min-height:48px;padding:0 12px;width:100%}

/* grown-up tools: a separate sheet behind a PIN */
#toolsWrap{position:fixed;inset:0;z-index:15;background:var(--night);overflow-y:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 30px max(16px,env(safe-area-inset-left,0px))}
#toolsWrap .head{display:flex;align-items:center;gap:10px;max-width:1240px;margin:0 auto 12px}
.tools{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));max-width:1240px;margin:0 auto}
select{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:0 10px}
.wc{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;font-size:14px}
.wc .nums{display:flex;gap:4px}
.wc .nums button{min-width:44px;padding:4px}
.tag3{font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;margin-left:6px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
#out{white-space:pre-wrap;font-size:14px;color:var(--ink);background:var(--night);border-radius:10px;padding:8px 10px;min-height:2.6em}
label.tog{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
label.tog input{width:22px;height:22px;accent-color:var(--gold)}

/* in-page confirm */
#modal{position:fixed;inset:0;z-index:20;background:rgba(8,5,24,.72);display:flex;align-items:center;justify-content:center;padding:20px}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <div class="bar" id="bar">
    <h1>Build on the Rock</h1>
    <div class="seg" role="group" aria-label="Whose turn" id="kids"></div>
    <span class="chip" id="dayChip"></span>
    <span class="chip" id="fireChip"><span class="candle" id="candle" aria-hidden="true"></span><span id="fireTxt"></span></span>
    <span class="chip" id="cityChip"></span>
    <button type="button" class="chip starchip" id="stars" title="Stars to spend"></button>
    <span class="sp"></span>
    <button type="button" id="mute" class="quiet" aria-pressed="false">Sound on</button>
    <button type="button" id="grown" class="quiet">Grown-ups</button>
  </div>
  <div id="plan" hidden></div>
  <div class="main">
    <div class="left">
      <div id="stage">
        <canvas id="c" aria-label="A block house on a small island, built on a foundation stone carved Jesus Christ. Drag to turn it."></canvas>
        <span id="tag"></span>
        <button type="button" id="goal" hidden title="This building's goal. Tap to change it."></button>
        <div id="views" role="group" aria-label="Turn the picture">
          <button type="button" data-view="left">Left</button><button type="button" data-view="front">Front</button><button type="button" data-view="right">Right</button><button type="button" data-view="centre">Centre</button><button type="button" data-view="city">City</button>
        </div>
        <div id="toast" hidden role="status"></div>
        <div id="fallback" hidden>This picture needs 3D graphics, which this browser has switched off. The buttons still work.</div>
      </div>
      <div id="cap"><p id="say" aria-live="polite"></p><button type="button" id="undo" hidden>Undo</button></div>
    </div>
    <div class="side">
      <section class="card" id="tray" aria-label="Pieces to build with"></section>
      <section class="card" id="panel"><div id="pbody"></div><div id="pfoot"></div></section>
    </div>
  </div>
</div>
<div id="toolsWrap" hidden>
  <div class="head"><h2>Grown-up tools</h2><span style="flex:1"></span><button type="button" id="toolsClose" class="big" style="width:auto">Close</button></div>
  <div class="tools" id="toolsBody"></div>
</div>
<div id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTxt"><div class="box"><p class="say" id="modalTxt"></p><input id="modalIn" hidden><div class="row"><button type="button" id="modalNo">No, go back</button><button type="button" id="modalAlt" class="link" hidden></button><span class="sp"></span><button type="button" id="modalYes" class="big" style="width:auto"></button></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="rules.js"></script>
<script src="content.js"></script>
<script>
(function(){
'use strict';
/* ================= 1. small helpers ================= */
const R=window.RockRules,RC=window.RockContent||{};
const $=function(id){return document.getElementById(id)};
if(!R){$('fallback').hidden=false;$('fallback').textContent='The game rules (rules.js) did not load.';return}
function h(tag,attrs,kids){const e=document.createElement(tag);
  if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;
    if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else if(k==='style')e.style.cssText=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?'':v)}
  (kids||[]).forEach(function(c){if(c!=null)e.appendChild(typeof c==='string'?document.createTextNode(c):c)});return e}
function btn(label,fn,cls,extra){const a={type:'button',class:cls||null,onclick:fn};if(extra)for(const k in extra)a[k]=extra[k];return h('button',a,typeof label==='string'?[label]:label)}
function rnd(a,b){return a+Math.random()*(b-a)}
function rint(n){return Math.floor(Math.random()*n)}
function cap1(s){s=String(s||'');return s.charAt(0).toUpperCase()+s.slice(1)}
const WEEK=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const AGES=[6,8,12],WALLS=R.CONFIG.wallOrder;
const WALLNAME={front:'front wall',left:'left wall',right:'right wall',free:'decorations'};

/* ================= 2. content adapter: every word comes from content.js where it has one ================= */
function get(){for(let i=0;i<arguments.length;i++){let o=RC;const p=arguments[i].split('.');for(let j=0;j<p.length&&o!=null;j++)o=o[p[j]];if(o!=null)return o}return null}
function forAge(v,age){if(v&&typeof v==='object'&&!Array.isArray(v)){const k=String(age);if(v[k]!=null)return v[k]}return v}
function txt(v,age,vars){v=forAge(v,age);if(Array.isArray(v))v=v.length?v[rint(v.length)]:'';
  if(v&&typeof v==='object')v=v.say||v.line||v.text||v.label||v.tip||'';
  v=String(v==null?'':v);return fill(v,vars)}
function fill(t,vars){const base={name:'',sibling:'your brother or sister',friend:'them'};for(const k in (vars||{}))if(vars[k]!=null&&vars[k]!=='')base[k]=vars[k];
  t=String(t).replace(/\{name\},\s*(\w)/g,function(m,c){return base.name?base.name+', '+c:c.toUpperCase()});
  return t.replace(/\{(\w+)\}/g,function(m,k){return base[k]!=null?String(base[k]):m})}
function byId(list,id){for(let i=0;i<(list||[]).length;i++)if(list[i]&&list[i].id===id)return list[i];return null}
/* ONE LOOKUP TABLE: fruit name -> gem. content.js and rules.js use different letter codes, so nothing is ever matched by code.
   Nine colours chosen to stand apart from each other and from gold (amber) and straw (dull thatch). */
const GEMRGB={love:[215,35,55],joy:[245,125,30],peace:[40,100,230],patience:[20,180,165],kindness:[40,170,80],goodness:[205,228,60],faithfulness:[125,85,225],gentleness:[250,150,195],'self-control':[120,38,120]};
const NAME2CODE={};Object.keys(R.CONFIG.gems).forEach(function(k){NAME2CODE[R.CONFIG.gems[k]]=k});
const FRUITS=(function(){const src=RC.fruits||{},list=Array.isArray(src)?src:(RC.fruitOrder||Object.keys(src)).map(function(k){return src[k]}).filter(Boolean);
  const out=list.map(function(f){const name=f.fruit||f.name||'';return{code:NAME2CODE[name.toLowerCase()],ccode:f.code||f.id,name:name,raw:f}}).filter(function(f){return f.code});
  if(!out.length)Object.keys(R.CONFIG.gems).forEach(function(k){out.push({code:k,ccode:k,name:cap1(R.CONFIG.gems[k]),raw:{}})});return out})();
const FRUIT={},CFRUIT={};FRUITS.forEach(function(f){FRUIT[f.code]=f;CFRUIT[f.ccode]=f});
function isGem(t){return !!R.CONFIG.gems[t]}
function css(t){if(isGem(t)){const c=GEMRGB[R.CONFIG.gems[t]];return 'rgb('+c.join(',')+')'}return {G:'#ecaa28',S:'#d0daec',W:'repeating-linear-gradient(0deg,#6f6a3c 0 3px,#4d4a2a 3px 5px)',P:'#f8eef4',L:'#ffd58a'}[t]||'#999'}
const CT={
  hard:function(age){return forAge(get('hardMoments','morningPlan.hardMoments'),age)||[]},
  resp:function(age){return forAge(get('responses','morningPlan.responses'),age)||[]},
  strawCards:function(){return get('strawCards','straw.ownUpCards')||[]},
  feelings:function(){return get('stopAndPray.feelings')||[]},
  tips:function(){return get('parentCoach','parentTips')||[]},
  praise:function(f,act){let p=null;try{if(act&&act.id&&typeof RC.praiseForAct==='function')p=RC.praiseForAct(act.id)}catch(e){}
    if(!p&&act&&f.raw.praiseFor)p=f.raw.praiseFor[act.id];return fill(p||txt(f.raw.praise,6)||f.name)},
  /* fire words: age 6 uses fireWords, 8 and 12 use fireWordsOlder when it has the line */
  fire:function(key,age){let v=age===6?null:forAge(get('fireWordsOlder.'+key),age);if(v==null||typeof v==='object')v=get('fireWords.'+key);return txt(v,age)},
  seedOnly:function(age){return txt(get('gospel.seedOnly'),age)||'Another seed is planted. You planted. God makes it grow.'},
  lampLine:function(){return get('gospel.lamp.line')||''},
  neighbour:function(age){return txt(get('gospel.newBuilder','gospel.neighbour'),age)||'Someone began to build on Jesus. Look, a new builder next door.'},
  prayed:function(age){return txt(get('gospel.prayed'),age)||'Each time you pray for them, their house gains a stone.'}
};
function weekly(){const w=get('weeklyCheck'),g=get('growthCheck')||{};
  const items=((w&&w.items)||g.items||[]).map(function(i,n){return{id:i.id||('i'+n),ask:i.ask||i.q||i.label||i.text||String(i),better:i.better||'higher'}});
  const me=w&&w.parentItem?{id:w.parentItem.id||'me',ask:w.parentItem.ask,better:w.parentItem.better||'higher',me:true}:null;
  const scale=((w&&w.scale)||g.scale||[]).slice(0,4).map(function(s){return typeof s==='string'?s:s.label});
  return{intro:(w&&w.intro)||g.intro||'',look:(w&&w.lookBack)||g.lookBack||'',items:items,me:me,scale:scale,how:(w&&(w.howToRead||w.notes))||(g.parentView&&g.parentView.shows)||[],
    labels:(g.parentView&&g.parentView.labels)||{growing:'Growing',steady:'Steady',harder:'Harder lately'},never:(w&&w.neverShow)||''}}

/* ================= 3. saved state: one RockRules state per pretend child ================= */
/* per child: s = the rules state; x = today only (cleared each morning); p = page things that last (names on seeds, tomorrow's plan) */
/* this round's rules switches: real blueprint shapes, and a bale only comes out once it has been made right in real life */
R.CONFIG.shapes.enabled=true;R.CONFIG.pullNeedsMadeRight=true;
const KEY='rock-play-v3';let DB=null;
function newX(){return{phase:'morning',night:'account',acct:0,plan:null,planUsed:null,talked:null,goldGiven:false,stopPray:false,frameDown:false,fireWords:'',ended:false,sealN:null}}
function fresh(age){const s=R.newChild({name:'',age:age});R.startDay(s,1);return{s:s,x:newX(),p:{tryTomorrow:null,seedNames:{},lamps:{},plots:{},dared:{},dark:false}}}
function load(){try{DB=JSON.parse(localStorage.getItem(KEY))}catch(e){DB=null}
  if(!DB||typeof DB!=='object'||!DB.kids)DB={cur:6,kids:{},weekly:{},mute:false,speak:false,tip:0,pin:null,month:1,autoPull:false};
  if(!DB.weekly)DB.weekly={};if(AGES.indexOf(DB.cur)<0)DB.cur=6;if(!DB.month)DB.month=1;
  AGES.forEach(function(a){const k=DB.kids[a];if(!k||!k.s||!k.s.walls||!k.s.today||!k.s.bp||!k.s.bp.walls||!k.x||!k.p)DB.kids[a]=fresh(a)})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
function K(){return DB.kids[DB.cur]}function st(){return K().s}function X(){return K().x}
function age(){return st().profile.age}
function band(){const a=age();return a<=6?6:a<=9?8:12}
load();

/* ================= 4. sound (made in the browser, only after the first tap) and read-aloud ================= */
let AC=null,tapped=false;
function tone(f,at,d,type,vol,f2){const t=AC.currentTime+at,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);

  let words=CT.fire(ev.size==='caveIn'?'caveIn':ev.size==='wallFall'?'wallFalls':ev.size==='small'?'small':'stoodFirm',a);
  if(ev.practice)words=(CW.practiceFire||'This first fire is practice.')+' '+words;   /* nothing but straw is lost at a first fire */
  if(of('spireFall').length){sfx('fall');await S.spireFall();words+=' '+(SW.falls||'The spire came down. The stones are safe.')}
  if(ev.windowsLost>0){k.p.dark=true;words+=' '+(WW.dark||'A window has gone dark. Lay the stone again and the light comes back.')}
  if(ev.mercy&&of('burn').length)words+=' No wall could fall tonight. You are rebuilding.';
  for(const e of of('mend')){S.mendGlow(e.wall);sfx('pearl');words+=' The '+WALLNAME[e.wall]+' stood through the fire, so it is not cracked any more.'}
  if(of('crown').length){sfx('gem');await S.crown()}
  const sealEv=of('seal')[0];
  if(sealEv){const rec=sealEv.building;say(words);sfx('seal');await S.seal();words=CT.fire('sealed',a);
    if(rec.spireDone)words=(SW.stands||'The spire stands.')+' '+words;
    if(rec.commission&&rec.commission.done){const g=byId(get('commissions.goals')||[],GOALWORD[rec.commission.id]);if(g&&g.done)words=g.done+' '+words}
    words+=' \u2605 '+rec.stars+(rec.stars===1?' star.':' stars.');
    x.night='plot';x.sealN=rec.n;k.p.dark=false}   /* next: the child chooses where it stands */
  else await S.wait(700);
  ui.busy=false;x.fireWords=words;redraw();say(words)}

/* ================= 8. grown-up tools (behind a PIN): pretend days, jump ahead, the weekly check, the month ================= */
const TEMPER={rough:{straw:{6:2.5,8:2.0,12:1.5},repair:0.5,lastLook:0.5,silver:0.6},typical:{straw:{6:1.0,8:0.8,12:0.5},repair:0.7,lastLook:0.75,silver:0.75},steady:{straw:{6:0.4,8:0.25,12:0.14},repair:0.9,lastLook:0.95,silver:0.9}};
function poisson(mean){const L=Math.exp(-mean);let k=0,p=1;do{k++;p*=Math.random()}while(p>L);return k-1}
function strawSpots(s,wall){const out=[];(wall?[wall]:WALLS).forEach(function(w){s.walls[w].forEach(function(col,c){col.forEach(function(p,r){if(p&&p.t==='W')out.push({wall:w,col:c,row:r})})})});return out}
function pullOne(s,q){R.forgive(s,q.wall,q.col,q.row);R.markMadeRight(s,q.wall,q.col,q.row,'pretend');return R.pull(s,q.wall,q.col,q.row).ok}
function strawMeta(){const cards=CT.strawCards(),c=cards[rint(cards.length)]||{label:'Straw'};return{label:c.label,card:c.id,kind:c.kind,did:c.did,sibling:!!c.sibling}}
function gemMeta(f){const acts=f.raw.acts||[],a=acts[rint(acts.length)];return{label:f.name+(a?': '+a.label:'')}}
function auto(s){return lampsAside(s,function(){return R.autoPlace(s)})}
/* one pretend day up to (not including) the fire. Returns one plain line about what happened. */
function simDay(k,temper){const s=k.s,x=k.x,a=s.profile.age<=6?6:s.profile.age<=9?8:12,Tm=TEMPER[temper];let n,i,got=0,straw=0,fixed=0;const mine=[];
  if(!x.plan){const f=FRUITS[rint(FRUITS.length)],hm=hardFor(f.code,a),q=hm[rint(hm.length)]||{},w=willsFor(q,a)[0]||{};x.plan={fruit:f.code,hard:q.id,when:q.when||'',will:w.will||''}}
  n=poisson(Tm.straw[a]);for(i=0;i<n;i++){const r=R.addPiece(s,'W',strawMeta());if(r.ok){straw++;mine.push(r.piece.id)}}
  n=poisson(2);for(i=0;i<n;i++){const f=FRUITS[rint(FRUITS.length)];if(R.addPiece(s,f.code,gemMeta(f)).ok)got++}
  for(i=0;i<2;i++)if(Math.random()<Tm.silver&&R.addPiece(s,'S',{label:(get('silver.name')||'Silver')+': '+((get('silver.acts')||[])[i]||{label:''}).label}).ok)got++;
  if(Math.random()<0.95&&R.addPiece(s,'G',{label:(get('gold.name')||'Gold')+': '+(get('gold.meaning')||'')}).ok){got++;x.goldGiven=true}
  if(Math.random()<0.4){x.planUsed='used';const f=FRUIT[x.plan.fruit];if(R.addPiece(s,f.code,{label:f.name+': used my plan'}).ok)got++}
  if(Math.random()<0.06)R.addGospelShare(s,{label:'Lamp'});
  s.neighbours.forEach(function(nb){if(Math.random()<0.5)R.prayFor(s,nb.id)});
  /* a goal for the building, gems laid where they finish a window (steady children do this most), and sometimes the spire dare */
  if(R.CONFIG.commissions.enabled&&!s.build.commission){const ch=R.commissionChoices(s,Math.random);if(ch.length)R.chooseCommission(s,ch[rint(ch.length)].id)}
  const care={rough:0.2,typical:0.5,steady:0.85}[temper],dare={rough:0.1,typical:0.3,steady:0.7}[temper];
  for(i=s.tray.length-1;i>=0;i--){const pc=s.tray[i];if(!pc||!isGem(pc.t)||Math.random()>care)continue;const hints=windowHints(s,pc,R.legalSlots(s)),keys=Object.keys(hints);if(!keys.length)continue;
    const q=(keys.filter(function(kk){return hints[kk]==='pure'})[0]||keys[0]).split(':');R.place(s,i,q[0],+q[1],+q[2])}
  if(Math.random()<dare&&!strawSpots(s).length){const sl=R.spireSlots(s),gi=s.tray.findIndex(function(pp){return isGem(pp.t)});if(sl.length&&gi>=0){R.place(s,gi,'spire',sl[0].col,0);(k.p.dared||(k.p.dared={}))[s.sealed]=true}}
  auto(s);
  strawSpots(s).forEach(function(q){const pc=R.at(s,q.wall,q.col,q.row);if(pc&&mine.indexOf(pc.id)>=0&&Math.random()<Tm.repair&&pullOne(s,q))fixed++});auto(s);   /* only today's straw gets its chance today, as in sim.js */
  if(R.isComplete(s)&&strawSpots(s).length&&Math.random()<Tm.lastLook){strawSpots(s).sort(function(p,q){return q.row-p.row}).forEach(function(q){if(pullOne(s,q))fixed++});auto(s)}
  if(!R.isFireNight(s))R.callFire(s);
  if(R.isFireNight(s)){const fallAt=R.summary(s).fallAt;WALLS.forEach(function(w){const sp=strawSpots(s,w);if(sp.length>=fallAt&&Math.random()<Tm.lastLook)while(sp.length>=fallAt&&pullOne(s,sp.pop()))fixed++})}
  return got+' good '+(got===1?'piece':'pieces')+', '+straw+' straw, '+fixed+' put right.'}
function temperNow(){const e=$('temper');if(e&&TEMPER[e.value])ui.temper=e.value;return ui.temper}   /* read at the moment of the tap */
function busyNote(){if(ui.busy)out('Wait for the fire to finish, then tap again.');return ui.busy}
function pretendDay(){if(busyNote())return;clearUndo();const k=K(),temper=temperNow();if(k.x.phase==='night'&&k.x.night!=='account')nextDay(k);
  const line=simDay(k,temper);ui.sel=null;ui.sheet=null;k.x.phase='night';
  if(R.isFireNight(k.s)){k.x.night='lastlook';out(WEEK[k.s.weekday]+' ('+temper+'): '+line+' It is fire night. Close the tools to watch.');redraw();hideTools();runFire()}
  else{k.x.night='sleep';k.x.fireWords=txt(get('nightAccount.goodnight'),band());out(WEEK[k.s.weekday]+' ('+temper+'): '+line+' No fire tonight.');redraw()}}
function pretendMany(days){if(busyNote())return;clearUndo();const k=K(),temper=temperNow(),b=JSON.parse(JSON.stringify(k.s.stats)),city0=k.s.city.length;let dark=0;
  if(k.x.phase==='night'&&k.x.night!=='account')nextDay(k);
  for(let d=0;d<days;d++){simDay(k,temper);if(R.isFireNight(k.s)){const ev=R.fire(k.s);dark+=ev.windowsLost||0}nextDay(k)}
  const z=k.s.stats,sm=R.summary(k.s),built=k.s.city.slice(city0),met=built.filter(function(r){return r.commission&&r.commission.done}).length,spires=built.filter(function(r){return r.spireDone}).length;
  ui.sel=null;ui.sheet=null;ui.m=null;say('');
  out('Run '+(++ui.runs)+': '+days+' pretend days, '+temper+' child, age '+k.s.profile.age+' (days '+(k.s.day-days)+' to '+(k.s.day-1)+')\nBuildings sealed into the City: '+built.length+(built.length?' ('+built.map(function(r){return r.name}).join(', ')+')':'')+
    '\nFires: '+(z.fires-b.fires)+' in all\n  clean (no straw at all): '+(z.clean-b.clean)+'\n  small (holes and a stone or two): '+(z.small-b.small)+'\n  wall fall: '+(z.wallFalls-b.wallFalls)+'\n  cave-in: '+(z.caveIns-b.caveIns)+
    '\nWindows that went dark: '+dark+'\nSpire: stood at a seal '+spires+', fell '+((z.spireFalls||0)-(b.spireFalls||0))+'\nGoals met: '+met+' of '+built.length+'\nStars earned: '+(z.stars-b.stars)+' (\u2605 '+sm.starBalance+' to spend)\n'+
    (z.strawLaid-b.strawLaid)+' straw laid, '+(z.pearls-b.pearls)+' put right, '+(z.strawBurned-b.strawBurned)+' burned\nNow on '+k.s.bp.name+' ('+R.tally(k.s).total+' wall spaces)'+(sm.mortar?', with extra mortar':'')+'. Streets: '+sm.streets+'.');
  redraw()}
function toFireNight(step){const k=K();let guard=0;if(k.x.phase==='night'&&k.s.today.fired)nextDay(k);while(!R.isFireNight(k.s)&&guard++<8)nextDay(k);
  if(!k.x.plan){const f=FRUITS[0],q=hardFor(f.code,band())[0]||{},w=willsFor(q,band())[0]||{};k.x.plan={fruit:f.code,hard:q.id,when:q.when||'',will:w.will||''}}
  k.x.phase='night';k.x.night=step||'account';k.x.acct=0;k.x.sealN=null;ui.sel=null;ui.sheet=null;ui.m=null}
/* "Show me": sets up a real situation through the rules (several quiet days if the daily limits need it), then stops at Last look */
function showMe(kind){if(busyNote())return;clearUndo();const k=K(),s=k.s;let guard=0;
  function fallAt(){return R.summary(s).fallAt}
  function quiet(){nextDay(k)}
  function most(){return Math.max.apply(null,WALLS.map(function(w){return R.tally(s,w).straw}))}
  function stones(n){for(let i=0;i<n;i++){const f=FRUITS[rint(FRUITS.length)];R.addPiece(s,f.code,gemMeta(f))}R.addPiece(s,'G',{label:'Gold: time with God'});R.addPiece(s,'S',{label:'Silver: faithful work'});auto(s)}
  function strawTo(n){guard=0;while(most()<n&&guard++<40){if(!R.addPiece(s,'W',strawMeta()).ok)quiet()}}
  if(s.today.fired)quiet();
  if(kind!=='small'&&kind!=='seal'&&R.summary(s).practiceNext){stones(2);strawTo(1);R.fire(s);quiet()}   /* a new child's first fire is only practice, so that one happens quietly first */
  if(kind==='small'){stones(4);if(most()<1)strawTo(1);stones(3);if(most()>=fallAt())out('This building already has a leaning wall, so the fire will be bigger than small.');else out('One straw bale is in a wall. Light the fire to see a small fire.')}
  if(kind==='wall'){stones(4);strawTo(fallAt());stones(2);out('One wall has enough straw to fall.')}
  if(kind==='cave'){const cracked=WALLS.some(function(w){return s.cracked[w]>0});
    if(!cracked){stones(4);strawTo(fallAt());R.fire(s);quiet()}   /* first fall happens quietly, leaving a cracked wall */
    stones(2);strawTo(fallAt());
    out(R.forecast(s).caveIn?'One wall fell at an earlier fire and is still cracked. Now another has too much straw.':'The rules are being merciful just now (after a cave-in there is a time of grace), so this one will only be a wall fall.')}
  if(kind==='seal'){guard=0;while(strawSpots(s).length&&guard++<60){strawSpots(s).forEach(function(q){pullOne(s,q)});if(strawSpots(s).length)quiet()}
    function spireOne(){const sl=R.spireSlots(s);if(!sl.length)return;const f=FRUITS[rint(FRUITS.length)],r=R.addPiece(s,f.code,gemMeta(f));if(r.ok)R.place(s,s.tray.length-1,'spire',sl[0].col,0)}   /* one spire gem a day, as the rules allow */
    guard=0;while((!R.isComplete(s)||R.summary(s).spire.filled<R.summary(s).spire.total)&&guard++<60){spireOne();stones(8);if(!R.isComplete(s)||R.summary(s).spire.filled<R.summary(s).spire.total)quiet()}
    (k.p.dared||(k.p.dared={}))[s.sealed]=true;R.callFire(s);out('The building is finished with no straw, and its spire is dared. Light the fire to see it sealed.')}
  toFireNight('lastlook');say(get('fireWords.lastLook')||'',true);redraw();hideTools()}
function out(t){ui.simOut=t;const o=$('out');if(o)o.textContent=t}
/* weekly check: growing / steady / harder for one item, from the last four checks (latest two against the two before) */
function trendOf(hist,it){const v=hist.slice(-4).map(function(c){return c.vals[it.id]}).filter(function(n){return n!=null});if(v.length<2)return null;
  const half=Math.ceil(v.length/2),avg=function(a){return a.reduce(function(p,q){return p+q},0)/a.length},d=(avg(v.slice(half))-avg(v.slice(0,half)))*(it.better==='lower'?-1:1);
  return d>0.4?'growing':d<-0.4?'harder':'steady'}
function drawTools(){const b=$('toolsBody'),W=weekly(),hist=DB.weekly[DB.cur]||[],tips=CT.tips(),fp=get('fadePlan')||[];b.textContent='';
  /* the month: how much the grown-ups prompt, read from content fadePlan */
  const months=fp.length?fp.map(function(m){return m.month}):[1,3,6,12],cur=fp.filter(function(m){return m.month===DB.month})[0]||stage();
  b.appendChild(h('div',{class:'card'},[h('h2',{text:'Which month are we in?'}),h('div',{class:'row'},months.map(function(mn){return btn('Month '+mn,function(){DB.month=mn;save();drawTools();drawAll()},null,{'aria-pressed':String(DB.month===mn)})})),
    cur&&cur.name?h('h3',{text:cur.name}):null,cur&&cur.message?h('p',{class:'pray',text:cur.message}):null,h('ul',{class:'plain note'},((cur&&cur.changes)||[]).map(function(c){return h('li',{text:c})})),
    h('p',{class:'note',text:'On this page the month switches the grown-up prompts on and off: calm practice, the lunch question and "tap only fruit that cost something" in the day panel, the child naming their own fruit first at night, writing their own hard moment, and the mentoring note for the eldest. '+((stage().flags||{}).weeklyNotDaily?'From this month the game is opened weekly, not daily: a note only, the page has no lock. ':'')+((stage().flags||{}).fireWeeklyForAll?'Fire nights should now be once a week for everyone: a note only, the rules have no switch for it. ':'Fire nights stay as the rules set them. ')+(get('fairness.mortar.parent')||'')})]));
  const sel=h('select',{id:'temper','aria-label':'What kind of day'},['rough','typical','steady'].map(function(t){return h('option',{value:t,text:cap1(t)+' child'})}));sel.value=ui.temper;sel.addEventListener('change',function(){ui.temper=sel.value});
  b.appendChild(h('div',{class:'card'},[h('h2',{text:'Pretend for me (Age '+DB.cur+')'}),h('div',{class:'row'},[sel,btn('Pretend a day for me',pretendDay),btn('Pretend 30 days',function(){pretendMany(30)}),btn('Pretend 90 days',function(){pretendMany(90)})]),
    h('div',{class:'row'},[btn('Jump to fire night',function(){if(busyNote())return;toFireNight('account');redraw();hideTools()})]),
    h('h3',{text:'Show me\u2026'}),h('div',{class:'row'},[btn('a small fire',function(){showMe('small')}),btn('a wall falling',function(){showMe('wall')}),btn('a cave-in',function(){showMe('cave')}),btn('a sealed building',function(){showMe('seal')})]),
    h('p',{id:'out',text:ui.simOut||'Results show here.'})]));
  /* weekly check: parent-only, 0 to 3 taps, the parent's own "Me" question, four-week labels, a small trend line */
  const rows=[],all=W.items.concat(W.me?[W.me]:[]);
  all.forEach(function(it){const tr=trendOf(hist,it);
    rows.push(h('span',null,[fill(it.ask,{name:'this child'}),tr?h('span',{class:'tag3',text:W.labels[tr]||tr}):null]));
    rows.push(h('span',{class:'nums'},[0,1,2,3].map(function(v){return btn(String(v),function(){ui.wc[it.id]=v;drawTools()},null,{'aria-pressed':String(ui.wc[it.id]===v),'aria-label':W.scale[v]||String(v)})})))});
  const score=function(c){let sum=0,n=0;W.items.forEach(function(it){const v=c.vals[it.id];if(v==null)return;sum+=it.better==='lower'?3-v:v;n++});return n?sum/n:0},pts=hist.map(score);
  const svg='<svg viewBox="0 0 200 50" width="200" height="50" role="img" aria-label="Trend of the weekly checks, higher is better"><line x1="0" y1="49" x2="200" y2="49" stroke="#463a78"/>'+
    (pts.length>1?'<polyline fill="none" stroke="#f2b93f" stroke-width="2.5" points="'+pts.map(function(v,i){return (10+i*(180/(pts.length-1))).toFixed(0)+','+(46-v/3*42).toFixed(1)}).join(' ')+'"/>':'')+
    pts.map(function(v,i){return '<circle r="3.5" fill="#f2b93f" cx="'+(pts.length>1?10+i*(180/(pts.length-1)):100).toFixed(0)+'" cy="'+(46-v/3*42).toFixed(1)+'"/>'}).join('')+'</svg>';
  const trend=h('div');trend.innerHTML=svg;
  /* gentle flag: lots of gems since four checks ago, but the line is flat */
  let flag=null;if(hist.length>=4){const l4=hist.slice(-4),flat=Math.abs((score(l4[2])+score(l4[3]))/2-(score(l4[0])+score(l4[1]))/2)<0.2,gems=gemCount(st())-(l4[0].gems||0);
    if(flat&&gems>=12)flag=h('p',{class:'mortar',text:'A gentle flag: '+gems+' gems since four checks ago, but the line is flat. '+((W.how||[])[5]||'Tap less, talk more.')})}
  b.appendChild(h('div',{class:'card'},[h('h2',{text:'Weekly check (parents only, Age '+DB.cur+')'}),h('p',{class:'note',text:W.intro+' '+W.look+' '+W.never}),
    h('p',{class:'note',text:W.scale.map(function(s,i){return i+' = '+s}).join(' \u00b7 ')}),h('div',{class:'wc'},rows),
    h('div',{class:'row'},[btn('Save this check',function(){if(!Object.keys(ui.wc).length)return;(DB.weekly[DB.cur]||(DB.weekly[DB.cur]=[])).push({day:st().day,vals:ui.wc,gems:gemCount(st())});ui.wc={};save();drawTools()}),h('span',{class:'note',text:hist.length+' saved. Up is better.'})]),
    trend,flag,h('ul',{class:'plain note'},(W.how||[]).map(function(t){return h('li',{text:typeof t==='string'?t:(t.text||t.label||'')})}))]));
  const tog=h('input',{type:'checkbox',checked:DB.speak||null,onchange:function(e){DB.speak=e.target.checked;save();if(DB.speak)speak($('say').textContent);else try{window.speechSynthesis.cancel()}catch(_){}}});
  const ap=h('input',{type:'checkbox',checked:DB.autoPull||null,onchange:function(e){DB.autoPull=e.target.checked;save();drawPanel()}});
  b.appendChild(h('div',{class:'card'},[h('h2',{text:'Settings and a tip'}),h('label',{class:'tog'},[tog,'Read the words aloud']),h('label',{class:'tog'},[ap,'Show "Pull it out for me" (for a child who cannot drag)']),
    h('p',{class:'pray',text:tips.length?txt(tips[DB.tip%tips.length]):''}),btn('Another tip',function(){DB.tip++;save();drawTools()},'quiet'),
    h('div',{class:'row'},[btn('Start Age '+DB.cur+' again',startAgain),btn('Change the PIN',function(){DB.pin=null;save();hideTools();openTools()},'quiet')])]))}
function startAgain(){if(busyNote())return;confirmBox('Start Age '+DB.cur+' again from an empty foundation? Everything this pretend child has built will go.','Yes, start again',function(){
  DB.kids[DB.cur]=fresh(DB.cur);ui.sel=null;ui.sheet=null;ui.m=null;clearUndo();say('');redraw();out('Age '+DB.cur+' has started again.')})}
function showTools(){drawTools();$('toolsWrap').hidden=false;$('toolsWrap').scrollTop=0}
function hideTools(){$('toolsWrap').hidden=true}
function openTools(){
  if(!DB.pin){confirmBox('Grown-ups: choose a 4-digit PIN. It keeps the pretend runs, the weekly check and Start again away from the children.','Set the PIN',function(v){
    if(!/^\d{4}$/.test(v)){toast('Four numbers, please.');openTools();return}DB.pin=v;save();showTools()},{input:'pin'});return}
  confirmBox('Grown-up PIN','Open',function(v){if(v!==DB.pin){toast('That is not the PIN.');sfx('no');return}showTools()},{input:'pin',alt:{label:'Forgot it',fn:function(){
    const n1=6+rint(4),n2=6+rint(4);   /* a sum only a grown-up will know quickly */
    confirmBox('Forgot the PIN? First a sum for grown-ups: what is '+n1+' x '+n2+'? Then the PIN, the weekly checks and the month setting are cleared. The children\'s buildings are kept.','Clear the tools',function(ans){
      if(Number(ans)!==n1*n2){toast('That is not the answer.');sfx('no');return}DB.pin=null;DB.weekly={};DB.month=1;DB.autoPull=false;save();openTools()},{input:'sum'})}}})}

/* ================= 9. start ================= */
$('mute').addEventListener('click',function(){DB.mute=!DB.mute;drawBar();save();sfx('tap')});
$('grown').addEventListener('click',openTools);
$('stars').addEventListener('click',function(){openSheet({kind:'decorate'})});
$('goal').addEventListener('click',function(){openSheet({kind:'goal'})});
$('toolsClose').addEventListener('click',hideTools);
Array.prototype.forEach.call($('views').children,function(v){v.addEventListener('click',function(){sfx('tap');S.turnTo(v.getAttribute('data-view'))})});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('modal').hidden)$('modal').hidden=true});
/* a leaning wall creaks now and then */
setInterval(function(){if(ui.busy||document.hidden)return;const w=R.wobble(st());if(WALLS.some(function(q){return w[q]>=2}))sfx('creak')},5200);
DB.tip=(DB.tip||0)+1;
window.RockPlay={state:st,extra:X,kid:K,scene:S,redraw:redraw,db:function(){return DB},hints:windowHints};   /* handy for checking by hand in the console */
redraw();
})();
