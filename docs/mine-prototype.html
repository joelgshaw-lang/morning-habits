<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Mine and the Temple</title>
<!-- Design prototype for "The Mine and the Temple" (1 Corinthians 3). Not wired into the app yet.
     Kids tap "I did something good" or "I need to say sorry". A grown-up rates it 1–5 (press and hold).
     Good things hide their own gem next to the mole, plus pickaxe swings to dig it out. Sorry things put wobbly props
     into the tunnels. The weekly fire (grown-ups only) burns them and those tunnels cave in. Each child has their own mine. -->
<style>
  :root { --ink: #1f2430; --muted: #5b6170; --bg: #fff8ee; --shadow: 0 6px 0 rgba(0,0,0,.1), 0 12px 30px rgba(0,0,0,.12); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #2a1d14; color: var(--ink); overflow: hidden;
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  .stage { position: fixed; inset: 0; }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: manipulation; }

  /* top bar */
  .top { position: absolute; top: 12px; left: 12px; right: 12px; z-index: 3; display: flex; gap: 10px; align-items: flex-start; pointer-events: none; }
  .top > * { pointer-events: auto; }
  .chip { background: rgba(255,255,255,.94); border-radius: 18px; padding: 8px 14px; font-weight: 900; font-size: 20px; box-shadow: 0 4px 0 rgba(0,0,0,.18); border: 0; font-family: inherit; color: var(--ink); }
  .chip small { display: block; font-size: 13px; font-weight: 700; color: var(--muted); }
  .who { display: flex; align-items: center; gap: 8px; min-height: 56px; }
  .who .av { font-size: 32px; }
  .picks { display: flex; align-items: center; gap: 2px; min-height: 56px; font-size: 24px; }
  .warnchip { background: #fde68a; color: #7c2d12; font-size: 16px; display: none; min-height: 56px; align-items: center; max-width: 330px; }
  .warnchip.show { display: flex; }
  .spacer { flex: 1; }
  .round { width: 60px; height: 60px; border-radius: 50%; font-size: 28px; display: grid; place-items: center; padding: 0; }

  /* bottom dock */
  .dock { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 3; display: flex; gap: 16px; }
  .dock button { border: 0; border-radius: 26px; min-height: 84px; padding: 0 28px; font: inherit; font-size: 26px; font-weight: 900; color: #fff;
    box-shadow: 0 7px 0 rgba(0,0,0,.25), 0 14px 30px rgba(0,0,0,.25); display: flex; align-items: center; gap: 12px; cursor: pointer; white-space: nowrap; }
  .dock button span { font-size: 38px; }
  .dock .good { background: linear-gradient(135deg, #22c55e, #15803d); }
  .dock .sorry { background: linear-gradient(135deg, #f472b6, #be185d); }
  .dock button:active { transform: translateY(4px); }

  .caption { position: absolute; left: 50%; bottom: 118px; transform: translateX(-50%); z-index: 3;
    background: rgba(20,14,8,.9); color: #fff; padding: 12px 24px; border-radius: 20px;
    font-size: 22px; font-weight: 800; max-width: 90%; text-align: center; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .caption.show { opacity: 1; }
  .caption.danger { background: rgba(160,20,10,.94); }
  .caption.joy { background: rgba(120,70,0,.94); }
  .caption.love { background: rgba(157,23,77,.94); }
  .caption em { display: block; font-size: 16px; font-weight: 600; opacity: .9; font-style: normal; }

  /* overlays */
  .ov { position: absolute; inset: 0; z-index: 6; display: none; align-items: center; justify-content: center; background: rgba(15,10,5,.6); }
  .ov.show { display: flex; }
  .sheet { background: #fffdf8; border-radius: 28px; padding: 20px 22px; width: min(860px, 94%); max-height: 92%; overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
  .sheet h3 { margin: 0 0 4px; font-size: 28px; }
  .sheet .sub { font-size: 15px; font-weight: 700; color: var(--muted); margin-bottom: 12px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .tile { border: 3px solid transparent; border-radius: 22px; min-height: 130px; padding: 10px 6px; font: inherit; font-size: 15px; font-weight: 800; line-height: 1.15;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,.08); }
  .tile .e { font-size: 46px; }
  .tile.g { background: #f0fdf4; } .tile.b { background: #fdf2f8; color: #831843; }
  .tile.sel { border-color: #f59e0b; transform: scale(1.04); }
  .tile.done { opacity: .45; }
  .tile small { font-size: 11px; color: var(--muted); }
  .row { display: flex; gap: 10px; margin-top: 14px; }
  .btn { flex: 1; border: 0; border-radius: 18px; min-height: 64px; font: inherit; font-size: 20px; font-weight: 900; cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,.12); }
  .btn.yes { background: #f59e0b; color: #fff; } .btn.no { background: #f3f4f6; }
  .btn:disabled { opacity: .4; }
  .grown { font-size: 14px; font-weight: 900; color: #6d28d9; margin-bottom: 2px; }
  .scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 12px 0 8px; }
  .hold { position: relative; overflow: hidden; border: 0; border-radius: 18px; min-height: 82px; font: inherit; font-size: 24px; font-weight: 900; cursor: pointer;
    background: #f3f4f6; box-shadow: 0 5px 0 rgba(0,0,0,.1); display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .hold small { font-size: 12px; color: var(--muted); }
  .hold::after { content: ""; position: absolute; inset: 0; background: rgba(245,158,11,.35); transform: scaleX(0); transform-origin: left; }
  .hold.holding::after { animation: fillx var(--hold, .8s) linear forwards; }
  @keyframes fillx { to { transform: scaleX(1); } }
  .ex { font-size: 14px; font-weight: 600; color: var(--muted); line-height: 1.5; }
  .ex b { color: var(--ink); }
  .kids { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .kid { border: 0; border-radius: 24px; min-height: 160px; font: inherit; font-size: 26px; font-weight: 900; cursor: pointer; background: #fff; box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .kid .av { font-size: 60px; }

  /* grown-ups drawer */
  .drawer { position: absolute; top: 0; right: 0; bottom: 0; width: 360px; z-index: 7; background: #fffdf8; box-shadow: -10px 0 40px rgba(0,0,0,.35);
    transform: translateX(110%); transition: transform .3s; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  .drawer.show { transform: none; }
  .drawer h2 { margin: 0; font-size: 22px; }
  .drawer h4 { margin: 6px 0 2px; font-size: 16px; }
  .drawer .line { font-size: 15px; font-weight: 800; }
  .drawer .red { color: #b91c1c; } .drawer .green { color: #15803d; }
  .drawer .note { font-size: 12px; font-weight: 600; color: var(--muted); }
  .drawer .hold { min-height: 60px; font-size: 18px; }
  .drawer .hold.fire { background: linear-gradient(135deg, #ff9a3c, #e8501b); color: #fff; }
  .drawer .hold.right { background: #fdf2f8; color: #9d174d; }
  .drawer .plain { border: 0; border-radius: 14px; min-height: 52px; font: inherit; font-size: 16px; font-weight: 800; background: #f3f4f6; cursor: pointer; }

  /* big jump-out reveal */
  .reveal { position: absolute; inset: 0; z-index: 8; display: none; align-items: center; justify-content: center; flex-direction: column; cursor: pointer; }
  .reveal.show { display: flex; }
  .reveal .dim { position: absolute; inset: 0; background: radial-gradient(circle, rgba(0,0,0,.2), rgba(0,0,0,.65)); animation: fadein .3s; }
  .reveal .rays { position: absolute; width: 560px; height: 560px; border-radius: 50%; background: repeating-conic-gradient(from 0deg, rgba(255,240,170,.55) 0 10deg, transparent 10deg 30deg);
    -webkit-mask: radial-gradient(circle, #000 20%, transparent 70%); mask: radial-gradient(circle, #000 20%, transparent 70%); animation: spin 6s linear infinite, fadein .4s; }
  .reveal svg.big { position: relative; width: 280px; height: 280px; overflow: visible; }
  .reveal .jump { animation: jump .9s cubic-bezier(.2,1.5,.4,1) both; transform-origin: center; }
  .reveal .spinny { animation: wobble 2.2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
  .reveal .label { position: relative; margin-top: 8px; color: #fff; text-align: center; font-weight: 900; font-size: 42px; text-shadow: 0 3px 10px rgba(0,0,0,.6); animation: rise .6s .35s both; padding: 0 20px; }
  .reveal .label small { display: block; font-size: 22px; font-weight: 800; }
  .reveal .hint { position: relative; margin-top: 12px; color: #fff; font-weight: 800; font-size: 18px; animation: rise .5s .9s both; }
  .reveal .spark { position: absolute; width: 16px; height: 16px; background: #fff; clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); animation: burst 1.1s ease-out forwards; }
  .reveal.soft .rays { display: none; }
  .reveal.soft .dim { background: radial-gradient(circle, rgba(80,10,40,.35), rgba(40,5,20,.7)); }
  @keyframes jump { 0% { transform: translate(var(--fx), var(--fy)) scale(.15) rotate(-40deg); opacity: 0; } 60% { opacity: 1; } 100% { transform: none; } }
  @keyframes wobble { 0%, 100% { transform: rotate(-6deg) scale(1); } 50% { transform: rotate(6deg) scale(1.06); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadein { from { opacity: 0; } }
  @keyframes rise { from { transform: translateY(20px); opacity: 0; } }
  @keyframes burst { 0% { transform: translate(0,0) scale(.3); opacity: 1; } 100% { transform: translate(var(--bx), var(--by)) scale(1.4) rotate(120deg); opacity: 0; } }

  /* svg animations */
  .shake { animation: shake .25s linear 2; transform-box: fill-box; transform-origin: center; }
  @keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
  .bigshake { animation: bigshake .35s linear; }
  @keyframes bigshake { 20% { transform: translate(-6px, 3px); } 40% { transform: translate(5px, -4px); } 60% { transform: translate(-4px, 2px); } 80% { transform: translate(3px, -2px); } }
  .bob { animation: bob 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes bob { 50% { transform: translateY(-4px); } }
  .beacon { animation: beacon 1.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes beacon { 0% { transform: scale(.6); opacity: 1; } 100% { transform: scale(1.6); opacity: 0; } }
  .arrow { animation: arrow .8s ease-in-out infinite; }
  @keyframes arrow { 50% { transform: translateY(-6px); } }
  .weak { animation: weak 1.4s ease-in-out infinite; }
  @keyframes weak { 50% { opacity: .35; } }
  .glint { animation: glint 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes glint { 0%, 70%, 100% { opacity: 0; transform: scale(.3); } 80% { opacity: 1; transform: scale(1.1); } }
  .shard { animation: shard .7s ease-out forwards; }
  @keyframes shard { to { transform: translate(var(--sx), var(--sy)) rotate(200deg); opacity: 0; } }
  .fly-up { animation: flyup 1s cubic-bezier(.5,0,.3,1) forwards; }
  @keyframes flyup { to { transform: translate(var(--tx), var(--ty)) scale(.6); opacity: .2; } }
  .plant { animation: plant 1.1s cubic-bezier(.4,0,.2,1) forwards; }
  @keyframes plant { 0% { transform: translate(0,0) scale(2.6); } 35% { transform: translate(0,-30px) scale(2.8); } 100% { transform: translate(var(--tx), var(--ty)) scale(.7); } }
  .fly-up { animation: flyup2 .95s cubic-bezier(.5,0,.3,1) forwards !important; }
  @keyframes flyup2 { 40% { transform: translate(calc(var(--tx) * .4), calc(var(--ty) * .4 - 60px)) scale(1.2); } 100% { transform: translate(var(--tx), var(--ty)) scale(.6); } }
  .flame { animation: flick .18s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center bottom; }
  @keyframes flick { from { transform: scale(.9, .85) skewX(-6deg); } to { transform: scale(1.05, 1.15) skewX(6deg); } }
  .char { animation: char .8s ease-in forwards; }
  @keyframes char { 30% { filter: brightness(2) sepia(1) saturate(5); } 100% { filter: brightness(.05); opacity: .2; } }
  .cavein { animation: cavein .9s cubic-bezier(.5,0,.8,.5) both; transform-box: fill-box; transform-origin: center top; }
  @keyframes cavein { from { transform: translateY(-50px); opacity: 0; } to { transform: none; opacity: 1; } }
  .dust { animation: dust 1.2s ease-out forwards; }
  @keyframes dust { to { transform: translate(var(--sx), var(--sy)) scale(2); opacity: 0; } }
  .loose { animation: loose .5s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
  @keyframes loose { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg) translateY(-1px); } }
  .tumble { animation: tumble 1.6s cubic-bezier(.5,0,.9,.5) forwards; }
  @keyframes tumble { to { transform: translate(var(--tx), var(--ty)) rotate(var(--rot)); opacity: .9; } }
  .wing { animation: flap .06s linear infinite alternate; transform-box: fill-box; transform-origin: center bottom; }
  @keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(.3); } }
  .refine { animation: refine 1.4s ease-out; }
  @keyframes refine { 40% { filter: brightness(1.8) saturate(1.4); } }
  .pin .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
  .pin .pad button { min-height: 66px; font-size: 28px; }
  .pin .dots { font-size: 34px; letter-spacing: 10px; text-align: center; min-height: 44px; }
  .rainbow { animation: rainbow 1.6s linear infinite; }
  @keyframes rainbow { to { filter: hue-rotate(360deg); } }
  .dance { animation: dance .4s ease-in-out 6; transform-box: fill-box; transform-origin: center bottom; }
  @keyframes dance { 50% { transform: translateY(-14px) scaleX(1.1); } }
  .confetti { position: absolute; top: -20px; width: 10px; height: 16px; z-index: 9; animation: fall var(--d, 2.6s) linear forwards; }
  @keyframes fall { to { transform: translate(var(--x), 110vh) rotate(720deg); } }
  .land { animation: land .22s ease-out; transform-box: fill-box; transform-origin: center; }
  @keyframes land { 0% { transform: scale(1.5); } 60% { transform: scale(.9); } 100% { transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .reveal .rays, .reveal .spinny, .glint, .beacon, .arrow, .weak, .loose, .bob, .wing { animation: none !important; }
  }
  @media (max-width: 760px) { .grid { grid-template-columns: repeat(3, 1fr); } .dock button { font-size: 20px; padding: 0 16px; } }
</style>
</head>
<body>
<div class="stage" id="stage">
  <svg id="scene" viewBox="0 0 800 760" preserveAspectRatio="xMidYMid meet" aria-label="Temple on a hill above a gem mine"></svg>

  <div class="top">
    <button class="chip who" id="whoChip"></button>
    <div class="chip picks" id="picks"></div>
    <div class="chip warnchip" id="warn"></div>
    <div class="spacer"></div>
    <button class="chip round" id="lookBtn" aria-label="Look at the temple">🏛</button>
    <button class="chip round" id="speakBtn" aria-label="Read aloud">🔈</button>
    <button class="chip round" id="grownBtn" aria-label="Grown-ups">👨‍👩‍👧</button>
  </div>

  <div class="dock">
    <button class="good" id="goodBtn"><span>⭐</span>I did something good</button>
    <button class="sorry" id="sorryBtn"><span>💛</span>I need to say sorry</button>
  </div>
  <div class="caption" id="caption"></div>

  <!-- pick a card -->
  <div class="ov" id="cardsOv"><div class="sheet">
    <h3 id="cardsTitle"></h3><div class="sub" id="cardsSub"></div>
    <div class="grid" id="cardGrid"></div>
    <div class="row"><button class="btn no" id="cardsCancel">Back</button><button class="btn yes" id="cardsOk" disabled>Yes, this one!</button></div>
  </div></div>

  <!-- grown-up rating -->
  <div class="ov" id="rateOv"><div class="sheet">
    <div class="grown">👨‍👩‍👧 Grown-up: how big was it?</div>
    <h3 id="rateTitle"></h3>
    <div class="scale" id="rateScale"></div>
    <div class="ex" id="rateEx"></div>
    <div id="howRow" style="display:none">
      <div class="grown" style="margin-top:12px">How did it come out?</div>
      <div class="row"><button class="btn yes" id="ownedBtn" style="background:#db2777">💛 They owned up themselves</button><button class="btn no" id="noticedBtn">👀 A grown-up noticed</button></div>
    </div>
    <div class="row"><button class="btn no" id="rateCancel">Cancel</button></div>
  </div></div>

  <!-- grown-up PIN -->
  <div class="ov pin" id="pinOv"><div class="sheet" style="width:min(420px,94%)">
    <div class="grown">👨‍👩‍👧 Grown-ups only</div><h3 id="pinTitle">Enter the grown-up PIN</h3>
    <div class="dots" id="pinDots"></div>
    <div class="pad" id="pinPad"></div>
    <div class="row"><button class="btn no" id="pinCancel">Cancel</button></div>
  </div></div>

  <!-- who's digging -->
  <div class="ov" id="kidsOv"><div class="sheet">
    <h3>Who’s digging?</h3><div class="sub">Each of you has your own mine and temple.</div>
    <div class="kids" id="kidGrid"></div>
    <div class="row"><button class="btn no" id="kidsClose">Close</button></div>
  </div></div>

  <!-- celebration / reveal -->
  <div class="reveal" id="reveal"><div class="dim"></div><div class="rays"></div>
    <svg class="big" viewBox="-40 -40 80 80"><g class="jump" id="revealJump"><g class="spinny" id="revealArt"></g></g></svg>
    <div class="label" id="revealLabel"></div><div class="hint" id="revealHint">tap to keep going</div></div>

  <!-- grown-ups drawer -->
  <div class="drawer" id="drawer">
    <div style="display:flex;align-items:center;justify-content:space-between"><h2>👨‍👩‍👧 Grown-ups</h2><button class="plain" id="drawerClose" style="min-height:44px;width:60px">✕</button></div>
    <div class="note" id="drawerKid"></div>
    <h4>🔥 If the fire came now…</h4>
    <div id="forecast"></div>
    <button class="hold right" id="rightBtn" style="--hold:.8s">🫂 Make it right (hold)<small>they said sorry: turn a wobbly prop to stone</small></button>
    <button class="hold fire" id="fireBtn" style="--hold:1.2s">🔥 Test by fire (hold)<small>the Sunday family moment</small></button>
    <h4>🏛 Temple</h4>
    <div id="templeInfo"></div>
    <h4>Today</h4>
    <div id="todayInfo" class="note"></div>
    <button class="plain" id="nextDay">🌙 Skip to tomorrow (testing)</button>
    <h4>Prototype tools</h4>
    <button class="plain" id="autoWeek">⏩ Auto-play a week (this child)</button>
    <button class="plain" id="newMine">↺ New mine for this child</button>
  </div>
</div>

<script>
// ---------- gems and actions ----------
const GEMS = {
  carnelian:  ['Carnelian', 'Love', '#ff8a8a', '#e0102f', '#6e0014'],
  topaz:      ['Topaz', 'Joy', '#ffe27a', '#ffa400', '#9a5200'],
  sapphire:   ['Sapphire', 'Peace', '#7ab8ff', '#1450f5', '#081f7a'],
  chalcedony: ['Chalcedony', 'Patience', '#cfc6ff', '#7563ff', '#3424a8'],
  emerald:    ['Emerald', 'Kindness', '#7dffb6', '#00b25e', '#00502b'],
  chrysolite: ['Chrysolite', 'Goodness', '#f1ff7a', '#b4dc00', '#5b7400'],
  jasper:     ['Jasper', 'Faithfulness', '#ffffff', '#c8ecff', '#5aa6cc'],
  beryl:      ['Beryl', 'Gentleness', '#8ff8ff', '#00c2dd', '#00687a'],
  amethyst:   ['Amethyst', 'Self-control', '#eaa8ff', '#a12cff', '#46087f'],
};
const GEM_IDS = Object.keys(GEMS);
// Draft list: swap in the family's own. Good things hide their gem; sorry things put in a wobbly prop.
const GOOD = [
  { e: '🙏', t: 'I stopped to pray', gem: 'gold' },
  { e: '⏳', t: 'I waited patiently', gem: 'chalcedony' },
  { e: '😌', t: 'I stayed calm when I was cross', gem: 'amethyst' },
  { e: '🤝', t: 'I helped without being asked', gem: 'emerald' },
  { e: '🎁', t: 'I shared', gem: 'carnelian' },
  { e: '🙋', t: 'I told the truth', gem: 'chrysolite' },
  { e: '🕊️', t: 'I made peace', gem: 'sapphire' },
  { e: '😄', t: 'I chose a happy attitude', gem: 'topaz' },
  { e: '✋', t: 'I kept my promise', gem: 'jasper' },
  { e: '🪶', t: 'Gentle words and hands', gem: 'beryl' },
];
const SORRY = [
  { e: '😡', t: 'I hit or yelled when I was mad', prop: 'wood' },
  { e: '👊', t: 'I fought with my brother or sister', prop: 'wood' },
  { e: '😭', t: 'I had a tantrum', prop: 'hay' },
  { e: '🙅', t: 'I didn’t listen', prop: 'hay' },
  { e: '🗯️', t: 'I used unkind words', prop: 'stubble' },
];
const GOOD_EX = { 1: 'Said thank you without being reminded', 3: 'Helped a sibling finish their job', 5: 'Forgave someone who really hurt them, or gave up something they really wanted' };
const SORRY_EX = { 1: 'A grumpy word or an eye roll', 3: 'Yelled at a sibling or slammed a door', 5: 'Hurt someone on purpose, or a big lie' };
const BURNS = ['wood', 'hay', 'stubble'];
const PROP_WORD = { wood: 'rotten wood', hay: 'mouldy hay', stubble: 'dry stubble' };
const KIDS = [
  { id: 'eliana', name: 'Eliana', av: '🦋', age: 12 },
  { id: 'annabelle', name: 'Annabelle', av: '🌸', age: 8 },
  { id: 'judah', name: 'Judah', av: '🚀', age: 6 },
];
const DAILY_LOGS = 6, PER_CARD = 2; // so gems can't be farmed by tapping

// ---------- mine and temple layout ----------
const COLS = 14, ROWS = 30, CW = 52, CH = 50, MX = 36, MY = 270;
const ENTRY = { r: 0, c: 7 };
const cx = (c) => MX + c * CW, cy = (r) => MY + r * CH;
const hardness = (r) => Math.min(3, 1 + Math.floor(r / 6));

// Buildings grow in tiers: when one is finished it joins the gallery and a bigger one begins.
const BUILDINGS = [
  { name: 'Altar', map: ['..WW..', '.WWWW.', 'WWWWWW'] },
  { name: 'Chapel', map: ['......S......', '.....DDD.....', '....DDDDD....', '.RRRRRRRRRRR.', '.WWWWWWWWWWW.', '.WWWW...WWWW.', '.WWWW...WWWW.'] },
  { name: 'Temple', map: ['.........S.........', '........DDD........', '.......DDDDD.......', '......DDDDDDD......', '..RRRRRRRRRRRRRRR..', '.RRRRRRRRRRRRRRRRR.', '.WWWWWWWWWWWWWWWWW.', '.WWWWWWWWWWWWWWWWW.', '.WWWWWWWW.WWWWWWWW.', '.WWWWWWW...WWWWWWW.', '.WWWWWWW...WWWWWWW.'] },
  { name: 'Great Temple', map: ['............S............', '...........DDD...........', '..........DDDDD..........', '.........DDDDDDD.........', '........DDDDDDDDD........', '..T..RRRRRRRRRRRRRRR..T..', '.TTTRRRRRRRRRRRRRRRRRTTT.', '.TTTWWWWWWWWWWWWWWWWWTTT.', '.TTTWWWWWWWWWWWWWWWWWTTT.', '.TTTWWWWWWWW.WWWWWWWWTTT.', '.TTTWWWWWWW...WWWWWWWTTT.', '.TTTWWWWWWW...WWWWWWWTTT.'] },
];
const buildingName = (level) => level < BUILDINGS.length ? BUILDINGS[level].name : `City of God · district ${level - BUILDINGS.length + 1}`;
function slotsFor(level) {
  const map = BUILDINGS[Math.min(level, BUILDINGS.length - 1)].map;
  const w = map[0].length, h = map.length;
  const size = Math.min(300 / w, 170 / h, 30);
  const tw = size * 1.15, th = size * 0.85;
  const x0 = 400 - (w * tw) / 2, y0 = 226 - h * th;
  const out = [];
  map.forEach((row, r) => [...row].forEach((ch, c) => { if (ch !== '.') out.push({ r, c, x: x0 + c * tw, y: y0 + r * th, w: tw, h: th }); }));
  out.sort((a, b) => b.r - a.r || Math.abs(a.c - (w - 1) / 2) - Math.abs(b.c - (w - 1) / 2));
  return out;
}

// ---------- per-child state (saved on this device) ----------
let S, kid, busy = false, selected = null, makingRight = false;
const DEV = new URLSearchParams(location.search).has('dev');
// The day comes from the real calendar (a new day starts at 3am, like the rest of the app). Test mode can step it on.
function todayNum() { const d = new Date(Date.now() - 3 * 3600e3); return Math.floor((d - d.getTimezoneOffset() * 60e3) / 864e5); }
let dayOffset = 0;
function syncDay() { if (S.start === undefined) S.start = todayNum() - (S.day - 1); S.day = todayNum() - S.start + 1 + (S.dayOffset || 0); }
const save = () => { try { localStorage.setItem(`mine3.${kid.id}`, JSON.stringify(S)); localStorage.setItem('mine3.kid', kid.id); } catch {} };
function freshState() {
  const cells = [];
  for (let r = 0; r < ROWS; r++) {
    const row = [];
    for (let c = 0; c < COLS; c++) {
      const p = Math.random();
      // Only earned gems glint. The rock holds a little gold and the odd mystery geode.
      const content = r > 0 && p < 0.05 ? 'geode' : r > 0 && p < 0.14 ? 'gold' : 'dirt';
      row.push({ s: 'rock', content, v: Math.floor(Math.random() * 4) });
    }
    cells.push(row);
  }
  Object.assign(cells[ENTRY.r][ENTRY.c], { s: 'tunnel', prop: 'stone', content: 'dirt', entry: true });
  return { cells, swings: 0, day: 1, start: todayNum(), temple: [], level: 0, gallery: [], order: 0, mole: { ...ENTRY }, logs: {}, pearlDay: 0, readAloud: undefined, noticedDays: [], lastOpen: 0 };
}
function loadKid(id) {
  kid = KIDS.find((k) => k.id === id) || KIDS[0];
  try { S = JSON.parse(localStorage.getItem(`mine3.${kid.id}`)); } catch { S = null; }
  if (!S) S = freshState();
  if (S.readAloud === undefined) S.readAloud = kid.age < 8;
  S.noticedDays = S.noticedDays || [];
  syncDay();
  selected = null; makingRight = false;
}

const inside = (r, c) => r >= 0 && r < ROWS && c >= 0 && c < COLS;
const around = (r, c) => [[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]].filter(([a, b]) => inside(a, b));
const cell = (r, c) => S.cells[r][c];
const diggable = (r, c) => cell(r, c).s !== 'tunnel' && around(r, c).some(([a, b]) => cell(a, b).s === 'tunnel');
const digCost = (r, c) => { const k = cell(r, c); return k.soft ? 1 : k.s === 'rubble' ? Math.max(1, hardness(r) - 1) : hardness(r); };
function deepest() { let d = 0; for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (cell(r, c).s === 'tunnel') d = Math.max(d, r); return d; }
function rotCount() { let n = 0; for (const row of S.cells) for (const k of row) if (k.s === 'tunnel' && BURNS.includes(k.prop)) n++; return n; }
// Lots of rot under the temple loosens its top stones: 4 props loosen 1, every 2 more loosen another, up to 5.
const looseCount = () => { const r = rotCount(); return r < 4 ? 0 : Math.min(S.temple.length, 5, Math.floor((r - 4) / 2) + 1); };

// The fire burns wobbly props. That tunnel caves in. If a grown-up noticed (rather than the child owning up),
// tunnels cut off behind it cave in too, up to 3 steps away. Owning up always comes out ahead.
function caveInSet() {
  const burnt = new Map();
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) { const k = cell(r, c); if (k.s === 'tunnel' && BURNS.includes(k.prop)) burnt.set(`${r},${c}`, k.how); }
  const open = new Set([`${ENTRY.r},${ENTRY.c}`]), q = [[ENTRY.r, ENTRY.c]];
  while (q.length) { const [r, c] = q.shift(); for (const [a, b] of around(r, c)) { const key = `${a},${b}`; if (open.has(key) || burnt.has(key) || cell(a, b).s !== 'tunnel') continue; open.add(key); q.push([a, b]); } }
  const lost = [];
  for (const [key, how] of burnt) {
    if (how !== 'noticed') continue;
    const [r0, c0] = key.split(',').map(Number), seen = new Set([key]), qq = [[r0, c0, 0]];
    while (qq.length) {
      const [r, c, d] = qq.shift();
      if (d >= 3) continue;
      for (const [a, b] of around(r, c)) {
        const k2 = `${a},${b}`;
        if (seen.has(k2) || open.has(k2) || cell(a, b).s !== 'tunnel' || burnt.has(k2)) continue;
        seen.add(k2); lost.push(k2); qq.push([a, b, d + 1]);
      }
    }
  }
  return { burnt, lost: [...new Set(lost)] };
}

buildDefs();

function rockFace(x, y, v, rubble) {
  const tints = ['#7a5a3e', '#6f523a', '#806046', '#755740'];
  if (rubble) return `<rect x="${x}" y="${y}" width="${CW}" height="${CH}" fill="#4a3a2c"/><g stroke="#2b2018" stroke-width="1.2"><ellipse cx="${x + 13}" cy="${y + 36}" rx="12" ry="10" fill="#8d7d6b"/><ellipse cx="${x + 36}" cy="${y + 38}" rx="14" ry="10" fill="#7b6b59"/><ellipse cx="${x + 25}" cy="${y + 20}" rx="12" ry="9" fill="#9a8a77"/><ellipse cx="${x + 42}" cy="${y + 14}" rx="8" ry="7" fill="#857562"/></g>`;
  return `<rect x="${x}" y="${y}" width="${CW}" height="${CH}" fill="${tints[v]}"/><path d="M${x + 6} ${y + 14 + v * 3} q8 -4 16 0 M${x + 26} ${y + 34 - v * 2} q8 4 18 -2" stroke="#5a412c" stroke-width="1.4" fill="none"/>`;
}
const art = (t) => t === 'gold' ? '#nugget' : t === 'pearl' ? '#pearlBig' : t === 'geode' ? '#geode' : `#g-${t}`;

// ---------- render ----------
const scene = document.getElementById('scene');
let dusk = false;
function render(fx = {}) {
  const fore = caveInSet();
  const doomed = new Set([...fore.burnt.keys(), ...fore.lost]);
  const near = new Set(); // rocks lit up for digging: next to a tunnel, only when there are swings
  let mine = '', props = '', items = '', flies = '', marks = '';
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const k = cell(r, c), x = cx(c), y = cy(r), key = `${r},${c}`;
    if (k.s === 'tunnel') {
      mine += `<g class="cell" data-r="${r}" data-c="${c}"><rect x="${x}" y="${y}" width="${CW}" height="${CH}" fill="url(#tunnel)"/><ellipse cx="${x + 26}" cy="${y + 30}" rx="30" ry="24" fill="url(#lamp)"/></g>`;
      if (k.prop) props += `<use href="#p-${k.prop}" x="${x}" y="${y}" data-prop="${key}" pointer-events="none"/>`;
      if (k.entry) props += `<path d="M${x + 18} ${y} V${y + CH} M${x + 34} ${y} V${y + CH}" stroke="#a9875e" stroke-width="3"/><path d="M${x + 18} ${y + 12} h16 M${x + 18} ${y + 26} h16 M${x + 18} ${y + 40} h16" stroke="#a9875e" stroke-width="2.5"/>`;
      if (k.pile) items += `<g class="cell ${fx.found === key ? '' : 'bob'}" data-r="${r}" data-c="${c}" style="cursor:pointer"><use href="${art(k.pile)}" x="${x + 26}" y="${y + 30}"/></g>`;
      if (BURNS.includes(k.prop)) for (let f = 0; f < 2; f++) {
        const dur = (1.3 + ((r + c + f) % 4) * .3).toFixed(2);
        flies += `<g transform="translate(${x + 26} ${y + 22})"><g><animateTransform attributeName="transform" type="rotate" from="${f * 180}" to="${f * 180 + ((r + c) % 2 ? 360 : -360)}" dur="${dur}s" repeatCount="indefinite"/><g transform="translate(${12 + f * 5} 0)"><use href="#fly"/></g></g></g>`;
      }
      if (doomed.has(key)) marks += `<rect x="${x + 2}" y="${y + 2}" width="${CW - 4}" height="${CH - 4}" rx="6" fill="rgba(255,40,40,.32)" class="weak" pointer-events="none"/><text x="${x + 26}" y="${y + 14}" text-anchor="middle" font-size="14" pointer-events="none">⚠️</text>`;
    } else {
      const can = diggable(r, c) && S.swings > 0;
      if (can) near.add(key);
      mine += `<g class="cell ${fx.cavein?.has(key) ? 'cavein' : ''}" data-r="${r}" data-c="${c}">${rockFace(x, y, k.v, k.s === 'rubble')}
        ${can ? `<rect x="${x + 2}" y="${y + 2}" width="${CW - 4}" height="${CH - 4}" rx="4" fill="rgba(255,230,150,.16)" stroke="rgba(255,230,150,.55)" stroke-width="2" pointer-events="none"/>` : ''}
        ${selected === key ? `<rect x="${x + 1}" y="${y + 1}" width="${CW - 2}" height="${CH - 2}" rx="5" fill="rgba(255,215,90,.28)" stroke="#ffd34d" stroke-width="4" pointer-events="none"/><text x="${x + 26}" y="${y + 33}" text-anchor="middle" font-size="22" pointer-events="none">⛏</text>` : ''}
        ${k.hits ? `<path d="M${x + 26} ${y + 4} l-6 12 l9 8 l-7 12 l5 10 M${x + 20} ${y + 16} l-12 4" stroke="#1e130a" stroke-width="2.4" fill="none" pointer-events="none"/>` : ''}
        ${can && digCost(r, c) > 1 ? `<g pointer-events="none">${Array.from({ length: digCost(r, c) - (k.hits || 0) }, (_, i) => `<circle cx="${x + 8 + i * 9}" cy="${y + 44}" r="3.4" fill="#ffe9b0" stroke="#5a412c"/>`).join('')}</g>` : ''}</g>`;
      // Earned gems glow with a beacon and the action's emoji, so the child can find what their choice made.
      if (k.earned) {
        const col = k.content === 'gold' ? '#ffd84d' : GEMS[k.content] ? GEMS[k.content][3] : '#fff';
        items += `<g pointer-events="none"><circle cx="${x + 26}" cy="${y + 25}" r="20" fill="none" stroke="${col}" stroke-width="4" class="beacon"/>
          <use href="#star" x="${x + 26}" y="${y + 25}" fill="${col}" stroke="#fff" stroke-width="1"/>
          <g class="arrow"><text x="${x + 26}" y="${y - 4}" text-anchor="middle" font-size="20">${k.earned}</text></g></g>`;
      } else if (k.pile) {
        items += `<g pointer-events="none"><use href="#star" x="${x + 26}" y="${y + 25}" fill="#fff" class="glint"/><text x="${x + 40}" y="${y + 44}" font-size="13">💎</text></g>`;
      } else if (k.content === 'geode') {
        items += `<g pointer-events="none" opacity=".7"><use href="#star" x="${x + 16 + k.v * 5}" y="${y + 18 + k.v * 4}" fill="#cfd2ff" class="glint" style="animation-delay:${(r + c) % 5 * .4}s"/></g>`;
      } else if (k.content === 'gold') {
        items += `<g pointer-events="none"><circle cx="${x + 14 + k.v * 6}" cy="${y + 20 + k.v * 3}" r="2" fill="#ffd84d"/><circle cx="${x + 20 + k.v * 6}" cy="${y + 26 + k.v * 3}" r="1.4" fill="#ffd84d"/></g>`;
      }
    }
  }
  const m = S.mole;
  const golden = S.day >= 7 && !S.noticedDays.some((d) => d > S.day - 7);
  const moleSVG = `<g transform="translate(${cx(m.c) + 26} ${cy(m.r) + 38})" pointer-events="none">${golden ? `<circle cy="-12" r="26" fill="url(#lamp)"/>` : ''}<ellipse cx="0" cy="4" rx="12" ry="9" fill="#5b4636"/><circle cx="0" cy="-6" r="9" fill="#6b5442"/><circle cx="-3.5" cy="-8" r="1.6" fill="#111"/><circle cx="3.5" cy="-8" r="1.6" fill="#111"/><ellipse cx="0" cy="-3" rx="3.2" ry="2.4" fill="#ff9db0"/><path d="M-6 -15 q6 -6 12 0 v3 h-12z" fill="${golden ? 'url(#gold)' : '#f2c94c'}" stroke="${golden ? '#fff3a0' : 'none'}"/><circle cx="0" cy="-15" r="2" fill="#fff8c8"/></g>`;
  scene.innerHTML = DEFS + `
    <rect x="0" y="-200" width="800" height="462" fill="url(#${dusk ? 'skyDusk' : 'sky'})"/>
    <circle cx="690" cy="60" r="34" fill="${dusk ? '#ff9a5a' : '#ffe27a'}" opacity=".9"/>
    <path d="M0 262 Q200 200 400 214 T 800 250 V262Z" fill="#8fcf72"/>
    <rect x="0" y="250" width="800" height="20" fill="#6fb35a"/>
    <rect x="0" y="262" width="800" height="${ROWS * CH + 400}" fill="#3a2a1d"/>
    ${galleryArt()}
    <rect x="250" y="226" width="300" height="22" rx="4" fill="url(#marble)" stroke="#cdbb93"/>
    <text x="400" y="242" text-anchor="middle" font-size="12" font-weight="900" fill="#b8860b" letter-spacing="1.5">✝ JESUS CHRIST · THE FOUNDATION ✝</text>
    ${templeArt()}
    <path d="M${cx(ENTRY.c) + 26} 248 V${cy(0)}" stroke="#a9875e" stroke-width="4"/>
    <g id="mine">${mine}</g><g>${props}</g><g>${items}</g><g pointer-events="none">${flies}</g><g>${marks}</g>${moleSVG}<g id="fx"></g>`;
  renderHud(fore);
  save();
}

function templeArt() {
  const slots = slotsFor(S.level), loose = looseCount();
  let s = '<g id="temple">';
  slots.forEach((sl, i) => {
    const t = S.temple[i];
    if (t) s += `<g class="tstone ${i >= S.temple.length - loose ? 'loose' : ''}" data-ti="${i}" style="animation-delay:${(i % 4) * -.12}s"><use href="#t-${t}" transform="translate(${sl.x} ${sl.y}) scale(${sl.w / 30} ${sl.h / 22})"/></g>`;
    else s += `<rect x="${sl.x + .5}" y="${sl.y + .5}" width="${sl.w - 1}" height="${sl.h - 1}" rx="2" fill="rgba(255,255,255,.2)" stroke="#fff" stroke-dasharray="2 2" opacity=".6"/>`;
  });
  return s + `</g><text x="400" y="${slots.reduce((m, sl) => Math.min(m, sl.y), 999) - 8}" text-anchor="middle" font-size="13" font-weight="900" fill="#fff" stroke="#3b2a10" stroke-width="3" paint-order="stroke">${buildingName(S.level)} · ${S.temple.length}/${slots.length}</text>`;

function chime(notes, type = 'sine') {

}
function thud() {

let pinUntil = 0;
function needPin() {
  if (Date.now() < pinUntil) return Promise.resolve(true);
  let saved = null; try { saved = localStorage.getItem('mine3.pin'); } catch {}
  return new Promise((res) => {
    let entry = '', first = null;
    const title = document.getElementById('pinTitle'), dots = document.getElementById('pinDots');
    title.textContent = saved ? 'Enter the grown-up PIN' : 'Choose a 4-digit grown-up PIN';
    const show = () => { dots.textContent = '●'.repeat(entry.length) + '○'.repeat(4 - entry.length); };
    show();
    document.getElementById('pinPad').innerHTML = [1, 2, 3, 4, 5, 6, 7, 8, 9, '', 0, '⌫'].map((d) => d === '' ? '<span></span>' : `<button class="btn no" data-d="${d}">${d}</button>`).join('');
    const done = (ok) => { ov('pinOv', false); document.getElementById('pinPad').onclick = null; if (ok) pinUntil = Date.now() + 120e3; res(ok); };
    document.getElementById('pinPad').onclick = (e) => {

      else { first = null; entry = ''; title.textContent = 'They didn’t match. Choose a PIN'; setTimeout(show, 300); }

// The gem a good thing makes is hidden right next to the mole, in rock soft enough to break with one swing.
function seedGem(gem, emoji, size) {
  const m = S.mole, opts = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const k = cell(r, c);
    if (k.s === 'tunnel' || !diggable(r, c) || k.earned || k.pile) continue;
    opts.push({ r, c, d: Math.abs(r - m.r) + Math.abs(c - m.c), dirt: k.content === 'dirt' });
  }
  if (!opts.length) return null;
  if (opts.some((o) => o.dirt)) opts.splice(0, opts.length, ...opts.filter((o) => o.dirt));
  opts.sort((a, b) => a.d - b.d);
  const pickFrom = opts.slice(0, 3), spot = pickFrom[Math.floor(Math.random() * pickFrom.length)];
  Object.assign(cell(spot.r, spot.c), { content: gem, earned: emoji, soft: true, size });
  return spot;
}

// A sorry thing puts wobbly props in, starting where the mole is.
function placeRot(prop, how) {
  const seen = new Set([`${S.mole.r},${S.mole.c}`]), q = [[S.mole.r, S.mole.c]];
  while (q.length) {
    const [r, c] = q.shift(), k = cell(r, c);
    if (k.s === 'tunnel' && !k.entry && k.prop === 'stone') { k.prop = prop; k.how = how; return [r, c]; }
    for (const [a, b] of around(r, c)) { const key = `${a},${b}`; if (!seen.has(key) && cell(a, b).s === 'tunnel') { seen.add(key); q.push([a, b]); } }
  }
  return null;
}

function nearestTunnel(r, c) { for (const [a, b] of around(r, c)) if (cell(a, b).s === 'tunnel') return { r: a, c: b }; return S.mole; }

function swing(r, c) {
  const k = cell(r, c);
  S.swings--;
  k.hits = (k.hits || 0) + 1;
  const need = digCost(r, c);

    if (S.swings === 0) caption(`Crack! ${need - k.hits} more swing${need - k.hits === 1 ? '' : 's'} next time.`, 2200);
    return;
  }
  const found = k.pile || (k.content !== 'dirt' ? (k.content === 'geode' ? geodeGem(r) : k.content) : null);
  const size = k.size || 2, earned = k.earned;
  Object.assign(k, { s: 'tunnel', prop: 'stone', content: 'dirt', hits: 0, earned: null, soft: false, size: 0, pile: found, order: ++S.order });

  render({ found: found ? `${r},${c}` : null });
  scene.classList.remove('bigshake'); void scene.getBoundingClientRect(); scene.classList.add('bigshake');
  for (let i = 0; i < 10; i++) particle('rect', { x: cx(c) + 22, y: cy(r) + 22, width: 6, height: 5, fill: '#8a6a4c' }, 'shard', 800,
    { '--sx': `${(Math.random() * 90 - 45).toFixed(0)}px`, '--sy': `${(Math.random() * 70 - 45).toFixed(0)}px` });
  if (!found) { chime([330]); return; }
  chime(found === 'gold' ? [660, 880, 1100] : [660, 880, 1100, 1320, 1760]);
  const label = found === 'gold' ? `🟨 Gold!<small>${earned ? 'From your prayer' : 'A gold nugget'}</small>`
    : found === 'pearl' ? '⚪ A pearl!<small>Pearls grow where something hurt</small>'
    : `💎 ${size >= 4 ? 'Huge ' : ''}${GEMS[found][0]}!<small>${GEMS[found][1]}${earned ? ` · from “${earned}”` : ' · from a mystery geode!'}</small>`;
  busy = true;
  const flawless = size >= 5;
  bigReveal(art(found), 1.5 + size * 0.25, flawless ? label.replace('💎 ', '🌈 Flawless ') : label, screenOf(r, c), { hint: '👆 tap to send it to your temple!', rainbow: flawless, ms: 4000 })
    .then(() => { busy = false; sendUp(r, c); });
}
// Mystery geodes hold a random gem (rarer ones deeper down) or gold.
function geodeGem(r) { return Math.random() < 0.3 ? 'gold' : GEM_IDS[Math.floor(Math.random() * Math.min(GEM_IDS.length, 3 + Math.floor(r / 3)))]; }

// ---------- the temple ----------
async function sendUp(r, c) {
  const k = cell(r, c), slots = slotsFor(S.level);
  if (!k.pile) return;
  if (S.temple.length >= slots.length) await finishBuilding();
  return sendUpNow(r, c);
}
async function sendUpNow(r, c) {
  const k = cell(r, c), slots = slotsFor(S.level);
  const t = k.pile; k.pile = null;
  const sl = slots[S.temple.length];
  render();
  cam.ty = 0;
  particle('use', { href: art(t), x: cx(c) + 26, y: cy(r) + 30 }, 'fly-up', 950, { '--tx': `${sl.x + sl.w / 2 - cx(c) - 26}px`, '--ty': `${sl.y + sl.h / 2 - cy(r) - 30}px` });
  chime([880, 1320]);
  await wait(950);
  S.temple.push(t);
  render();
  scene.querySelector(`.tstone[data-ti="${S.temple.length - 1}"]`)?.classList.add('land');
  chime([1760, 2640], 'triangle');
  setTimeout(() => aim(S.mole.r), 900);
  if (S.temple.length >= slots.length) { await wait(500); await finishBuilding(); }
}
function confetti() {
  const cols = Object.values(GEMS).map((g) => g[3]);
  for (let i = 0; i < 60; i++) {
    const d = document.createElement('div'); d.className = 'confetti';
    d.style.left = `${Math.random() * 100}vw`; d.style.background = cols[i % cols.length];
    d.style.setProperty('--x', `${Math.random() * 200 - 100}px`); d.style.setProperty('--d', `${2 + Math.random() * 1.5}s`);
    d.style.animationDelay = `${Math.random() * 0.8}s`;
    document.body.appendChild(d); setTimeout(() => d.remove(), 4000);
  }
}
async function finishBuilding() {
  const name = buildingName(S.level);
  confetti();
  chime([523, 659, 784, 1047, 1319, 1568]);
  await bigReveal('<g><polygon points="-30,0 0,-24 30,0" fill="url(#gold)" stroke="#8f6206"/><rect x="-24" y="0" width="48" height="30" fill="url(#gold)" stroke="#8f6206"/><rect x="-6" y="12" width="12" height="18" fill="#7a4b10"/></g>', 1,
    `⛪ ${name} finished!<small>Built on Jesus, the foundation. Next: the ${buildingName(S.level + 1)}!</small>`, null, { ms: 4200 });
  S.gallery.push(name); S.level++; S.temple = [];
  render();
}

// ---------- grown-ups: make it right, the fire, days ----------
function fixProp(r, c) {
  const k = cell(r, c);
  if (k.s !== 'tunnel' || !BURNS.includes(k.prop)) { makingRight = false; caption('Okay, stopped. (To make it right, tap a prop with flies.)', 2400); return; }
  const was = k.prop;
  Object.assign(k, { prop: 'stone', how: null });
  let pearl = false;
  if (S.pearlDay !== S.day && !k.pile) { k.pile = 'pearl'; S.pearlDay = S.day; pearl = true; }
  makingRight = false;
  render({ found: `${r},${c}` });
  chime([523, 659, 784, 1047]);
  caption(`🫂 Made it right! The ${PROP_WORD[was]} became stone${pearl ? ', and a pearl appeared' : ''}.`, 3200, 'love');
}
holdable(document.getElementById('rightBtn'), 800, () => {
  if (!rotCount()) return caption('No wobbly props to fix. 👍', 2200, 'joy');
  makingRight = true; document.getElementById('drawer').classList.remove('show');
  setTimeout(() => { if (makingRight) { makingRight = false; capEl.classList.remove('show'); } }, 20000);
  caption('🫂 Tap the wobbly prop to make it right.', 0, 'love');
});
holdable(document.getElementById('fireBtn'), 1200, () => { document.getElementById('drawer').classList.remove('show'); fire(); });

async function fire() {
  if (busy) return;
  busy = true;
  dusk = true; render(); cam.ty = 0;
  chime([196, 247, 294]);
  caption('🔥 The fire shows what lasts.<em>Jesus is the foundation. He is safe, and so are you. (1 Corinthians 3)</em>', 0);
  await wait(1500);
  const dist = { [`${ENTRY.r},${ENTRY.c}`]: 0 }, q = [[ENTRY.r, ENTRY.c, 0]];
  while (q.length) { const [r, c, d] = q.shift(); for (const [a, b] of around(r, c)) { const key = `${a},${b}`; if (key in dist || cell(a, b).s !== 'tunnel') continue; dist[key] = d + 1; q.push([a, b, d + 1]); } }
  const deepRow = Math.max(...Object.keys(dist).map((k) => Number(k.split(',')[0])));
  aim(Math.min(deepRow, 6));
  for (const [key, d] of Object.entries(dist)) {
    const [r, c] = key.split(',').map(Number), k = cell(r, c);
    setTimeout(() => {
      particle('use', { href: '#flame', x: cx(c) + 11, y: cy(r) + 16 }, 'flame', BURNS.includes(k.prop) ? 1300 : 600);
      if (BURNS.includes(k.prop)) scene.querySelector(`use[data-prop="${key}"]`)?.classList.add('char');
    }, 300 + d * 130);
  }
  await wait(900 + Math.max(...Object.values(dist)) * 130 + 900);
  cam.ty = 0;
  document.getElementById('temple')?.classList.add('refine');
  caption('✨ Gold and precious stones: refined!', 0, 'joy');
  chime([660, 880, 1100, 1320]);
  await wait(1800);
  const loosen = looseCount();
  const { burnt, lost } = caveInSet();
  const fallen = new Set([...burnt.keys(), ...lost]);
  let buried = 0;
  for (const key of fallen) { const [r, c] = key.split(',').map(Number), k = cell(r, c); if (k.pile) buried++; Object.assign(k, { s: 'rubble', prop: null, how: null }); }
  if (fallen.has(`${S.mole.r},${S.mole.c}`)) S.mole = { ...ENTRY };
  let dropped = 0;
  if (loosen) {
    caption('🏛 Too many wobbly props under the temple… the top stones are falling!', 0, 'danger');
    await wait(1200);
    [...scene.querySelectorAll('.tstone')].slice(-loosen).forEach((g, i) => {
      const sl = slotsFor(S.level)[Number(g.dataset.ti)];
      g.classList.remove('loose');
      g.style.setProperty('--tx', `${cx(ENTRY.c) + 26 - sl.x}px`); g.style.setProperty('--ty', `${cy(2) - sl.y}px`);
      g.style.setProperty('--rot', `${(Math.random() * 400 - 200).toFixed(0)}deg`); g.style.animationDelay = `${i * 0.15}s`;
      g.classList.add('tumble');
    });
    chime([400, 300, 200]);
    await wait(1800 + loosen * 150);
    const spots = [...fallen].map((k) => k.split(',').map(Number));
    for (let i = spots.length - 1; i >= 0; i--) if (cell(...spots[i]).pile) spots.splice(i, 1);
    for (let r = 1; r < 8 && spots.length < loosen * 3; r++) for (let c = 0; c < COLS; c++) if (cell(r, c).s !== 'tunnel' && !cell(r, c).pile) spots.push([r, c]);
    for (let i = 0; i < loosen; i++) {
      const t = S.temple.pop(), [r, c] = spots.splice(Math.floor(Math.random() * Math.min(spots.length, 8)), 1)[0] || [1, 0];
      if (cell(r, c).s === 'tunnel') cell(r, c).s = 'rubble';
      cell(r, c).pile = t; dropped++;
    }
  }
  dusk = false;
  aim(S.mole.r);
  render({ cavein: fallen });
  if (fallen.size) { thud(); scene.classList.remove('bigshake'); void scene.getBoundingClientRect(); scene.classList.add('bigshake'); }
  for (const key of fallen) {
    const [r, c] = key.split(',').map(Number);
    for (let i = 0; i < 4; i++) particle('circle', { cx: cx(c) + 26, cy: cy(r) + 25, r: 6, fill: '#a68b6c', opacity: .7 }, 'dust', 1300, { '--sx': `${(Math.random() * 60 - 30).toFixed(0)}px`, '--sy': `${(Math.random() * 40 - 30).toFixed(0)}px` });
  }
  await wait(900);
  // What lasted is rewarded (1 Cor 3:14): a swing for every 5 stone-propped tunnels that held, and a gold crown stone if nothing burned.
  let held = 0;
  for (const row of S.cells) for (const k of row) if (k.s === 'tunnel' && k.prop === 'stone' && !k.entry) held++;
  const bonus = Math.min(5, Math.floor(held / 5));
  S.swings += bonus;
  const crown = !burnt.size && S.temple.length < slotsFor(S.level).length;
  if (crown) S.temple.push('gold');
  cam.ty = 0; render();
  document.getElementById('temple')?.classList.add('refine');
  if (fallen.size || dropped) {
    chime([220, 180, 140]);
    caption(`💥 ${fallen.size} tunnel${fallen.size === 1 ? '' : 's'} of old wood burned away.${buried ? ` ${buried} gem${buried === 1 ? ' is' : 's are'} buried.` : ''}${dropped ? ` ${dropped} temple stone${dropped === 1 ? '' : 's'} fell into the mine.` : ''}<em>You’re still safe on Jesus. Your work that lasted: +${bonus} ⛏. Let’s dig again!</em>`, 8000, 'danger');
  } else {
    confetti();
    caption(`🕊️ Everything held! What you built with God remains.<em>${crown ? 'A gold crown stone for your temple, and ' : ''}+${bonus} ⛏</em>`, 6000, 'joy');
  }
  if (S.temple.length >= slotsFor(S.level).length) { await wait(2500); await finishBuilding(); }
  busy = false;
}

document.getElementById('nextDay').onclick = () => { S.dayOffset = (S.dayOffset || 0) + 1; syncDay(); render(); firstOpen(); };
document.getElementById('newMine').onclick = () => { if (confirm(`Start a new mine for ${kid.name}?`)) { S = freshState(); S.readAloud = kid.age < 8; render(); } };
document.getElementById('autoWeek').onclick = () => { autoWeek(); document.getElementById('drawer').classList.remove('show'); };
function autoWeek() {
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  for (let d = 0; d < 7; d++) {
    S.dayOffset = (S.dayOffset || 0) + 1; syncDay();
    for (let i = 0; i < 4; i++) { const a = pick(GOOD), n = 1 + Math.floor(Math.random() * 3); S.swings += n; seedGem(a.gem, a.e, n); }
    if (Math.random() < 0.5) { const a = pick(SORRY); placeRot(a.prop, Math.random() < 0.7 ? 'owned' : 'noticed'); }
    let guard = 200;
    while (S.swings > 0 && guard--) {
      const opts = [];
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (diggable(r, c)) { const k = cell(r, c); opts.push({ r, c, s: (k.earned ? 10 : 0) + (k.content !== 'dirt' ? 2 : 0) + r * 0.3 + Math.random() }); }
      if (!opts.length) break;
      opts.sort((a, b) => b.s - a.s);
      const t = opts[0], k = cell(t.r, t.c);
      S.swings--; k.hits = (k.hits || 0) + 1;
      if (k.hits >= digCost(t.r, t.c)) {
        const found = k.pile || (k.content !== 'dirt' ? (k.content === 'geode' ? geodeGem(t.r) : k.content) : null);
        Object.assign(k, { s: 'tunnel', prop: 'stone', content: 'dirt', hits: 0, earned: null, soft: false, pile: found, order: ++S.order });
        S.mole = { r: t.r, c: t.c };
      }
    }
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const k = cell(r, c), slots = slotsFor(S.level);
      if (k.s === 'tunnel' && k.pile && Math.random() < 0.8) { S.temple.push(k.pile); k.pile = null; if (S.temple.length >= slots.length) { S.gallery.push(buildingName(S.level)); S.level++; S.temple = []; } }
    }
  }
  aim(S.mole.r); render();
}

// ---------- top bar ----------
document.getElementById('goodBtn').onclick = () => openCards('good');
document.getElementById('sorryBtn').onclick = () => openCards('sorry');
document.getElementById('lookBtn').onclick = () => { cam.ty = cam.ty > 5 ? 0 : Math.max(0, Math.min(MAX_Y, (S.mole.r - 5) * CH)); };
document.getElementById('speakBtn').onclick = () => { S.readAloud = !S.readAloud; render(); if (S.readAloud) speak('Read aloud is on.', true); };
document.getElementById('grownBtn').onclick = async () => { if (await needPin()) document.getElementById('drawer').classList.add('show'); };
document.getElementById('drawerClose').onclick = () => document.getElementById('drawer').classList.remove('show');
document.getElementById('whoChip').onclick = () => {
  document.getElementById('kidGrid').innerHTML = KIDS.map((k) => `<button class="kid" data-k="${k.id}"><span class="av">${k.av}</span>${k.name}</button>`).join('');
  ov('kidsOv', true);
};
document.getElementById('kidsClose').onclick = () => ov('kidsOv', false);
document.addEventListener('visibilitychange', () => { if (!document.hidden && S) { syncDay(); render(); firstOpen(); } });
document.getElementById('kidGrid').addEventListener('click', (e) => {
  const b = e.target.closest('[data-k]'); if (!b) return;
  save(); loadKid(b.dataset.k); ov('kidsOv', false); aim(S.mole.r); render();
  if (S.lastOpen === S.day) caption(`${kid.av} Hi ${kid.name}! Let’s dig.`, 2000, 'joy'); else firstOpen();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { makingRight = false; capEl.classList.remove('show'); } });
capEl.style.pointerEvents = 'none';

// ---------- start ----------
let startKid = 'judah';
try { startKid = localStorage.getItem('mine3.kid') || 'judah'; } catch {}
const params = new URLSearchParams(location.search);
if (params.get('kid')) startKid = params.get('kid');
loadKid(startKid);
if (params.get('fresh')) { S = freshState(); S.readAloud = kid.age < 8; }
for (let i = 0; i < (Number(params.get('weeks')) || 0); i++) autoWeek();
aim(S.mole.r);
render();
if (!params.get('weeks') && !params.has('nointro')) firstOpen();
</script>
